      c.rotate(-0.34 - Math.min(0.2, Math.max(0, b.vel) * 0.02) + Math.sin(T * 16) * 0.03 * b.wob);
      c.lineJoin = "round";

      // mouthpiece
      const mg = c.createLinearGradient(0, -6 * S, 0, 6 * S);
      mg.addColorStop(0, "#FF93A8"); mg.addColorStop(0.45, "#E23C5C"); mg.addColorStop(1, "#9C1F36");
      c.fillStyle = mg; rr(c, -13 * S, -4.4 * S, 20 * S, 8.8 * S, 2.6 * S); c.fill();
      c.fillStyle = "rgba(255,255,255,.3)"; rr(c, -11 * S, -3.4 * S, 15 * S, 1.6 * S, 0.8 * S); c.fill();

      // paper tube: unrolls, tapers, sags as the air runs out
      const L = 74 * S * Math.min(1, ext);
      const coil = 2.6 * Math.max(0, 1 - ext);
      const droop = (1 - Math.min(1, ext)) * 16 * S;
      const wob = Math.sin(T * 21) * 1.8 * S * ext;
      const pt = t => [7 * S + t * L, -Math.sin(t * 0.85) * 3 * S - t * t * droop + Math.sin(t * 6.5 + T * 17) * wob * t];
      const N = 18, half = t => (5.6 - 3.4 * t) * S;
      const top = [], bot = [];
      for (let i = 0; i <= N; i++) { const t = i / N, [px, py] = pt(t); top.push([px, py - half(t)]); bot.push([px, py + half(t)]); }
      const body = new Path2D();
      body.moveTo(top[0][0], top[0][1]);
      top.forEach(p => body.lineTo(p[0], p[1]));
      for (let i = bot.length - 1; i >= 0; i--) body.lineTo(bot[i][0], bot[i][1]);
      body.closePath();
      const pg = c.createLinearGradient(0, -8 * S, 0, 8 * S);
      pg.addColorStop(0, "#FFE9A6"); pg.addColorStop(0.42, "#FFC93C"); pg.addColorStop(1, "#D98A12");
      c.fillStyle = pg; c.fill(body);
      c.save(); c.clip(body);
      c.strokeStyle = "#8fb0ff"; c.lineWidth = 2.6 * S;
      for (let sx = 4 * S; sx < 10 * S + L + 14 * S; sx += 10 * S) {
        c.beginPath(); c.moveTo(sx, -10 * S); c.lineTo(sx - 7 * S, 10 * S); c.stroke();
      }
      c.strokeStyle = "rgba(255,255,255,.4)"; c.lineWidth = 1.3 * S;
      c.beginPath(); top.forEach((p, i) => i ? c.lineTo(p[0], p[1] + 1.3 * S) : c.moveTo(p[0], p[1] + 1.3 * S)); c.stroke();
      c.restore();
      c.strokeStyle = "rgba(150,90,10,.4)"; c.lineWidth = 0.8; c.stroke(body);

      // the part still rolled up at the tip
      const [ex, ey] = pt(1);
      if (coil > 0.02) {
        c.save(); c.translate(ex, ey);
        c.strokeStyle = "#FFC93C"; c.lineCap = "round"; c.lineWidth = 3.6 * S;
        c.beginPath();
        const steps = 22, maxA = coil * Math.PI * 2, r0 = 8 * S * Math.min(1, coil);
        for (let i = 0; i <= steps; i++) {
          const a = (i / steps) * maxA, r = r0 * (1 - i / steps * 0.55);
          const px = Math.sin(a) * r, py = r0 - Math.cos(a) * r;
          i ? c.lineTo(px, py) : c.moveTo(px, py);
        }
        c.stroke();
        c.strokeStyle = "#8fb0ff"; c.lineWidth = 1.3 * S; c.stroke();
        c.restore();
      }
      c.restore();
    }
  }
}
</script>
<script>/* ===================== LIGHT BRIDGE + FINAL SKY ===================== */
/* ===================== LIGHT BRIDGE =====================
   One canvas that lives ABOVE the scene stack and carries light across a scene
   change, so the world never cuts to black. Three jobs:
     rise()   — the wish embers keep climbing while the garden becomes night
     carry()  — the sky lantern's warm light descends and becomes the candle glow
     settle() — the candle glow lifts away and becomes stars
   It only runs during a transition and stops itself the moment it is done. */
class LightBridge {
  constructor(cv) {
    this.cv = cv;
    this.p = [];
    this.orb = null;
    this.running = false;
    this.reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    this._onResize = () => this.resize();
    this.resize();
    addEventListener("resize", this._onResize);
  }
  resize() { const a = fitCanvas(this.cv); this.c = a.c; this.w = a.w; this.h = a.h; }

  show() { this.cv.classList.add("show"); }
  hide() { this.cv.classList.remove("show"); }

  /* embers climbing out of the wish candle */
  rise(n = 34, from) {
    const { w, h } = this;
    const x0 = from ? from.x : w * 0.5, y0 = from ? from.y : h * 0.72;
    for (let i = 0; i < (this.reduced ? 12 : n); i++) {
      this.p.push({
        x: x0 + rnd(-w * 0.09, w * 0.09), y: y0 + rnd(-20, 40),
        vy: -rnd(90, 240), vx: rnd(-26, 26), r: rnd(1, 2.8),
        p: rnd(0, 6.3), sp: rnd(1, 2.4), life: rnd(1.6, 3.2), age: 0,
        col: pick(["#FFD79A", "#FFC06E", "#FFF0C8", "#FFB77A"])
      });
    }
    this.start();
  }

  /* the single warm light that travels between two scenes.
     dur is in seconds; onArrive fires exactly once, when it lands. */
  carry(from, to, dur, onArrive) {
    this.orb = {
      x0: from.x, y0: from.y, s0: from.s == null ? 1 : from.s,
      x1: to.x, y1: to.y, s1: to.s == null ? 1 : to.s,
      t: 0, dur, fired: false, onArrive: onArrive || null,
      bow: (to.y > from.y ? 1 : -1) * rnd(0.06, 0.14)
    };
    this.start();
  }

  start() {
    this.show();
    if (this.running) return;
    this.running = true;
    this.last = performance.now();
    this.loop();
  }
  stop() { this.running = false; if (this._raf) cancelAnimationFrame(this._raf); this._raf = 0; }
  clear() {
    this.stop();
    this.p = []; this.orb = null;
    this.hide();
    if (this.c) this.c.clearRect(0, 0, this.w, this.h);
  }
  destroy() { this.stop(); removeEventListener("resize", this._onResize); }

  loop() {
    if (!this.running) return;
    const now = performance.now();
    const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    const { c, w, h } = this;
    c.clearRect(0, 0, w, h);
    c.save();
    c.globalCompositeOperation = "lighter";

    /* embers */
    this.p = this.p.filter(e => {
      e.age += dt;
      const k = 1 - e.age / e.life;
      if (k <= 0) return false;
      e.vy += 26 * dt;                   // they slow as they climb
      e.x += (e.vx + Math.sin(e.age * e.sp + e.p) * 22) * dt;
      e.y += e.vy * dt;
      const a = Math.min(1, k * 1.6) * 0.85;
      const g = c.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 7);
      g.addColorStop(0, e.col);
      g.addColorStop(0.3, `rgba(255,180,110,${(a * 0.5).toFixed(3)})`);
      g.addColorStop(1, "rgba(255,150,80,0)");
      c.globalAlpha = a;
      c.fillStyle = g;
      c.beginPath(); c.arc(e.x, e.y, e.r * 7, 0, 6.3); c.fill();
      c.globalAlpha = a;
      c.fillStyle = "#FFF3D8";
      c.beginPath(); c.arc(e.x, e.y, e.r * 0.7, 0, 6.3); c.fill();
      return true;
    });

    /* the travelling warm light */
    const o = this.orb;
    if (o) {
      o.t = Math.min(1, o.t + dt / o.dur);
      const e = easeInOut(o.t);
      const x = mix(o.x0, o.x1, e);
      // a gentle arc rather than a straight line — it reads as falling light
      const y = mix(o.y0, o.y1, e) + Math.sin(e * Math.PI) * (o.y1 - o.y0) * o.bow;
      const s = mix(o.s0, o.s1, e);
      const R = Math.max(w, h) * 0.55 * s;
      const warm = c.createRadialGradient(x, y, 0, x, y, R);
      warm.addColorStop(0, "rgba(255,248,225,.95)");
      warm.addColorStop(0.06, "rgba(255,214,140,.72)");
      warm.addColorStop(0.22, "rgba(255,168,86,.28)");
      warm.addColorStop(0.55, "rgba(255,138,66,.09)");
      warm.addColorStop(1, "rgba(255,130,60,0)");
      c.globalAlpha = 1;
      c.fillStyle = warm;
      c.beginPath(); c.arc(x, y, R, 0, 6.3); c.fill();
      // core
      c.fillStyle = "rgba(255,252,240,.95)";
      c.beginPath(); c.arc(x, y, Math.max(1.5, 7 * s), 0, 6.3); c.fill();
      // a few sparks trail behind it
      if (!this.reduced && Math.random() < 0.55) {
        this.p.push({
          x, y, vx: rnd(-18, 18), vy: rnd(-30, 10), r: rnd(0.7, 1.8),
          p: rnd(0, 6.3), sp: rnd(1, 2), life: rnd(0.7, 1.5), age: 0,
          col: pick(["#FFD79A", "#FFF0C8"])
        });
      }
      if (o.t >= 1 && !o.fired) {
        o.fired = true;
        if (o.onArrive) o.onArrive();
        this.orb = null;
      }
    }
    c.restore();

    if (!this.p.length && !this.orb) { this.running = false; this.hide(); return; }
    this._raf = requestAnimationFrame(() => this.loop());
  }
}

/* ===================== FINAL SKY =====================
   The calm ending: a slow pull-back, a warm horizon that came from the candles,
   drifting stars and two or three lanterns still out there somewhere. Quiet on purpose. */
class FinalSky {
  constructor(cv) {
    this.cv = cv; this.running = false;
    this.reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    this._onResize = () => this.resize();
    this.resize();
    addEventListener("resize", this._onResize);
  }
  resize() {
    const a = fitCanvas(this.cv); this.c = a.c; this.w = a.w; this.h = a.h;
    const n = this.reduced ? 60 : 150;
    this.stars = Array.from({ length: n }, () => ({
      x: rnd(0, this.w), y: rnd(0, this.h * 0.92), r: rnd(0.4, 1.6),
      p: rnd(0, 6.3), sp: rnd(0.25, 0.9), z: rnd(0.3, 1),
      col: Math.random() < 0.14 ? "#CBD5E1" : "#FFFFFF"
    }));
    this.far = Array.from({ length: this.reduced ? 2 : 5 }, (_, i) => ({
      x: rnd(this.w * 0.1, this.w * 0.9), y: rnd(this.h * 0.18, this.h * 0.62),
      s: rnd(0.16, 0.32), vy: -rnd(2.4, 6), sw: rnd(0, 6.3), seed: rnd(0, 40)
    }));
    this.motes = Array.from({ length: this.reduced ? 8 : 26 }, () => ({
      x: rnd(0, this.w), y: rnd(0, this.h), r: rnd(0.5, 1.5),
      vy: -rnd(3, 12), vx: rnd(-4, 4), p: rnd(0, 6.3), a: rnd(0.1, 0.3)
    }));
  }
  start() { if (this.running) return; this.running = true; this.t0 = performance.now(); this.last = this.t0; this.loop(); }
  stop() { this.running = false; if (this._raf) cancelAnimationFrame(this._raf); this._raf = 0; }
  reset() { this.t0 = performance.now(); this.resize(); }
  destroy() { this.stop(); removeEventListener("resize", this._onResize); }
  loop() {
    if (!this.running) return;
    const now = performance.now();
    const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    const T = (now - this.t0) / 1000;
    const { c, w, h } = this;

    // slow pull-back: the world settles away from you at the end
    const zoom = 1.06 - easeOut(clamp01(T / 9)) * 0.06;
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#0f172a"); g.addColorStop(0.55, "#070c1c"); g.addColorStop(1, "#000000");
    c.fillStyle = g; c.fillRect(0, 0, w, h);

    c.save();
    c.translate(w / 2, h / 2); c.scale(zoom, zoom); c.translate(-w / 2, -h / 2);

    // the warm light from the cake candles, now low on the horizon
    const gl = c.createRadialGradient(w * 0.5, h * 1.02, 10, w * 0.5, h * 1.02, h * 0.85);
    gl.addColorStop(0, `rgba(255,190,120,${(0.17 + Math.sin(T * 0.18) * 0.04).toFixed(3)})`);
    gl.addColorStop(0.5, "rgba(255,160,100,.05)");
    gl.addColorStop(1, "rgba(255,190,120,0)");
    c.fillStyle = gl; c.fillRect(0, 0, w, h);

    c.save(); c.globalCompositeOperation = "lighter";
    for (const s of this.stars) {
      const tw = 0.22 + 0.6 * Math.abs(Math.sin(T * s.sp + s.p));
      c.globalAlpha = tw * (0.45 + s.z * 0.55) * Math.min(1, T / 2.2);
      c.fillStyle = s.col;
      c.beginPath(); c.arc(s.x, s.y - T * 1.2 * s.z, s.r, 0, 6.3); c.fill();
      if (s.r > 1.25) {
        c.globalAlpha *= 0.35;
        c.beginPath(); c.arc(s.x, s.y - T * 1.2 * s.z, s.r * 3.6, 0, 6.3); c.fill();
      }
    }
    // a few lanterns still up there, very far away
    for (const l of this.far) {
      l.y += l.vy * dt; l.sw += dt * 0.4;
      l.x += Math.sin(l.sw) * 4 * dt;
      if (l.y < -30) { l.y = h * 0.8; l.x = rnd(w * 0.1, w * 0.9); }
      const a = 0.5 * Math.min(1, T / 3);
      const gg = c.createRadialGradient(l.x, l.y, 0, l.x, l.y, 26 * l.s * 6);
      gg.addColorStop(0, `rgba(255,206,130,${(a * 0.7).toFixed(3)})`);
      gg.addColorStop(1, "rgba(255,170,90,0)");
      c.globalAlpha = 1;
      c.fillStyle = gg;
      c.beginPath(); c.arc(l.x, l.y, 26 * l.s * 6, 0, 6.3); c.fill();
      if (typeof paintLantern === "function") paintLantern(c, l.x, l.y, l.s, Math.sin(l.sw) * 0.06, 1, a, false);
    }
    // the slowest possible dust
    for (const m of this.motes) {
      m.y += m.vy * dt; m.x += m.vx * dt;
      if (m.y < -10) { m.y = h + 10; m.x = rnd(0, w); }
      c.globalAlpha = m.a * (0.5 + 0.5 * Math.sin(T + m.p));
      c.fillStyle = "#FFE9C8";
      c.beginPath(); c.arc(m.x, m.y, m.r, 0, 6.3); c.fill();
    }
    c.restore();
    c.restore();

    const vg = c.createRadialGradient(w / 2, h * 0.5, Math.min(w, h) * 0.3, w / 2, h * 0.52, Math.max(w, h) * 0.8);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,0,0,.66)");
    c.fillStyle = vg; c.fillRect(0, 0, w, h);

    this._raf = requestAnimationFrame(() => this.loop());
  }
}
</script>
<script>/* ===================== SCENE DIRECTOR ===================== */
/* =============================================================================
   DIRECTOR — one centralized scene state machine.

   Nothing else in this file or any scene is allowed to change scenes. Scenes
   report what happened ("my story finished", "the user took a bite") and the
   director decides what that means. There is no scroll container, no carousel
   and no translateX: scenes are stacked layers that cross-dissolve.
   ============================================================================= */

/* ---- small shared utilities ---- */
function festiveTitle(text) {
  return [...text].map((ch, i) =>
    ch === " " ? "<span class=\"fsp\"> </span>"
      : `<span class="fch" style="animation-delay:${(i * 0.09).toFixed(2)}s">${ch}</span>`
  ).join("");
}
/* give each page its own breeze rhythm so no two flower groups move alike */
function varySway(html, i) {
  let n = 0;
  return html.replace(/class="sway"/g, () => `class="sway${["", "2", "3"][(i + n++) % 3]}"`);
}


/* ==================== MOONLIT GARDEN SCENE (opening page only) ====================
   A living, botanically-built garden. Every plant is grown procedurally: a tapered
   stem extends, leaves unfurl along it, a green calyx forms, the bud swells, the
   sepals stay put while the petals push past them, and the petals then fall open
   one by one on a tilted disc. Nothing fades in and nothing is scaled from zero.

   Plants are drawn live only while they are still moving; the moment a plant has
   finished growing it is baked into its own small sprite and afterwards blitted
   with a shear (a stem bending in the breeze), which is what keeps the page smooth.
   ================================================================================= */

/* small shared maths for the botanical layer */
const GB = {
  cl: (v, a, b) => v < a ? a : v > b ? b : v,
  es: t => { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); },
  eo: t => { t = t < 0 ? 0 : t > 1 ? 1 : t; return 1 - Math.pow(1 - t, 2.4); },
  ei: t => { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * t; },
  eio: t => { t = t < 0 ? 0 : t > 1 ? 1 : t; return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  lp: (a, b, t) => a + (b - a) * t,
  /* petals still shut are not yet their final colour: unripe tissue is paler,
     greyer and darker, and only ripens as the bud opens. Saturation and value
     carry this, never a hue rotation — rotating magenta towards green crosses
     the wheel through orange and turns buds apricot. k = 1 fully unripe. */
  raw(col, k) {
    k = GB.cl(k, 0, 1);
    return { h: col.h, s: col.s * (1 - k * 0.74), l: col.l * (1 - k * 0.32), eye: col.eye };
  },
  hsl: (h, s, l, a) => 'hsla(' + h.toFixed(1) + ',' + GB.cl(s, 0, 100).toFixed(1) + '%,' + GB.cl(l, 0, 100).toFixed(1) + '%,' + (a === undefined ? 1 : a) + ')',
  /* smooth closed/open path through points, quadratic through midpoints */
  path(c, p, close) {
    if (p.length < 2) return;
    c.beginPath();
    if (close) {
      let mx = (p[p.length - 1][0] + p[0][0]) / 2, my = (p[p.length - 1][1] + p[0][1]) / 2;
      c.moveTo(mx, my);
      for (let i = 0; i < p.length; i++) {
        const n = p[(i + 1) % p.length];
        c.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + n[0]) / 2, (p[i][1] + n[1]) / 2);
      }
      c.closePath();
    } else {
      c.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < p.length - 1; i++)
        c.quadraticCurveTo(p[i][0], p[i][1], (p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2);
      c.lineTo(p[p.length - 1][0], p[p.length - 1][1]);
    }
  }
};

class MoonlitGardenScene {
  constructor(cv) {
    this.cv = cv;
    this.raf = 0;
    this.running = false;
    this.T = 0;
    this._prevT = 0;
    this.t0 = 0;
    this.c = null;
    this.w = 0; this.h = 0;
    this.stars = [];
    this.clouds = [];
    this.plants = [];
    this.fireflies = [];
    this.shootingStar = null;
    this.nextSS = 14;
    this._built = false;
    this._lw = 0; this._lh = 0;
    /* botanical layer */
    this.ground = null;     // baked soil + far hedge
    this.grain = null;      // film grain tile
    this.far = [];          // distant plants (baked together once grown)
    this.farCv = null;
    this.farDone = false;
    this.gy = 0;            // top of the garden band
    this.sdpr = 1;          // sprite resolution
    this.ffFade = 0;        // firefly presence, survives leaving and re-entering the page
  }

  /* seeded PRNG (same algorithm as rngS in the project) */
  _rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  _cv(w, h) {
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.ceil(w)); cv.height = Math.max(1, Math.ceil(h));
    return cv;
  }

  /* ─── build particle / plant data once per (re)start ─── */
  _build(w, h) {
    if (this._built && this._lw === w && this._lh === h) return;
    this._built = true; this._lw = w; this._lh = h;
    const R = this._rng(8831);
    const rn = (a, b) => a + R() * (b - a);

    /* --- star field --- */
    this.stars = [];
    for (let i = 0; i < 150; i++) {
      const tier = R() < 0.60 ? 0 : R() < 0.72 ? 1 : 2;
      this.stars.push({
        x: rn(0, w),
        y: rn(0, h * 0.72),
        r: tier === 0 ? rn(0.16, 0.48) : tier === 1 ? rn(0.48, 0.8) : rn(0.8, 1.15),
        a0: tier === 0 ? rn(0.18, 0.45) : tier === 1 ? rn(0.4, 0.7) : rn(0.65, 0.95),
        sp: rn(0.18, 1.1),
        ph: rn(0, Math.PI * 2),
        tier
      });
    }

    /* --- clouds --- */
    this.clouds = [
      { cx: w * 0.14, cy: h * 0.14, rx: w * 0.24, ry: h * 0.055, a: 0.16, sp: 0.0028, ph: 0 },
      { cx: w * 0.72, cy: h * 0.10, rx: w * 0.20, ry: h * 0.048, a: 0.13, sp: 0.0022, ph: 1.2 },
      { cx: w * 0.48, cy: h * 0.23, rx: w * 0.16, ry: h * 0.038, a: 0.10, sp: 0.0018, ph: 2.7 },
    ];

    /* --- the garden --- */
    this.sdpr = Math.min(typeof window !== 'undefined' && window.devicePixelRatio || 1, 2);
    this._buildGarden(w, h);

    /* --- fireflies --- */
    const R2 = this._rng(331);
    const rn2 = (a, b) => a + R2() * (b - a);
    this.fireflies = Array.from({ length: 14 }, () => ({
      x: rn2(w * 0.04, w * 0.96),
      y: h * (0.60 + R2() * 0.35),
      r: rn2(0.9, 1.8),
      ph: rn2(0, Math.PI * 2),
      sp: rn2(0.12, 0.55),
      vx: (R2() - 0.5) * 0.22,
      vy: (R2() - 0.5) * 0.10
    }));

    this.shootingStar = null;
    this.nextSS = 14 + Math.random() * 8;
  }

  /* ======================================================================
     GARDEN CONSTRUCTION
     Three bands of depth. Everything random is decided once, here, and
     stored — so every frame is deterministic and nothing ever flickers.
     ====================================================================== */
  _buildGarden(w, h) {
    const R = this._rng(20260921);
    const rn = (a, b) => a + R() * (b - a);
    const ch = (p) => R() < p;
    const shrink = h < 620 ? 0.86 : 1;          // short screens keep clear of the copy
    const wide = GB.cl(w / 430, 1, 1.75);
    this.gy = h * 0.545;                        // nothing grows above this line
    this.plants = [];
    this.far = [];
    this.farCv = null; this.farDone = false;

    /* ---- moonlit palette, drawn from the reference photograph ---- */
    const FLOWER = {
      cosmosWhite: { h: 212, s: 14, l: 74, eye: { h: 44, s: 30, l: 48 } },
      cosmosPale: { h: 340, s: 13, l: 70, eye: { h: 45, s: 27, l: 46 } },
      magenta: { h: 326, s: 38, l: 38 },
      fuchsia: { h: 314, s: 36, l: 34 },
      coral: { h: 10, s: 30, l: 44 },
      salmon: { h: 356, s: 27, l: 47 },
      purple: { h: 264, s: 31, l: 41 },
      violet: { h: 255, s: 28, l: 35 },
      blush: { h: 344, s: 24, l: 56 },
      crimson: { h: 346, s: 32, l: 33 }
    };
    const jc = (p, dh, dl) => ({ h: p.h + rn(-dh, dh), s: p.s + rn(-4, 4), l: p.l + rn(-dl, dl), eye: p.eye });
    const folC = () => ({ h: 142 + rn(-20, 26), s: 27 + rn(-7, 13), l: 10.5 + rn(-2.5, 4.5) });

    /* ---------------- shared plant constructor ---------------- */
    const mkPlant = (o) => {
      /* Hard ceiling: whatever the viewport, a stem plus its flower head must
         finish below this.gy, so the birthday message is never encroached on.
         The head needs a little room of its own above the stem tip. */
      const room = (o.baseY - this.gy) * 0.86;
      const H = Math.min(o.H, Math.max(h * 0.03, room));
      const pl = {
        x: o.x, baseY: o.baseY, H, layer: o.layer, kind: o.kind,
        fol: o.fol || folC(),
        col: o.col || null,
        /* stem geometry */
        lean: rn(-0.20, 0.20) * (o.leanMul === undefined ? 1 : o.leanMul),
        bow: rn(-0.13, 0.13),
        w0: o.w0, w1: o.w1,
        nodes: [],
        /* growth state */
        g: o.g0, gt: o.gt, gs: o.gs,
        b: o.b0 || 0, bt: o.bt === undefined ? 1e9 : o.bt, bs: o.bs || 0.18,
        /* breeze */
        swPh: rn(0, Math.PI * 2),
        swSp: rn(0.20, 0.42) * (o.layer === 2 ? 0.8 : 1),
        swAmt: o.swAmt,
        dim: o.layer === 2 ? 0.80 : o.layer === 1 ? 1.0 : 1.0,
        leaves: [], sprays: [], head: null,
        spr: null
      };
      /* a couple of stem nodes for believability */
      const nn = Math.round(rn(1, 3));
      for (let i = 0; i < nn; i++) pl.nodes.push(rn(0.18, 0.86));
      return pl;
    };

    /* leaf set along a stem */
    const addLeaves = (pl, n, shape) => {
      for (let i = 0; i < n; i++) {
        const t = shape.t0 + (i / Math.max(1, n - 1)) * (shape.t1 - shape.t0) + rn(-0.035, 0.035);
        const side = (i % 2 ? 1 : -1) * (shape.flip ? -1 : 1);
        const up = shape.up === undefined ? 0.52 : shape.up;
        const ang = side > 0
          ? -up * Math.PI * rn(0.72, 1.12)
          : Math.PI + up * Math.PI * rn(0.72, 1.12);
        const len = pl.H * shape.len * rn(0.58, 1.46) * (1 - t * 0.34);
        /* which half of the blade catches the moon (it sits up and to the right) */
        const n1x = Math.cos(ang + Math.PI / 2), n1y = Math.sin(ang + Math.PI / 2);
        const lit = (n1x - n1y) >= 0 ? 1 : -1;
        pl.leaves.push({
          t, ang, len,
          wid: len * shape.wr * rn(0.78, 1.22),
          bow: rn(0.04, 0.30) * (side > 0 ? 1 : -1),
          droop: rn(0.02, 0.34),
          serr: shape.serr, serrN: Math.round(rn(5, 9)),
          round: shape.round, waist: shape.waist,
          nib: ch(0.16) ? rn(0.28, 0.5) : 0, nibT: rn(0.35, 0.8), nibS: ch(0.5) ? 1 : -1,
          veins: Math.round(rn(3, 6)),
          lit,
          compound: shape.compound ? (ch(0.5) ? 5 : 3) : 0,
          open: 0,
          t0: 0.10 + (i / n) * 0.62 + rn(-0.05, 0.05),   // unfurls in sequence
          hj: rn(-7, 7), lj: rn(-2.4, 3.2)
        });
      }
    };

    /* a head of petals sitting on the tip of the stem */
    const addHead = (pl, type, R0, col, o) => {
      o = o || {};
      const head = {
        type, R: R0, col,
        flat: o.flat === undefined ? rn(0.48, 0.86) : o.flat,
        roll: rn(-0.5, 0.5),
        petals: [], ring: [], florets: [],
        stagger: rn(0.035, 0.085), span: 0.30,
        furl: (R() < 0.5 ? -1 : 1) * rn(0.30, 0.62),
        open0: o.open0 === undefined ? 0.34 : o.open0
      };
      if (type === 'cosmos' || type === 'daisy') {
        const n = type === 'cosmos' ? Math.round(rn(7, 9)) : Math.round(rn(9, 13));
        const off = rn(0, Math.PI * 2);
        for (let i = 0; i < n; i++) {
          head.petals.push({
            a: off + (i / n) * Math.PI * 2 + rn(-0.10, 0.10),
            L: R0 * rn(0.86, 1.14), W: R0 * (type === 'cosmos' ? rn(0.50, 0.66) : rn(0.26, 0.36)),
            notch: type === 'cosmos' ? rn(0.10, 0.22) : rn(0, 0.06),
            lobes: 3, round: rn(0.62, 0.86), waist: rn(0.66, 0.88),
            wob: rn(0.02, 0.06), wph: rn(0, 6.3),
            eMin: rn(0.06, 0.30), curl: rn(0.05, 0.22),
            d: rn(0, 1), hj: rn(-5, 5), lj: rn(-6, 7)
          });
        }
      } else if (type === 'rose') {
        const rings = [
          { n: 5, r: 1.00, eMax: 1.00, sc: 1.00 },
          { n: 5, r: 0.74, eMax: 0.78, sc: 0.80 },
          { n: 5, r: 0.52, eMax: 0.52, sc: 0.62 },
          { n: 6, r: 0.33, eMax: 0.26, sc: 0.45 }
        ];
        rings.forEach((rg, ri) => {
          const off = ri * 1.05 + rn(-0.2, 0.2);
          for (let i = 0; i < rg.n; i++) {
            head.petals.push({
              ring: ri,
              a: off + (i / rg.n) * Math.PI * 2 + rn(-0.13, 0.13),
              L: R0 * rg.sc * rn(0.88, 1.12), W: R0 * rg.sc * rn(0.86, 1.06),
              notch: rn(0.02, 0.09), lobes: 2, round: rn(0.80, 1.05), waist: rn(0.42, 0.62),
              wob: rn(0.03, 0.08), wph: rn(0, 6.3),
              eMin: (1 - rg.eMax) * 1.35 + rn(0.02, 0.14), curl: 0.34 + ri * 0.16,
              d: ri * 0.12 + rn(0, 0.10), hj: rn(-5, 5), lj: rn(-7, 5), cup: 1
            });
          }
        });
      } else if (type === 'petunia') {
        head.lobes = 5;
        head.lobeJ = Array.from({ length: 5 }, () => rn(0.88, 1.12));
        head.wob = rn(0.03, 0.07);
        head.tube = R0 * rn(1.15, 1.6);
        head.nod = rn(-0.42, 0.42);
      } else if (type === 'umbel') {
        const rings = [{ r: 0.00, n: 3 }, { r: 0.30, n: 8 }, { r: 0.56, n: 13 },
                       { r: 0.80, n: 17 }, { r: 1.0, n: 15 }];
        rings.forEach((rg, ri) => {
          for (let i = 0; i < rg.n; i++) {
            const a = (i / rg.n) * Math.PI * 2 + rn(-0.25, 0.25) + ri;
            const rr = rg.r * rn(0.86, 1.10);
            head.florets.push({
              px: Math.cos(a) * rr * R0,
              py: Math.sin(a) * rr * R0 * 0.52 - Math.sqrt(Math.max(0, 1 - rr * rr)) * R0 * 0.36,
              r: R0 * rn(0.098, 0.140) * (1 - rr * 0.14),
              delay: (1 - rg.r) * 0.42 + rn(0, 0.20),
              rot: rn(0, 6.3), hj: rn(-6, 6), lj: rn(-6, 8),
              lobes: 5
            });
          }
        });
        head.florets.sort((a, b) => a.py - b.py);
      } else if (type === 'spike') {
        const n = Math.round(rn(12, 19));
        head.spikeH = pl.H * rn(0.24, 0.34);
        for (let i = 0; i < n; i++) {
          head.florets.push({
            u: i / (n - 1), side: i % 2 ? 1 : -1,
            r: R0 * rn(0.52, 0.80) * (1 - (i / n) * 0.42),
            delay: (i / n) * 0.70 + rn(0, 0.10),
            tilt: rn(0.15, 0.55), hj: rn(-6, 6), lj: rn(-6, 7)
          });
        }
      } else if (type === 'spray') {
        const n = Math.round(rn(5, 10));
        for (let i = 0; i < n; i++) {
          const a = rn(-2.5, -0.65), d = R0 * rn(0.5, 2.0);
          head.florets.push({
            px: Math.cos(a) * d, py: Math.sin(a) * d,
            r: R0 * rn(0.24, 0.40), delay: rn(0, 0.55),
            rot: rn(0, 6.3), lobes: 5, hj: rn(-8, 8), lj: rn(-6, 9)
          });
        }
      }
      head.span = Math.min(0.46, head.stagger * Math.max(1, head.petals.length));
    head.petals.sort((a, b) => Math.sin(a.a) - Math.sin(b.a));
      pl.head = head;
      return head;
    };

    /* generous local bounding box, used for the sprite */
    const bbox = (pl) => {
      let rx = pl.H * 0.14, ru = pl.H * 1.04, rd = pl.H * 0.06;
      for (const lf of pl.leaves) {
        const bx = Math.abs(Math.sin(pl.lean)) * pl.H * lf.t;
        rx = Math.max(rx, bx + Math.abs(Math.cos(lf.ang)) * lf.len * 1.15 + lf.wid);
        ru = Math.max(ru, pl.H * lf.t + Math.abs(Math.sin(lf.ang)) * lf.len * 1.1 + lf.wid * 0.6);
      }
      if (pl.head) {
        const R0 = pl.head.R;
        const extra = pl.head.type === 'spike' ? pl.head.spikeH : R0 * 2.2;
        rx = Math.max(rx, R0 * 2.4);
        ru = Math.max(ru, pl.H + extra + R0 * 1.2);
      }
      rx += 6; ru += 8;
      pl.bb = { x0: -rx, x1: rx, y0: -ru, y1: rd + 4 };
    };

    /* ================= FAR BAND — distant foliage, grass and small flowers ==== */
    const farN = Math.round(88 * wide);
    for (let i = 0; i < farN; i++) {
      const x = rn(-w * 0.03, w * 1.03);
      const baseY = h * (0.690 + Math.pow(R(), 0.78) * 0.215);
      const k = R();
      if (k < 0.52) {
        this.far.push({ kind: 'grass', x, baseY, H: h * rn(0.026, 0.070) * (0.7 + (baseY / h - 0.69) * 2.2) * shrink, fol: folC(), lean: rn(-0.5, 0.5), blades: Math.round(rn(5, 11)), g: rn(0.66, 0.94), gs: rn(0.26, 0.42), seed: R() * 1000 });
      } else if (k < 0.80) {
        this.far.push({ kind: 'tuft', x, baseY, H: h * rn(0.020, 0.055) * (0.7 + (baseY / h - 0.69) * 2.4) * shrink, fol: folC(), lean: rn(-0.3, 0.3), n: Math.round(rn(4, 8)), g: rn(0.60, 0.90), gs: rn(0.22, 0.36), seed: R() * 1000 });
      } else {
        const p = [FLOWER.magenta, FLOWER.crimson, FLOWER.purple, FLOWER.blush, FLOWER.fuchsia][Math.floor(R() * 5)];
        this.far.push({
          kind: 'dot', x, baseY: baseY - h * rn(0.004, 0.030), r: h * rn(0.0038, 0.0082),
          col: jc(p, 8, 7), g: rn(0.35, 0.85), gs: rn(0.13, 0.26), n: Math.round(rn(3, 6)), seed: R() * 1000
        });
      }
    }
    /* far hedge silhouette control points */
    this.hedge = [];
    const HN = 74;
    for (let i = 0; i <= HN; i++) {
      const u = i / HN;
      /* three octaves plus jitter: a ragged mass of distant planting, not a wave */
      const n = 0.52 * Math.sin(u * 7.3 + 0.6)
        + 0.30 * Math.sin(u * 19.7 + 2.2)
        + 0.18 * Math.sin(u * 41.1 + 4.9);
      this.hedge.push({
        x: u * (w + 40) - 20,
        y: h * 0.700 - h * (0.010 + 0.030 * (0.5 + 0.5 * n)) * rn(0.72, 1.3)
      });
    }

    /* ================= MID BAND ============================================== */
    const midSpec = [
      { k: 'cosmos', c: FLOWER.cosmosWhite }, { k: 'umbel', c: FLOWER.purple },
      { k: 'petunia', c: FLOWER.magenta }, { k: 'foliage', c: null },
      { k: 'cosmos', c: FLOWER.cosmosPale }, { k: 'spike', c: FLOWER.crimson },
      { k: 'petunia', c: FLOWER.coral }, { k: 'umbel', c: FLOWER.violet },
      { k: 'spray', c: FLOWER.blush }, { k: 'cosmos', c: FLOWER.cosmosWhite },
      { k: 'rose', c: FLOWER.blush }, { k: 'foliage', c: null },
      { k: 'petunia', c: FLOWER.fuchsia }, { k: 'umbel', c: FLOWER.purple },
      { k: 'spray', c: FLOWER.salmon }, { k: 'cosmos', c: FLOWER.cosmosWhite },
      { k: 'spike', c: FLOWER.magenta }, { k: 'petunia', c: FLOWER.salmon }
    ];
    const midN = Math.min(midSpec.length, Math.round(16 * wide));
    for (let i = 0; i < midN; i++) {
      const sp = midSpec[i % midSpec.length];
      const x = ((i + 0.5) / midN) * w * 1.04 - w * 0.02 + rn(-1, 1) * (w / midN) * 0.30;
      const H = h * rn(0.126, 0.292) * shrink;
      const pl = mkPlant({
        x, baseY: h * (0.876 + R() * 0.098), H, layer: 1, kind: sp.k,
        w0: H * 0.016 + 0.9, w1: H * 0.007 + 0.5, swAmt: rn(0.014, 0.026),
        g0: i < 4 ? rn(0.46, 0.60) : rn(0.12, 0.32), gt: rn(0.1, 2.6), gs: rn(0.13, 0.20),
        b0: i < 4 ? rn(0.04, 0.13) : 0,
        bt: 3.6 + i * 0.62 + rn(0, 1.5), bs: rn(0.155, 0.225),
        col: sp.c ? jc(sp.c, 7, 6) : null
      });
      this._dress(pl, sp.k, R0 => addHead(pl, R0.type, R0.R, pl.col, R0.o), addLeaves, rn, ch, h);
      bbox(pl);
      this.plants.push(pl);
    }

    /* ================= FORE BAND ============================================= */
    const fgSpec = [
      { k: 'cosmos', c: FLOWER.cosmosWhite }, { k: 'petunia', c: FLOWER.magenta },
      { k: 'umbel', c: FLOWER.purple }, { k: 'rose', c: FLOWER.blush },
      { k: 'cosmos', c: FLOWER.cosmosWhite }, { k: 'petunia', c: FLOWER.coral },
      { k: 'spike', c: FLOWER.crimson }, { k: 'foliage', c: null },
      { k: 'petunia', c: FLOWER.fuchsia }, { k: 'cosmos', c: FLOWER.cosmosPale }
    ];
    const fgN = Math.min(fgSpec.length, Math.round(9 * wide));
    for (let i = 0; i < fgN; i++) {
      const sp = fgSpec[i % fgSpec.length];
      const x = ((i + 0.5) / fgN) * w * 1.08 - w * 0.04 + rn(-1, 1) * (w / fgN) * 0.24;
      const H = h * rn(0.176, 0.366) * shrink;
      const pl = mkPlant({
        x, baseY: h * (0.972 + R() * 0.078), H, layer: 2, kind: sp.k,
        w0: H * 0.017 + 1.2, w1: H * 0.0075 + 0.7, swAmt: rn(0.020, 0.034),
        g0: rn(0.10, 0.28), gt: rn(0.6, 4.2), gs: rn(0.100, 0.155),
        bt: 8.2 + i * 1.35 + rn(0, 1.8), bs: rn(0.130, 0.190),
        col: sp.c ? jc(sp.c, 7, 6) : null
      });
      this._dress(pl, sp.k, R0 => addHead(pl, R0.type, R0.R, pl.col, R0.o), addLeaves, rn, ch, h);
      bbox(pl);
      this.plants.push(pl);
    }

    /* a carpet of low blossoms between the tall plants, as in the reference bed */
    const carpetSpec = [
      { k: 'petunia', c: FLOWER.magenta }, { k: 'umbel', c: FLOWER.purple },
      { k: 'petunia', c: FLOWER.coral }, { k: 'spray', c: FLOWER.blush },
      { k: 'umbel', c: FLOWER.violet }, { k: 'petunia', c: FLOWER.salmon },
      { k: 'umbel', c: FLOWER.purple }, { k: 'petunia', c: FLOWER.fuchsia },
      { k: 'spray', c: FLOWER.salmon }, { k: 'petunia', c: FLOWER.crimson }
    ];
    const carN = Math.round(19 * wide);
    for (let i = 0; i < carN; i++) {
      const sp = carpetSpec[i % carpetSpec.length];
      const x = ((i + 0.5) / carN) * w * 1.10 - w * 0.05 + rn(-1, 1) * (w / carN) * 0.55;
      const H = h * rn(0.046, 0.122) * shrink;
      const pl = mkPlant({
        x, baseY: h * (0.900 + Math.pow(R(), 0.8) * 0.135), H, layer: 1, kind: sp.k,
        w0: H * 0.030 + 0.8, w1: H * 0.013 + 0.5, swAmt: rn(0.012, 0.024),
        g0: rn(0.22, 0.58), gt: rn(0, 2.2), gs: rn(0.16, 0.26),
        b0: i % 3 === 0 ? rn(0.03, 0.12) : 0,
        bt: 2.4 + i * 0.52 + rn(0, 2.2), bs: rn(0.16, 0.26),
        col: jc(sp.c, 7, 6)
      });
      this._dress(pl, sp.k, R0 => addHead(pl, R0.type, R0.R, pl.col, R0.o), addLeaves, rn, ch, h);
      bbox(pl);
      this.plants.push(pl);
    }

    /* a couple of very close leaf clumps that frame the bottom corners */
    for (let i = 0; i < Math.round(4 * wide); i++) {
      const x = i % 2 ? rn(w * 0.72, w * 1.02) : rn(-w * 0.02, w * 0.28);
      const H = h * rn(0.11, 0.17) * shrink;
      const pl = mkPlant({
        x, baseY: h * (1.012 + R() * 0.02), H, layer: 2, kind: 'foliage',
        w0: H * 0.030 + 1.4, w1: H * 0.012 + 0.8, swAmt: rn(0.016, 0.026),
        g0: rn(0.42, 0.72), gt: rn(0, 1.2), gs: rn(0.16, 0.26)
      });
      addLeaves(pl, Math.round(rn(7, 11)), { t0: 0.05, t1: 0.94, len: 0.50, wr: 0.26, serr: 0.55, round: 0.72, waist: 0.66, up: 0.40 });
      bbox(pl);
      this.plants.push(pl);
    }

    /* painter's order: far bands first, and lower plants over higher ones */
    this.plants.sort((a, b) => a.layer - b.layer || a.baseY - b.baseY);

    /* ---- soil is static: bake it straight away ---- */
    this._bakeGround(w, h);
  }

  /* leaves + head appropriate to each species */
  _dress(pl, kind, head, addLeaves, rn, ch, h) {
    const H = pl.H;
    switch (kind) {
      case 'cosmos':
        pl.needle = [];
        for (let i = 0; i < Math.round(rn(8, 14)); i++) {
          pl.needle.push({
            t: rn(0.08, 0.80), side: i % 2 ? 1 : -1,
            len: H * rn(0.13, 0.30), pinnae: Math.round(rn(9, 15)),
            ang: -rn(0.25, 0.95), t0: 0.08 + rn(0, 0.5), bow: rn(-0.2, 0.2)
          });
        }
        head({ type: 'cosmos', R: H * rn(0.092, 0.148), o: { flat: rn(0.22, 0.94) } });
        break;
      case 'rose':
        addLeaves(pl, Math.round(rn(4, 7)), { t0: 0.10, t1: 0.88, len: 0.21, wr: 0.34, serr: 1.0, round: 0.66, waist: 0.62, compound: true, up: 0.34 });
        head({ type: 'rose', R: H * rn(0.085, 0.128), o: { flat: rn(0.30, 0.92) } });
        break;
      case 'petunia':
        addLeaves(pl, Math.round(rn(6, 10)), { t0: 0.05, t1: 0.95, len: 0.23, wr: 0.34, serr: 0.22, round: 0.86, waist: 0.58, up: 0.46 });
        head({ type: 'petunia', R: H * rn(0.082, 0.126), o: { flat: rn(0.20, 0.90) } });
        break;
      case 'umbel':
        addLeaves(pl, Math.round(rn(6, 9)), { t0: 0.05, t1: 0.92, len: 0.20, wr: 0.28, serr: 0.95, round: 0.62, waist: 0.60, up: 0.48 });
        head({ type: 'umbel', R: H * rn(0.078, 0.118) });
        break;
      case 'spike':
        addLeaves(pl, Math.round(rn(6, 10)), { t0: 0.05, t1: 0.66, len: 0.28, wr: 0.13, serr: 0.30, round: 0.52, waist: 0.50, up: 0.48 });
        head({ type: 'spike', R: H * rn(0.030, 0.046) });
        break;
      case 'spray':
        addLeaves(pl, Math.round(rn(5, 8)), { t0: 0.05, t1: 0.86, len: 0.19, wr: 0.24, serr: 0.60, round: 0.62, waist: 0.58, up: 0.50 });
        head({ type: 'spray', R: H * rn(0.042, 0.062) });
        break;
      default: /* foliage */
        addLeaves(pl, Math.round(rn(6, 11)), { t0: 0.05, t1: 0.95, len: 0.38, wr: 0.25, serr: 0.62, round: 0.70, waist: 0.64, up: 0.44 });
    }
  }

  /* ─── lifecycle ─── */
  start() {
    if (this.running) return;
    const cw = this.cv.clientWidth, ch = this.cv.clientHeight;
    if (!cw || !ch) { requestAnimationFrame(() => this.start()); return; }
    const a = fitCanvas(this.cv);
    this.c = a.c; this.w = a.w; this.h = a.h;
    this._build(a.w, a.h);
    this.running = true;
    this.T = 0; this._prevT = 0;
    this.t0 = performance.now();
    const tick = (now) => {
      if (!this.running) return;
      const newT = (now - this.t0) / 1000;
      const dt = Math.min(0.05, newT - this._prevT);
      this._prevT = newT; this.T = newT;
      /* handle resize */
      const cw2 = this.cv.clientWidth, ch2 = this.cv.clientHeight;
      if (cw2 !== this._lw || ch2 !== this._lh) {
        const big = Math.abs(cw2 - this._lw) > 24 || Math.abs(ch2 - this._lh) > 24;
        const b = fitCanvas(this.cv);
        this.c = b.c; this.w = b.w; this.h = b.h;
        if (big) { this._built = false; this._build(b.w, b.h); }
        else { this._lw = cw2; this._lh = ch2; }
      }
      this._frame(dt);
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  stop() {
    this.running = false;
    cancelAnimationFrame(this.raf);
    this.raf = 0;
  }

  reset() {
    this.stop();
    this._built = false;
    this.T = 0; this._prevT = 0;
    this.ffFade = 0;
    this.grain = null;
    this.ground = null; this.farCv = null; this.farDone = false;
    for (const pl of this.plants) pl.spr = null;
    this.plants = []; this.far = [];
  }

  /* ─── main render ─── */
  _frame(dt) {
    const c = this.c, w = this.w, h = this.h, T = this.T;
    c.clearRect(0, 0, w, h);
    this._sky(c, w, h);
    this._clouds(c, w, h, T);
    this._moon(c, w, h);
    this._stars(c, T);
    this._gardenHaze(c, w, h);
    this._garden(c, w, h, T, dt);
    this._fireflies(c, w, h, T, dt);
    this._shootingStar(c, w, h, T);
  }

  /* ─── sky ─── */
  _sky(c, w, h) {
    const g = c.createRadialGradient(w * 0.5, h * 0.28, 0, w * 0.5, h * 0.28, h * 0.88);
    g.addColorStop(0, '#0f172a');
    g.addColorStop(0.28, '#0b1226');
    g.addColorStop(0.58, '#050915');
    g.addColorStop(1, '#000000');
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    const hz = c.createLinearGradient(0, h * 0.62, 0, h * 0.78);
    hz.addColorStop(0, 'rgba(15,23,42,0)');
    hz.addColorStop(1, 'rgba(0,59,209,0.10)');
    c.fillStyle = hz; c.fillRect(0, h * 0.62, w, h * 0.16);
  }

  /* ─── moon ─── */
  _moon(c, w, h) {
    const mx = w * 0.77, my = h * 0.13, mr = Math.min(w, h) * 0.058;
    const g0 = c.createRadialGradient(mx, my, 0, mx, my, mr * 6);
    g0.addColorStop(0, 'rgba(190,218,255,0.10)');
    g0.addColorStop(0.45, 'rgba(165,200,255,0.05)');
    g0.addColorStop(1, 'rgba(140,185,255,0)');
    c.fillStyle = g0; c.beginPath(); c.arc(mx, my, mr * 6, 0, Math.PI * 2); c.fill();
    const g1 = c.createRadialGradient(mx, my, 0, mx, my, mr * 2.4);
    g1.addColorStop(0, 'rgba(230,242,255,0.28)');
    g1.addColorStop(0.5, 'rgba(205,228,255,0.12)');
    g1.addColorStop(1, 'rgba(185,215,255,0)');
    c.fillStyle = g1; c.beginPath(); c.arc(mx, my, mr * 2.4, 0, Math.PI * 2); c.fill();
    const gm = c.createRadialGradient(mx - mr * 0.18, my - mr * 0.22, 0, mx, my, mr);
    gm.addColorStop(0, '#F5F8FF');
    gm.addColorStop(0.42, '#ECF3FF');
    gm.addColorStop(0.82, '#D8E8FF');
    gm.addColorStop(1, '#C2D5F5');
    c.fillStyle = gm; c.beginPath(); c.arc(mx, my, mr, 0, Math.PI * 2); c.fill();
    c.save(); c.globalAlpha = 0.038;
    c.fillStyle = '#7080A0';
    c.beginPath(); c.ellipse(mx - mr * 0.28, my + mr * 0.12, mr * 0.20, mr * 0.14, 0.55, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(mx + mr * 0.18, my - mr * 0.26, mr * 0.12, mr * 0.09, -0.3, 0, Math.PI * 2); c.fill();
    c.restore();
  }

  /* ─── clouds ─── */
  _clouds(c, w, h, T) {
    c.save();
    for (const cl of this.clouds) {
      const ox = Math.sin(T * cl.sp + cl.ph) * w * 0.018;
      c.globalAlpha = cl.a;
      c.filter = 'blur(22px)';
      c.fillStyle = '#243070';
      c.beginPath(); c.ellipse(cl.cx + ox, cl.cy, cl.rx, cl.ry, 0, 0, Math.PI * 2); c.fill();
      c.globalAlpha = cl.a * 0.55;
      c.fillStyle = 'rgba(188,215,255,0.22)';
      c.beginPath(); c.ellipse(cl.cx + ox, cl.cy - cl.ry * 0.32, cl.rx * 0.68, cl.ry * 0.52, 0, 0, Math.PI * 2); c.fill();
    }
    c.filter = 'none'; c.globalAlpha = 1;
    c.restore();
  }

  /* ─── star field ─── */
  _stars(c, T) {
    c.save();
    for (const s of this.stars) {
      const tw = 0.5 + 0.5 * Math.sin(T * s.sp + s.ph);
      const a = s.a0 * (0.55 + 0.45 * tw);
      c.globalAlpha = a;
      if (s.tier === 2) {
        const grd = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3.5);
        grd.addColorStop(0, 'rgba(215,232,255,0.55)');
        grd.addColorStop(1, 'rgba(215,232,255,0)');
        c.fillStyle = grd;
        c.beginPath(); c.arc(s.x, s.y, s.r * 3.5, 0, Math.PI * 2); c.fill();
      }
      c.fillStyle = s.tier === 2 ? '#EAF3FF' : '#D5E6FF';
      c.beginPath(); c.arc(s.x, s.y, s.r, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1; c.restore();
  }

  /* ─── garden ground haze ─── */
  _gardenHaze(c, w, h) {
    const g = c.createLinearGradient(0, h * 0.68, 0, h);
    g.addColorStop(0, 'rgba(8,12,36,0)');
    g.addColorStop(0.45, 'rgba(9,13,38,0.12)');
    g.addColorStop(1, 'rgba(5,8,24,0.60)');
    c.fillStyle = g; c.fillRect(0, h * 0.68, w, h * 0.32);
  }

  /* ======================================================================
     GROUND — real soil, baked once: crumb texture, clods, a few pebbles
     ====================================================================== */
  _bakeGround(w, h) {
    const d = this.sdpr;
    const top = h * 0.66;
    const gh = h - top + 2;
    const cv = this._cv(w * d, gh * d);
    const c = cv.getContext('2d');
    c.setTransform(d, 0, 0, d, 0, 0);
    c.translate(0, -top);
    const R = this._rng(5150);
    const rn = (a, b) => a + R() * (b - a);

    /* the bed itself */
    const g = c.createLinearGradient(0, top, 0, h);
    g.addColorStop(0, 'rgba(14,18,30,0.55)');
    g.addColorStop(0.30, 'rgba(16,15,20,0.88)');
    g.addColorStop(1, 'rgba(8,7,10,0.98)');
    c.fillStyle = g; c.fillRect(0, top, w, h - top + 2);

    /* far hedge silhouette — keeps the horizon from being a hard line */
    if (this.hedge && this.hedge.length) {
      c.beginPath();
      c.moveTo(-20, h);
      c.lineTo(this.hedge[0].x, this.hedge[0].y);
      for (let i = 1; i < this.hedge.length - 1; i++) {
        const p = this.hedge[i], n = this.hedge[i + 1];
        c.quadraticCurveTo(p.x, p.y, (p.x + n.x) / 2, (p.y + n.y) / 2);
      }
      c.lineTo(w + 20, this.hedge[this.hedge.length - 1].y);
      c.lineTo(w + 20, h); c.closePath();
      const hg = c.createLinearGradient(0, h * 0.68, 0, h * 0.82);
      hg.addColorStop(0, 'rgba(19,32,38,0.92)');
      hg.addColorStop(1, 'rgba(8,14,20,0.98)');
      c.fillStyle = hg; c.fill();

      /* Feather the crest: hundreds of tiny blades and leaf tips standing up
         out of the mass, so the silhouette dissolves instead of ending on a
         drawn line. This is what stops the horizon reading as a cut-out. */
      const HL = this.hedge.length;
      const hedgeY = (x) => {
        const u = GB.cl((x + 20) / (w + 40), 0, 1) * (HL - 1);
        const i = Math.min(HL - 2, Math.floor(u)), f = u - i;
        return this.hedge[i].y * (1 - f) + this.hedge[i + 1].y * f;
      };
      const tufts = Math.round(w * 1.15);
      for (let i = 0; i < tufts; i++) {
        const x = rn(-14, w + 14);
        const by = hedgeY(x) + rn(-0.5, 3.5);
        const len = rn(2.5, 11) * (R() < 0.13 ? 1.9 : 1);
        const lean = rn(-0.42, 0.42);
        const wdt = rn(0.5, 1.5);
        c.globalAlpha = rn(0.30, 0.86);
        c.fillStyle = GB.hsl(rn(128, 156), rn(14, 30), rn(7, 15));
        c.beginPath();
        c.moveTo(x - wdt, by + 2);
        c.quadraticCurveTo(x - wdt * 0.5 + lean * len * 0.4, by - len * 0.55,
          x + lean * len, by - len);
        c.quadraticCurveTo(x + wdt * 0.6 + lean * len * 0.4, by - len * 0.5,
          x + wdt, by + 2);
        c.closePath(); c.fill();
      }
      /* the faintest moonlight settling on the crest, broken into patches */
      for (let i = 0; i < Math.round(w * 0.10); i++) {
        const x = rn(0, w), by = hedgeY(x);
        c.globalAlpha = rn(0.02, 0.07);
        c.fillStyle = 'rgba(160,196,228,1)';
        c.beginPath();
        c.ellipse(x, by + rn(1, 5), rn(6, 22), rn(1.2, 3.4), rn(-0.16, 0.16), 0, Math.PI * 2);
        c.fill();
      }
      c.globalAlpha = 1;
    }

    /* crumb texture: many small clods, lighter on their moon side */
    const n = Math.round(w * (h - top) / 260);
    for (let i = 0; i < n; i++) {
      const y = rn(top + 2, h + 4);
      const dep = GB.cl((y - top) / (h - top), 0, 1);
      const x = rn(-8, w + 8);
      const r = rn(1.0, 3.4) * (0.6 + dep * 1.5);
      const l = rn(6, 15) * (1 - dep * 0.35);
      c.globalAlpha = rn(0.18, 0.5);
      c.fillStyle = GB.hsl(rn(20, 42), rn(8, 20), l);
      c.beginPath(); c.ellipse(x, y, r * rn(0.9, 1.7), r * rn(0.55, 0.9), rn(-0.6, 0.6), 0, Math.PI * 2); c.fill();
      /* the lit rim on the upper right of each clod */
      c.globalAlpha = rn(0.05, 0.16) * (1 - dep * 0.4);
      c.fillStyle = 'rgba(178,203,235,1)';
      c.beginPath(); c.ellipse(x + r * 0.30, y - r * 0.32, r * 0.72, r * 0.34, -0.5, 0, Math.PI * 2); c.fill();
    }

    /* a handful of pebbles */
    for (let i = 0; i < 16; i++) {
      const y = rn(top + h * 0.06, h), x = rn(0, w), r = rn(1.6, 4.2);
      c.globalAlpha = 0.5;
      c.fillStyle = 'rgba(30,33,42,1)';
      c.beginPath(); c.ellipse(x, y, r, r * 0.66, rn(-1, 1), 0, Math.PI * 2); c.fill();
      c.globalAlpha = 0.22;
      c.fillStyle = 'rgba(186,208,238,1)';
      c.beginPath(); c.ellipse(x + r * 0.22, y - r * 0.24, r * 0.55, r * 0.26, -0.5, 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;
    this.ground = { cv, top, gh };
  }

  /* ======================================================================
     THE GARDEN — advance growth, draw the three bands
     ====================================================================== */
  _garden(c, w, h, T, dt) {
    /* soil */
    if (this.ground) c.drawImage(this.ground.cv, 0, this.ground.top, w, this.ground.gh);

    /* --- far band --- */
    if (this.farDone && this.farCv) {
      const sway = Math.sin(T * 0.21) * 1.1;
      c.drawImage(this.farCv.cv, sway, this.farCv.top, w, this.farCv.gh);
    } else {
      let done = true;
      for (const f of this.far) {
        if (f.g < 1) { f.g = Math.min(1, f.g + f.gs * dt); done = false; }
      }
      c.save();
      c.globalAlpha = 0.9;
      for (const f of this.far) this._drawFar(c, f);
      c.restore();
      if (done && T > 2) this._bakeFar(w, h);
    }

    /* aerial perspective: distance is a little hazier than the foreground */
    const y0 = this.gy - h * 0.06;
    const ah = c.createLinearGradient(0, y0, 0, h * 0.94);
    ah.addColorStop(0, 'rgba(16,26,56,0)');
    ah.addColorStop(0.18, 'rgba(16,26,56,0.26)');
    ah.addColorStop(0.62, 'rgba(12,20,46,0.12)');
    ah.addColorStop(1, 'rgba(9,15,36,0)');
    c.fillStyle = ah; c.fillRect(0, y0, w, h * 0.94 - y0);

    /* --- mid + fore --- */
    for (const pl of this.plants) {
      /* growth */
      if (pl.g < 1 && T >= pl.gt) pl.g = Math.min(1, pl.g + pl.gs * dt);
      if (pl.head && pl.b < 1 && T >= pl.bt && pl.g > 0.78) pl.b = Math.min(1, pl.b + pl.bs * dt);
      const settled = pl.g >= 1 && (!pl.head || pl.b >= 1);

      /* the breeze: a shear, so the tip travels and the root does not */
      const s = Math.sin(T * pl.swSp + pl.swPh) * pl.swAmt
        + Math.sin(T * pl.swSp * 2.37 + pl.swPh * 1.7) * pl.swAmt * 0.34;

      c.save();
      c.translate(pl.x, pl.baseY);
      c.transform(1, 0, s, 1, 0, 0);
      c.rotate(s * 0.18);
      if (settled) {
        if (!pl.spr) this._bakePlant(pl);
        if (pl.spr) c.drawImage(pl.spr, pl.bb.x0, pl.bb.y0, pl.bb.x1 - pl.bb.x0, pl.bb.y1 - pl.bb.y0);
        else this._drawPlant(c, pl);
      } else {
        this._drawPlant(c, pl);
      }
      c.restore();
    }

    this._airAndGrain(c, w, h, T);
  }

  /* low mist, a light film of grain, and a soft frame — what keeps it from
     looking like flat vector artwork */
  _airAndGrain(c, w, h, T) {
    const top = this.gy - h * 0.02;
    /* two very slow banks of ground mist */
    for (let i = 0; i < 2; i++) {
      const cx = w * (0.30 + 0.42 * i) + Math.sin(T * 0.035 + i * 2.1) * w * 0.10;
      const cy = h * (0.755 + i * 0.075);
      const rx = w * (0.52 + 0.18 * i), ry = h * (0.055 + 0.022 * i);
      const g = c.createRadialGradient(cx, cy, 0, cx, cy, rx);
      g.addColorStop(0, 'rgba(126,152,196,' + (0.052 - i * 0.016).toFixed(3) + ')');
      g.addColorStop(0.55, 'rgba(104,128,176,' + (0.024 - i * 0.008).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(90,112,160,0)');
      c.save(); c.translate(cx, cy); c.scale(1, ry / rx); c.translate(-cx, -cy);
      c.fillStyle = g; c.beginPath(); c.arc(cx, cy, rx, 0, Math.PI * 2); c.fill();
      c.restore();
    }
    /* film grain over the planting only */
    if (!this.grain) this._bakeGrain();
    if (this.grain) {
      try {
        const pat = c.createPattern(this.grain, 'repeat');
        if (pat) {
          c.save(); c.fillStyle = pat;
          /* many narrow strips ramping up from zero: no visible upper edge */
          const gTop = this.gy - h * 0.12;
          const N = 16, band = (h - gTop) / N;
          for (let i = 0; i < N; i++) {
            c.globalAlpha = 0.50 * Math.pow(i / (N - 1), 1.5);
            c.fillRect(0, gTop + i * band - 0.5, w, band + 1);
          }
          c.restore();
        }
      } catch (e) { this.grain = null; }
    }
    /* the bed falls away into shadow at the very front and at the sides.
       Edge gradients rather than a radial: they reach zero on their own, so
       nothing draws a horizontal boundary across the picture. */
    const v = c.createLinearGradient(0, h * 0.84, 0, h);
    v.addColorStop(0, 'rgba(2,4,12,0)');
    v.addColorStop(1, 'rgba(2,4,12,0.52)');
    c.fillStyle = v; c.fillRect(0, h * 0.84, w, h * 0.16);
    const sideTop = this.gy - h * 0.10, sideH = h - sideTop;
    const lg = c.createLinearGradient(0, 0, w * 0.30, 0);
    lg.addColorStop(0, 'rgba(3,6,16,0.34)');
    lg.addColorStop(1, 'rgba(3,6,16,0)');
    c.fillStyle = lg; c.fillRect(0, sideTop, w * 0.30, sideH);
    const rg = c.createLinearGradient(w, 0, w * 0.70, 0);
    rg.addColorStop(0, 'rgba(3,6,16,0.34)');
    rg.addColorStop(1, 'rgba(3,6,16,0)');
    c.fillStyle = rg; c.fillRect(w * 0.70, sideTop, w * 0.30, sideH);
  }

  _bakeGrain() {
    try {
      const N = 96, cv = this._cv(N, N), cc = cv.getContext('2d');
      const id = cc.createImageData(N, N);
      for (let i = 0; i < N * N; i++) {
        const dark = Math.random() < 0.55;
        id.data[i * 4] = dark ? 3 : 188;
        id.data[i * 4 + 1] = dark ? 6 : 206;
        id.data[i * 4 + 2] = dark ? 16 : 238;
        id.data[i * 4 + 3] = Math.random() * Math.random() * 54;
      }
      cc.putImageData(id, 0, 0);
      this.grain = cv;
    } catch (e) { this.grain = null; }
  }

  _bakePlant(pl) {
    try {
      const bb = pl.bb;
      const w = bb.x1 - bb.x0, h = bb.y1 - bb.y0;
      if (w <= 0 || h <= 0 || w * h > 1.4e6) return;
      /* Sprite resolution is spent where it shows. A flower head carries the
         fine detail, so those bake at full density; a tall leafy plant is all
         soft edges, and a big box costs texture memory and fill rate on a
         phone, so the largest ones step down. */
      let d = this.sdpr;
      if (!pl.head) d = Math.min(d, 1.35);
      const rel = (w * h) / Math.max(1, this.w * this.h);
      if (rel > 0.16) d = Math.min(d, 1.5);
      else if (rel > 0.09) d = Math.min(d, 1.7);
      pl.sd = d;
      const cv = this._cv(w * d, h * d);
      const cc = cv.getContext('2d');
      cc.setTransform(d, 0, 0, d, 0, 0);
      cc.translate(-bb.x0, -bb.y0);
      this._drawPlant(cc, pl);
      pl.spr = cv;
    } catch (e) { pl.spr = null; }
  }

  _bakeFar(w, h) {
    try {
      const d = this.sdpr, top = this.gy - h * 0.02, gh = h - top + 4;
      const cv = this._cv(w * d, gh * d);
      const c = cv.getContext('2d');
      c.setTransform(d, 0, 0, d, 0, 0);
      c.translate(0, -top);
      c.globalAlpha = 0.9;
      for (const f of this.far) this._drawFar(c, f);
      this.farCv = { cv, top, gh };
      this.farDone = true;
    } catch (e) { this.farDone = false; }
  }

  /* ─── distant band pieces ─── */
  _drawFar(c, f) {
    const R = this._rng(1 + Math.floor(f.seed * 7919));
    const rn = (a, b) => a + R() * (b - a);
    c.save(); c.translate(f.x, f.baseY);
    const g = GB.eo(f.g);
    if (f.kind === 'grass') {
      const H = f.H * g;
      for (let i = 0; i < f.blades; i++) {
        const lean = f.lean + rn(-0.75, 0.75);
        const bh = H * rn(0.55, 1.12), bw = Math.max(0.7, bh * 0.035);
        const tipX = lean * bh * 0.85, curl = rn(0.25, 0.7);
        c.beginPath();
        c.moveTo(-bw, 0);
        c.quadraticCurveTo(tipX * 0.32 - bw * 0.4, -bh * 0.58, tipX, -bh);
        c.quadraticCurveTo(tipX * 0.34 + bw * 0.6, -bh * 0.55, bw, 0);
        c.closePath();
        const gr = c.createLinearGradient(0, 0, tipX, -bh);
        gr.addColorStop(0, GB.hsl(f.fol.h, f.fol.s, f.fol.l * 0.6));
        gr.addColorStop(1, GB.hsl(f.fol.h + 14, f.fol.s * 0.8, f.fol.l * (1.5 + curl)));
        c.fillStyle = gr; c.fill();
      }
    } else if (f.kind === 'tuft') {
      const H = f.H * g;
      for (let i = 0; i < f.n; i++) {
        const a = -Math.PI / 2 + rn(-1.1, 1.1) + f.lean;
        this._leaf(c, {
          x: rn(-H * 0.2, H * 0.2), y: 0, ang: a,
          len: H * rn(0.7, 1.25), wid: H * rn(0.28, 0.46),
          bow: rn(-0.16, 0.16), droop: rn(0.05, 0.2),
          serr: 0.5, serrN: 6, round: 0.72, waist: 0.66,
          nib: 0, veins: 2, lit: rn(-1, 1) > 0 ? 1 : -1,
          col: f.fol, open: 1, hj: rn(-6, 6), lj: rn(-2, 3)
        });
      }
    } else {
      /* a small cluster of distant blossoms */
      const rr = f.r * (0.25 + 0.75 * g);
      for (let i = 0; i < f.n; i++) {
        const a = rn(0, 6.3), d2 = rn(0, f.r * 2.4);
        const px = Math.cos(a) * d2, py = Math.sin(a) * d2 * 0.7;
        const col = f.col;
        c.globalAlpha = 0.72;
        c.fillStyle = GB.hsl(col.h, col.s * 0.8, col.l * 0.92);
        c.beginPath(); c.arc(px, py, rr * rn(0.7, 1.15), 0, Math.PI * 2); c.fill();
        c.globalAlpha = 0.32;
        c.fillStyle = GB.hsl(col.h - 4, col.s * 0.6, col.l * 1.35);
        c.beginPath(); c.arc(px + rr * 0.22, py - rr * 0.24, rr * 0.5, 0, Math.PI * 2); c.fill();
      }
      c.globalAlpha = 1;
    }
    c.restore();
  }

  /* ======================================================================
     ONE PLANT, in its own local space (origin at the root, -y is up)
     ====================================================================== */
  _drawPlant(c, pl) {
    const g = GB.eo(pl.g);
    if (g <= 0.005) return;
    const H = pl.H * g;
    const stem = this._stemPts(pl, H);

    /* leaves that sit behind the stem */
    for (const lf of pl.leaves) if (lf.lit < 0) this._leafOnStem(c, pl, lf, stem, g);
    if (pl.needle) for (const nd of pl.needle) if (nd.side < 0) this._needle(c, pl, nd, stem, g);

    this._stem(c, pl, stem, H);

    for (const lf of pl.leaves) if (lf.lit >= 0) this._leafOnStem(c, pl, lf, stem, g);
    if (pl.needle) for (const nd of pl.needle) if (nd.side >= 0) this._needle(c, pl, nd, stem, g);

    if (pl.head && pl.g > 0.60) {
      const tip = stem[stem.length - 1];
      c.save();
      c.translate(tip.x, tip.y);
      this._head(c, pl, GB.cl(pl.b, 0, 1), g);
      c.restore();
    }
  }

  /* the stem centreline, sampled — growth simply stops the curve part-way */
  _stemPts(pl, H) {
    const K = 12, pts = [];
    const tipX = H * pl.lean;
    const c1x = H * pl.bow, c1y = -H * 0.36;
    const c2x = tipX + H * pl.bow * 0.45, c2y = -H * 0.74;
    for (let i = 0; i <= K; i++) {
      const t = i / K, u = 1 - t;
      pts.push({
        x: 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * tipX,
        y: 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * (-H),
        t
      });
    }
    return pts;
  }

  _stem(c, pl, pts, H) {
    const f = { h: pl.fol.h, s: pl.fol.s, l: pl.fol.l * pl.dim * 0.80 };
    const w0 = pl.w0 * (0.55 + 0.45 * (H / pl.H)), w1 = pl.w1;
    const L = [], Rt = [];
    for (let i = 0; i < pts.length; i++) {
      const t = i / (pts.length - 1);
      let hw = GB.lp(w0, w1, Math.pow(t, 0.82)) * 0.5;
      for (const nd of pl.nodes) hw *= 1 + 0.42 * Math.exp(-Math.pow((t - nd) / 0.045, 2));
      const p = pts[i], q = pts[Math.min(pts.length - 1, i + 1)], r = pts[Math.max(0, i - 1)];
      const dx = q.x - r.x, dy = q.y - r.y, m = Math.hypot(dx, dy) || 1;
      const nx = -dy / m, ny = dx / m;
      L.push([p.x + nx * hw, p.y + ny * hw]);
      Rt.push([p.x - nx * hw, p.y - ny * hw]);
    }
    GB.path(c, L.concat(Rt.reverse()), true);
    const gr = c.createLinearGradient(-pl.H * 0.05, 0, pl.H * 0.05, 0);
    gr.addColorStop(0, GB.hsl(f.h - 6, f.s * 1.1, f.l * 0.55));
    gr.addColorStop(0.55, GB.hsl(f.h, f.s, f.l * 1.05));
    gr.addColorStop(1, GB.hsl(f.h + 16, f.s * 0.75, f.l * 2.0));
    c.fillStyle = gr; c.fill();
  }

  /* ─── one leaf, attached at a point along the stem ─── */
  _leafOnStem(c, pl, lf, pts, g) {
    const open = GB.cl((g - lf.t0) / 0.30, 0, 1);
    if (open <= 0.004) return;
    if (lf.t > g * 1.02) return;
    const idx = GB.cl(Math.round(lf.t / (g || 1) * (pts.length - 1)), 0, pts.length - 1);
    const p = pts[idx];
    this._leaf(c, {
      x: p.x, y: p.y, ang: lf.ang, len: lf.len, wid: lf.wid,
      bow: lf.bow, droop: lf.droop, serr: lf.serr, serrN: lf.serrN,
      round: lf.round, waist: lf.waist, nib: lf.nib, nibT: lf.nibT, nibS: lf.nibS,
      veins: lf.veins, lit: lf.lit, open,
      col: { h: pl.fol.h, s: pl.fol.s, l: pl.fol.l * pl.dim * (0.40 + 0.60 * Math.pow(lf.t, 0.7)) },
      compound: lf.compound, hj: lf.hj, lj: lf.lj
    });
  }

  /* ─── the leaf itself: a curved blade, one silhouette, light rolling across it ─── */
  _leaf(c, o) {
    const open = GB.cl(o.open, 0, 1);
    if (open <= 0.004) return;
    const L = o.len * (0.18 + 0.82 * GB.eo(open));
    const W = o.wid * (0.12 + 0.88 * GB.es(Math.pow(open, 1.45)));
    if (L < 0.5 || W < 0.22) return;

    c.save();
    c.translate(o.x, o.y);
    c.rotate(o.ang);

    if (o.compound) {
      const n = o.compound, sub = Object.assign({}, o, { x: 0, y: 0, ang: 0, compound: 0, open: 1 });
      c.strokeStyle = GB.hsl(o.col.h, o.col.s, o.col.l * 1.2);
      c.lineWidth = Math.max(0.45, W * 0.05);
      c.beginPath(); c.moveTo(0, 0);
      c.quadraticCurveTo(L * 0.5, -o.bow * L * 0.7, L, o.droop * L * 0.6); c.stroke();
      for (let i = 0; i < n - 1; i++) {
        const t = 0.24 + (i / (n - 2 || 1)) * 0.58;
        const px = L * t, py = GB.lp(0, o.droop * L * 0.6, t) - o.bow * L * 0.5 * Math.sin(Math.PI * t);
        const sd = i % 2 ? 1 : -1;
        this._leaf(c, Object.assign({}, sub, {
          x: px, y: py, ang: sd * 0.82, len: L * 0.34, wid: W * 0.60,
          bow: o.bow * 0.8 * sd, hj: o.hj + i * 2
        }));
      }
      this._leaf(c, Object.assign({}, sub, { x: L, y: o.droop * L * 0.6, ang: 0, len: L * 0.38, wid: W * 0.62 }));
      c.restore();
      return;
    }

    /* midrib */
    const K = 10, mx = [], my = [], nx = [], ny = [];
    const c1x = L * 0.32, c1y = -o.bow * L;
    const c2x = L * 0.70, c2y = -o.bow * L * 0.45 + o.droop * L * 0.45;
    const p3x = L, p3y = o.droop * L;
    for (let i = 0; i <= K; i++) {
      const t = i / K, u = 1 - t;
      mx[i] = 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * p3x;
      my[i] = 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * p3y;
      const dx = 3 * u * u * c1x + 6 * u * t * (c2x - c1x) + 3 * t * t * (p3x - c2x);
      const dy = 3 * u * u * c1y + 6 * u * t * (c2y - c1y) + 3 * t * t * (p3y - c2y);
      const m = Math.hypot(dx, dy) || 1;
      nx[i] = -dy / m; ny[i] = dx / m;
    }
    /* lanceolate: a slender stalk, the widest point about a third along, a fine tip */
    const prof = (t) => {
      t = GB.cl(t, 0, 1);
      let v = Math.pow(Math.max(0, Math.sin(Math.PI * Math.pow(t, 0.58))), 1.25);
      v *= 1 + o.serr * 0.055 * Math.sin(t * Math.PI * o.serrN * 2)
             + o.serr * 0.028 * Math.sin(t * Math.PI * o.serrN * 3.7 + 1.2);
      return v;
    };
    const fold = 0.44 + 0.56 * GB.es(open);
    const lit = o.lit;
    const pts = [];
    for (let i = 0; i <= K; i++) {
      const t = i / K;
      let hw = prof(t) * W * 0.5;
      if (o.nib && o.nibS === lit) hw *= 1 - 0.5 * Math.exp(-Math.pow((t - o.nibT) / 0.065, 2));
      pts.push([mx[i] + nx[i] * hw * lit, my[i] + ny[i] * hw * lit]);
    }
    for (let i = K; i >= 0; i--) {
      const t = i / K;
      /* the far margin runs slightly out of step, so the blade is never symmetric */
      let hw = prof(t * 1.10 - 0.055) * W * 0.5 * fold * 0.90;
      if (o.nib && o.nibS !== lit) hw *= 1 - 0.5 * Math.exp(-Math.pow((t - o.nibT) / 0.065, 2));
      pts.push([mx[i] - nx[i] * hw * lit, my[i] - ny[i] * hw * lit]);
    }
    GB.path(c, pts, true);

    const b = o.col, hj = o.hj || 0;
    const H = b.h + hj, S = b.s, Lg = b.l;
    const mi = Math.round(K * 0.36);
    const gx = nx[mi] * lit, gy = ny[mi] * lit;
    const gr = c.createLinearGradient(
      mx[mi] - gx * W * 0.58, my[mi] - gy * W * 0.58,
      mx[mi] + gx * W * 0.62, my[mi] + gy * W * 0.62);
    gr.addColorStop(0, GB.hsl(H - 6, S * 1.18, Lg * 0.40));
    gr.addColorStop(0.40, GB.hsl(H, S, Lg * 0.88));
    gr.addColorStop(0.70, GB.hsl(H + 7, S * 0.90, Lg * 1.62));
    gr.addColorStop(1, GB.hsl(H + 13, S * 0.70, Lg * 1.02));
    c.fillStyle = gr; c.fill();

    if (W > 2.4) {
      c.save(); c.clip();
      /* a soft sheen running down the fold, instead of a drawn-on highlight */
      c.translate(mx[mi], my[mi]);
      c.rotate(Math.atan2(my[K] - my[0], mx[K] - mx[0]));
      c.scale(1.7, 0.34);
      const rg = c.createRadialGradient(0, 0, 0, 0, 0, L * 0.52);
      rg.addColorStop(0, GB.hsl(H + 18, S * 0.45, GB.cl(Lg * 3.1, 0, 62), 0.20));
      rg.addColorStop(1, GB.hsl(H + 18, S * 0.45, GB.cl(Lg * 3.1, 0, 62), 0));
      c.fillStyle = rg; c.beginPath(); c.arc(0, 0, L * 0.52, 0, Math.PI * 2); c.fill();
      c.restore();
    }
    if (W > 5.5) {
      c.strokeStyle = GB.hsl(H - 4, S, Lg * 0.52, 0.22);
      c.lineWidth = Math.max(0.28, W * 0.022);
      c.beginPath();
      for (let v = 1; v <= o.veins; v++) {
        const t = 0.18 + (v / (o.veins + 1)) * 0.68;
        const i = Math.round(t * K);
        for (const sg of [1, -1]) {
          const hw = prof(t) * W * 0.5 * (sg === lit ? 1 : fold * 0.9) * 0.88;
          c.moveTo(mx[i], my[i]);
          c.quadraticCurveTo(
            mx[i] + nx[i] * hw * 0.5 * sg + (mx[K] - mx[i]) * 0.16,
            my[i] + ny[i] * hw * 0.5 * sg + (my[K] - my[i]) * 0.16,
            mx[i] + nx[i] * hw * sg + (mx[K] - mx[i]) * 0.34,
            my[i] + ny[i] * hw * sg + (my[K] - my[i]) * 0.34);
        }
      }
      c.stroke();
      c.strokeStyle = GB.hsl(H + 10, S * 0.7, GB.cl(Lg * 2.2, 0, 55), 0.20);
      c.lineWidth = Math.max(0.3, W * 0.03);
      c.beginPath(); c.moveTo(mx[0], my[0]);
      for (let i = 1; i < K; i++) c.quadraticCurveTo(mx[i], my[i], (mx[i] + mx[i + 1]) / 2, (my[i] + my[i + 1]) / 2);
      c.stroke();
    }
    c.restore();
  }

  /* ─── cosmos foliage: thread-fine pinnate sprays ─── */
  _needle(c, pl, nd, pts, g) {
    const open = GB.cl((g - nd.t0) / 0.34, 0, 1);
    if (open <= 0.004 || nd.t > g * 1.02) return;
    const idx = GB.cl(Math.round(nd.t / (g || 1) * (pts.length - 1)), 0, pts.length - 1);
    const p = pts[idx];
    const L = nd.len * (0.22 + 0.78 * GB.eo(open));
    const f = { h: pl.fol.h, s: pl.fol.s, l: pl.fol.l * pl.dim * (0.48 + 0.52 * nd.t) };
    c.save();
    c.translate(p.x, p.y);
    c.rotate(nd.ang * (nd.side > 0 ? 1 : -1) + (nd.side > 0 ? 0 : Math.PI));
    c.lineCap = 'round';
    c.strokeStyle = GB.hsl(f.h + 6, f.s * 0.95, f.l * 1.25, 0.9);
    c.lineWidth = Math.max(0.4, L * 0.013);
    c.beginPath(); c.moveTo(0, 0);
    c.quadraticCurveTo(L * 0.5, nd.bow * L, L, nd.bow * L * 0.6); c.stroke();
    /* Thread-fine pinnae. Cosmos foliage is a haze, not a comb: the threads are
       short, all sweep the same way, and never cross each other — crossing is
       what made this read as netting. */
    const NP = nd.pinnae + 4;
    c.lineWidth = Math.max(0.26, L * 0.0062);
    for (let i = 1; i <= NP; i++) {
      const t = i / (NP + 0.6);
      const px = L * t, py = nd.bow * L * (t * 1.2 - t * t * 0.6);
      const jit = Math.sin(i * 12.9898 + nd.ang * 78.233);
      const pl2 = L * (0.24 - t * 0.14) * (1 + 0.34 * jit);
      if (pl2 < 0.35) continue;
      c.strokeStyle = GB.hsl(f.h + 12, f.s * 0.8, f.l * 1.55,
        0.30 + 0.22 * Math.abs(jit));
      c.beginPath();
      for (const sg of [1, -1]) {
        /* one gentle arc, bending towards the frond tip */
        c.moveTo(px, py);
        c.quadraticCurveTo(px + pl2 * 0.18, py + sg * pl2 * 0.62,
          px + pl2 * 0.62, py + sg * pl2 * 1.02);
        /* and a finer one springing from its middle, the same way */
        c.moveTo(px + pl2 * 0.22, py + sg * pl2 * 0.46);
        c.quadraticCurveTo(px + pl2 * 0.58, py + sg * pl2 * 0.60,
          px + pl2 * 0.86, py + sg * pl2 * 0.70);
      }
      c.stroke();
    }
    c.restore();
  }

  /* ======================================================================
     FLOWER HEADS
     ====================================================================== */
  _head(c, pl, b, g) {
    const hd0 = pl.head;
    const hd = pl.dim === 1 ? hd0 : Object.assign({}, hd0, {
      col: { h: hd0.col.h, s: hd0.col.s, l: hd0.col.l * pl.dim, eye: hd0.col.eye }
    });
    const scale = GB.cl((g - 0.60) / 0.30, 0, 1);
    if (scale <= 0.004) return;
    c.save();
    c.rotate(hd.roll * 0.5);
    switch (hd.type) {
      case 'cosmos': case 'daisy': this._fDisc(c, pl, hd, b, scale); break;
      case 'rose': this._fRose(c, pl, hd, b, scale); break;
      case 'petunia': this._fTrumpet(c, pl, hd, b, scale); break;
      case 'umbel': this._fUmbel(c, pl, hd, b, scale); break;
      case 'spike': this._fSpike(c, pl, hd, b, scale); break;
      case 'spray': this._fSpray(c, pl, hd, b, scale); break;
    }
    c.restore();
  }

  /* the matrix that carries a petal from "standing in the bud" to "open on the disc" */
  _petalXf(c, a, p, rb, r0, flat) {
    const ca = Math.cos(a), sa = Math.sin(a);
    const m11 = GB.lp(-ca * 0.52, ca, p);
    const m12 = GB.lp(-1, sa * flat, p);
    const m21 = GB.lp(0.16 + 0.42 * Math.abs(sa), -sa, p);
    const m22 = GB.lp(0, ca * flat, p);
    const dx = GB.lp(ca * rb, ca * r0, p);
    const dy = GB.lp(0, sa * r0 * flat, p);
    c.transform(m11, m12, m21, m22, dx, dy);
  }

  /* one petal outline, drawn along +x with its width on ±y */
  _petalPath(c, L, W, o) {
    const hw = W * 0.5, pts = [];
    const prof = (t) => (t < 0.12 ? (t / 0.12) * 0.30
      : 0.30 + 0.70 * Math.pow(Math.sin(GB.cl((t - 0.12) / 0.78, 0, 1) * Math.PI / 2), o.round))
      * (1 + o.wob * Math.sin(t * 5.4 + o.wph));
    for (let i = 0; i <= 7; i++) { const t = i / 7; pts.push([t * L * 0.90, -prof(t) * hw]); }
    const tw = prof(1) * hw, lobes = o.lobes || 3;
    for (let j = 0; j <= 8; j++) {
      const ph = -Math.PI / 2 + (j / 8) * Math.PI;
      const rr = tw * (1 + (o.notch || 0) * Math.cos(ph * lobes));
      pts.push([L * 0.90 + rr * Math.cos(ph) * 0.92, rr * Math.sin(ph)]);
    }
    for (let i = 7; i >= 0; i--) { const t = i / 7; pts.push([t * L * 0.90, prof(t) * hw]); }
    GB.path(c, pts, true);
  }

  /* ---- cosmos / daisy: a flat disc of ray petals with a floret centre ---- */
  _fDisc(c, pl, hd, b, sc) {
    const col = hd.col, R = hd.R * sc, flat = hd.flat;
    const base = GB.cl((b - hd.open0) / (1 - hd.open0), 0, 1);
    const swell = GB.es(GB.cl(b / 0.34, 0, 1));
    const rb = R * (0.13 + 0.10 * swell);

    /* sepals: they hold the bud shut, then stay while the petals climb past them */
    const sp = GB.cl((b - 0.20) / 0.55, 0, 1);
    const sepL = R * (0.72 + 0.40 * swell);
    this._sepals(c, pl, hd, sp, rb, R, sepL, flat, false);

    const span = hd.span;
    /* the whole bud is furled one way and unwinds as it opens */
    c.save();
    c.rotate((1 - GB.es(base)) * (hd.furl || 0));
    hd.petals.forEach((pt) => {
      const p = GB.eio(GB.cl((base - pt.d * span) / (1 - span), 0, 1));
      const L = pt.L * sc * (0.38 + 0.62 * GB.eo(GB.cl(b / 0.55, 0, 1)));
      const W = pt.W * sc * (0.26 + 0.74 * p);
      const cc = GB.raw(col, 1 - GB.cl(p * 1.35, 0, 1));
      c.save();
      this._petalXf(c, pt.a, p * (1 - pt.eMin * 0.55), rb, R * 0.13, flat);
      this._petalPath(c, L, W, pt);
      const gr = c.createLinearGradient(0, 0, L, 0);
      gr.addColorStop(0, GB.hsl(cc.h + pt.hj, cc.s * 1.25, (cc.l + pt.lj) * 0.62));
      gr.addColorStop(0.34, GB.hsl(cc.h + pt.hj, cc.s, cc.l + pt.lj));
      gr.addColorStop(1, GB.hsl(cc.h + pt.hj - 5, cc.s * 0.72, GB.cl((cc.l + pt.lj) * 1.14, 0, 96)));
      c.fillStyle = gr; c.fill();
      /* a whisper of shade where the next petal overlaps this one */
      if (p > 0.25 && W > 3) {
        c.globalAlpha = 0.20 * GB.cl((p - 0.25) / 0.5, 0, 1);
        const sh = c.createLinearGradient(0, -W * 0.5, 0, W * 0.5);
        sh.addColorStop(0, 'rgba(6,10,26,0.85)');
        sh.addColorStop(0.28, 'rgba(6,10,26,0)');
        c.fillStyle = sh; c.fill();
        c.globalAlpha = 1;
      }
      /* fine radial veins */
      if (L > 5) {
        c.strokeStyle = GB.hsl(cc.h + pt.hj, cc.s * 1.3, (cc.l + pt.lj) * 0.70, 0.16);
        c.lineWidth = Math.max(0.28, L * 0.016);
        c.beginPath();
        for (let v = -2; v <= 2; v++) {
          c.moveTo(L * 0.06, v * W * 0.09);
          c.quadraticCurveTo(L * 0.55, v * W * 0.20, L * 0.88, v * W * 0.28);
        }
        c.stroke();
      }
      c.restore();
    });
    c.restore();

    /* centre: a small dome of disc florets */
    const cp = GB.cl((b - 0.42) / 0.42, 0, 1);
    if (cp > 0.01) {
      const eye = col.eye || { h: 46, s: 34, l: 58 };
      const cr = R * 0.24 * (0.4 + 0.6 * cp);
      c.save(); c.scale(1, flat * 0.92 + 0.08);
      const gr = c.createRadialGradient(cr * 0.25, -cr * 0.3, 0, 0, 0, cr);
      gr.addColorStop(0, GB.hsl(eye.h + 6, eye.s * 0.9, eye.l * 1.3));
      gr.addColorStop(0.7, GB.hsl(eye.h, eye.s, eye.l));
      gr.addColorStop(1, GB.hsl(eye.h - 8, eye.s * 1.15, eye.l * 0.55));
      c.fillStyle = gr; c.beginPath(); c.arc(0, 0, cr, 0, Math.PI * 2); c.fill();
      if (cr > 2.4) {
        c.fillStyle = GB.hsl(eye.h - 6, eye.s, eye.l * 0.6, 0.55);
        for (let i = 0; i < 11; i++) {
          const a = i * 2.39996, rr = cr * 0.80 * Math.sqrt(i / 11);
          c.beginPath(); c.arc(Math.cos(a) * rr, Math.sin(a) * rr, Math.max(0.35, cr * 0.10), 0, Math.PI * 2); c.fill();
        }
      }
      c.restore();
    }
    /* sepals that sit in front of the bud while it is still closed */
    this._sepals(c, pl, hd, sp, rb, R, sepL, flat, true);
  }

  /* green sepals, wrapped on the same cylinder the petals start from */
  _sepals(c, pl, hd, sp, rb, R, sepL, flat, front) {
    const f = { h: pl.fol.h, s: pl.fol.s * 0.88, l: pl.fol.l * pl.dim * 1.02 }, n = 5;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + hd.roll;
      const near = Math.sin(a) > 0;
      if (near !== front) continue;
      const p = GB.eio(sp) * 0.92;
      c.save();
      this._petalXf(c, a, p, rb * 1.06, R * 0.16, flat * 1.15);
      const L = sepL * (front ? 1.08 - 1.14 * p : 1.06 - 0.34 * p), W = rb * 1.5;
      if (L <= 0.3) { c.restore(); continue; }
      this._petalPath(c, L, W, { round: 0.72, wob: 0.03, wph: i, notch: 0.03, lobes: 2 });
      const gr = c.createLinearGradient(0, 0, L, 0);
      gr.addColorStop(0, GB.hsl(f.h - 4, f.s * 1.1, f.l * 0.75));
      gr.addColorStop(0.55, GB.hsl(f.h + 4, f.s, f.l * 1.5));
      gr.addColorStop(1, GB.hsl(f.h + 12, f.s * 0.8, f.l * 2.1));
      c.fillStyle = gr; c.fill();
      c.restore();
    }
  }

  /* ---- rose: rings of cupped petals, the centre never quite opens ---- */
  _fRose(c, pl, hd, b, sc) {
    const R = hd.R * sc, flat = hd.flat;
    const col = GB.raw(hd.col, 1 - GB.cl(b * 2.2, 0, 1));
    const swell = GB.es(GB.cl(b / 0.30, 0, 1));
    const rb = R * (0.16 + 0.12 * swell);
    const sp = GB.cl((b - 0.22) / 0.5, 0, 1);
    this._sepals(c, pl, hd, sp, rb, R, R * (0.78 + 0.34 * swell), flat, false);

    hd.petals.forEach((pt) => {
      const ring = pt.ring;
      const start = 0.30 + ring * 0.13 + pt.d * 0.10;
      const p = GB.eio(GB.cl((b - start) / 0.46, 0, 1)) * (1 - pt.eMin * 0.55);
      const L = pt.L * sc * (0.50 + 0.50 * GB.eo(GB.cl(b / 0.52, 0, 1)));
      const W = pt.W * sc * (0.56 + 0.44 * p);
      c.save();
      this._petalXf(c, pt.a, p, rb * (1 - ring * 0.14), R * (0.10 + ring * 0.03), flat);
      this._petalPath(c, L, W, pt);
      const gr = c.createLinearGradient(0, -W * 0.3, L * 0.9, W * 0.3);
      gr.addColorStop(0, GB.hsl(col.h + pt.hj, col.s * 1.3, (col.l + pt.lj) * 0.52));
      gr.addColorStop(0.42, GB.hsl(col.h + pt.hj, col.s, (col.l + pt.lj) * 0.95));
      gr.addColorStop(1, GB.hsl(col.h + pt.hj - 6, col.s * 0.72, GB.cl((col.l + pt.lj) * 1.22, 0, 95)));
      c.fillStyle = gr; c.fill();
      /* the rolled outer edge that gives a rose its depth */
      if (L > 4) {
        c.strokeStyle = GB.hsl(col.h + pt.hj - 8, col.s * 0.6, GB.cl((col.l + pt.lj) * 1.45, 0, 97), 0.40);
        c.lineWidth = Math.max(0.35, L * 0.05);
        c.beginPath();
        c.moveTo(L * 0.62, -W * 0.40);
        c.quadraticCurveTo(L * 0.95, 0, L * 0.62, W * 0.40);
        c.stroke();
        /* shadow in the cup */
        c.fillStyle = GB.hsl(col.h + pt.hj, col.s * 1.4, (col.l + pt.lj) * 0.40, 0.26);
        c.beginPath();
        c.moveTo(0, 0);
        c.quadraticCurveTo(L * 0.34, -W * 0.18, L * 0.50, 0);
        c.quadraticCurveTo(L * 0.34, W * 0.18, 0, 0);
        c.closePath(); c.fill();
      }
      c.restore();
    });
    this._sepals(c, pl, hd, sp, rb, R, R * (0.78 + 0.34 * swell), flat, true);
  }

  /* ---- petunia: a furled bud that untwists into a five-lobed trumpet ---- */
  _fTrumpet(c, pl, hd, b, sc) {
    const R = hd.R * sc, f = pl.fol;
    const open = GB.eio(GB.cl((b - 0.26) / 0.70, 0, 1));
    /* a shut petunia bud is a green spindle; the colour arrives as it unfurls */
    const col = GB.raw(hd.col, 1 - GB.cl(open * 1.5, 0, 1));
    const swell = GB.es(GB.cl(b / 0.34, 0, 1));
    const tube = hd.tube * sc * (0.42 + 0.58 * GB.eo(GB.cl(b / 0.60, 0, 1)));
    const faceR = R * (0.16 + 0.84 * open);
    const twist = (1 - open) * 2.0;
    const flat = hd.flat;

    c.save();
    c.rotate(hd.nod * 0.55);

    /* the tube */
    const tw0 = R * 0.20, tw1 = R * (0.22 + 0.34 * open);
    c.beginPath();
    c.moveTo(-tw0, 0);
    c.quadraticCurveTo(-tw0 * 1.05, -tube * 0.55, -tw1, -tube);
    c.lineTo(tw1, -tube);
    c.quadraticCurveTo(tw0 * 1.05, -tube * 0.55, tw0, 0);
    c.closePath();
    let gr = c.createLinearGradient(-tw1, 0, tw1, 0);
    gr.addColorStop(0, GB.hsl(col.h, col.s * 1.15, col.l * 0.40));
    gr.addColorStop(0.55, GB.hsl(col.h, col.s * 0.95, col.l * 0.80));
    gr.addColorStop(1, GB.hsl(col.h - 4, col.s * 0.75, col.l * 1.08));
    c.fillStyle = gr; c.fill();
    c.strokeStyle = GB.hsl(col.h, col.s * 1.2, col.l * 0.52, 0.34);
    c.lineWidth = Math.max(0.3, R * 0.022);
    c.beginPath();
    for (let i = -1; i <= 1; i++) { c.moveTo(i * tw0 * 0.55, -tube * 0.06); c.lineTo(i * tw1 * 0.7, -tube * 0.94); }
    c.stroke();

    /* five small sepals at the base of the tube */
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i - 2) * 0.52;
      c.save(); c.rotate(a + Math.PI / 2);
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(R * 0.16, -R * 0.30, 0, -R * (0.52 + 0.18 * swell));
      c.quadraticCurveTo(-R * 0.16, -R * 0.30, 0, 0);
      c.closePath();
      c.fillStyle = GB.hsl(f.h + i * 3, f.s, f.l * (1.1 + 0.25 * (i % 2)));
      c.fill(); c.restore();
    }

    /* the face */
    c.translate(0, -tube);
    c.scale(1, (flat * 0.55 + 0.45) * (1 + 1.6 * (1 - open)));
    const pts = [];
    const NL = 5, SEG = 9;
    for (let i = 0; i < NL; i++) {
      for (let j = 0; j < SEG; j++) {
        const u = (i + j / SEG) / NL;
        const a = u * Math.PI * 2 - Math.PI / 2 + twist * u * 1.1;
        const lobeT = (j / SEG);
        /* a shallow notch between lobes, a bulge in the middle of each */
        let rr = faceR * hd.lobeJ[i] * (0.86 + 0.14 * Math.sin(lobeT * Math.PI));
        rr *= 1 + hd.wob * Math.sin(u * Math.PI * 14 + hd.roll);
        rr *= 1 - 0.16 * Math.pow(Math.cos(lobeT * Math.PI), 8);
          pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
      }
    }
    GB.path(c, pts, true);
    gr = c.createRadialGradient(0, 0, faceR * 0.06, faceR * 0.10, -faceR * 0.12, faceR * 1.08);
    gr.addColorStop(0, GB.hsl(col.h + 4, col.s * 1.35, col.l * 0.36));
    gr.addColorStop(0.26, GB.hsl(col.h + 2, col.s * 1.2, col.l * 0.66));
    gr.addColorStop(0.72, GB.hsl(col.h, col.s, col.l * 1.02));
    gr.addColorStop(1, GB.hsl(col.h - 5, col.s * 0.78, GB.cl(col.l * 1.22, 0, 92)));
    c.fillStyle = gr; c.fill();

    if (faceR > 3) {
      c.save(); c.clip();
      /* veins converging on the throat — only once there is a face to vein */
      c.strokeStyle = GB.hsl(col.h + 4, col.s * 1.35, col.l * 0.44,
        0.30 * GB.cl((open - 0.34) / 0.5, 0, 1));
      c.lineWidth = Math.max(0.3, faceR * 0.030);
      c.beginPath();
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2 - Math.PI / 2 + twist;
        c.moveTo(Math.cos(a) * faceR * 0.16, Math.sin(a) * faceR * 0.16);
        c.quadraticCurveTo(Math.cos(a + 0.10) * faceR * 0.6, Math.sin(a + 0.10) * faceR * 0.6,
          Math.cos(a + 0.03) * faceR * 1.02, Math.sin(a + 0.03) * faceR * 1.02);
      }
      c.stroke();
      c.restore();
      /* the throat */
      const th = faceR * 0.20 * open;
      gr = c.createRadialGradient(0, 0, 0, 0, 0, th * 1.5);
      gr.addColorStop(0, GB.hsl(col.h + 10, col.s * 0.8, col.l * 0.20));
      gr.addColorStop(1, GB.hsl(col.h + 6, col.s * 1.3, col.l * 0.42, 0));
