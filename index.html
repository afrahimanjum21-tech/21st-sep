<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A1230" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Happy Birthday</title>
<style>
  /* ============================ TYPE SYSTEM (two families only) ============================
     --display : romantic script, used for titles only
     --body    : refined serif, used for every piece of reading copy               */
  :root{
    --display:"Segoe Script","Brush Script MT","Bradley Hand","Apple Chancery","Comic Sans MS",cursive;
    --body:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --ink:#FFFFFF;
    --ease:cubic-bezier(.22,.61,.36,1);
    --tdur:1400ms;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#07101F;overscroll-behavior:none}
  body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}

  /* =========================================================================
     SCENE STACK — every scene occupies the same space and cross-dissolves.
     There is no horizontal track, no scroll container and no translateX:
     scenes are layered, so two pages can never sit side by side.
     ========================================================================= */
  #stage{
    position:fixed;inset:0;width:100%;height:100vh;height:100dvh;
    overflow:hidden;touch-action:none;
  }
  .scene{
    position:absolute;inset:0;overflow:hidden;
    opacity:0;visibility:hidden;pointer-events:none;
    transform:scale(1.035);filter:blur(7px) brightness(.7);
    transition:opacity var(--tdur) var(--ease),
               transform var(--tdur) var(--ease),
               filter var(--tdur) var(--ease);
    will-change:opacity,transform,filter;
  }
  /* a scene that is built and rendering but deliberately not shown yet */
  .scene.warm{visibility:visible;opacity:0}
  .scene.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none}
  /* the scene being left behind recedes THROUGH the viewer, never sideways */
  .scene.out{opacity:0;visibility:visible;transform:scale(1.11);filter:blur(12px) brightness(.45) saturate(.55)}
  .bg,.cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  .cv.glow,.cv.air{pointer-events:none}

  /* slow cinematic camera: each page breathes a little while you read it */
  .camera{position:absolute;inset:-4%;will-change:transform;transform:scale(1.06)}
  .scene.on .camera{animation:camDrift 34s var(--ease) both}
  @keyframes camDrift{
    from{transform:scale(1.10) translate3d(0,1.2%,0)}
    to{transform:scale(1.015) translate3d(0,-1%,0)}
  }

  /* ---------------- page copy ---------------- */
  .copy{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;
    gap:clamp(12px,2.4vh,20px);
    padding:calc(env(safe-area-inset-top,0px) + 11vh) clamp(22px,7vw,34px) calc(env(safe-area-inset-bottom,0px) + 84px);
    pointer-events:none;
  }
  .title{font-family:var(--display);line-height:1.06;margin:0;letter-spacing:.005em}
  .t-xl{font-size:clamp(42px,12.6vw,64px)}
  .t-lg{font-size:clamp(34px,10.4vw,54px)}
  .caps{font-family:var(--display);font-weight:400;letter-spacing:.2em;font-size:clamp(26px,8.4vw,40px);line-height:1.5;margin:0}
  .msg{font-size:clamp(17px,4.7vw,20px);line-height:1.68;max-width:27ch;margin:0;letter-spacing:.005em}
  .tiny{font-family:var(--body);font-size:clamp(13.5px,3.8vw,15.5px);letter-spacing:.10em;opacity:.95;margin:0}
  /* readability scrim behind text on the busier pages — a soft gradient, never a box */
  .scrim{position:absolute;inset:0;pointer-events:none}
  .scrim.light{background:linear-gradient(180deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.16) 34%,rgba(255,255,255,0) 58%)}
  .scrim.deep{background:linear-gradient(180deg,rgba(6,14,30,.52) 0%,rgba(6,14,30,.20) 40%,rgba(6,14,30,0) 66%)}

  /* staged reveal: nothing pops in, everything arrives */
  .copy > *{opacity:0;transform:translateY(12px);filter:blur(6px)}
  .scene.on .copy > *{animation:arrive 1.25s var(--ease) forwards}
  .scene.on .copy > *:nth-child(1){animation-delay:.15s}
  .scene.on .copy > *:nth-child(2){animation-delay:.55s}
  .scene.on .copy > *:nth-child(3){animation-delay:.95s}
  .scene.on .copy > *:nth-child(4){animation-delay:1.3s}
  .scene.on .copy > *:nth-child(5){animation-delay:1.6s}
  @keyframes arrive{to{opacity:1;transform:none;filter:blur(0)}}

  /* handwriting-style reveal for the opening title */
  .writein{
  display:inline-block;
  padding:0 .08em;
  color:#FFFFFF !important;
  -webkit-text-fill-color:#FFFFFF !important;
  background:none !important;
  -webkit-background-clip:initial;
  background-clip:initial;
}
  .scene.on .writein{animation:write 2.6s var(--ease) .35s forwards}
  @keyframes write{to{background-position:0 0}}

  .swipe-cue{animation:cue 3.6s ease-in-out 1.8s infinite}
  @keyframes cue{0%,100%{opacity:.42;transform:translateX(0)}50%{opacity:.95;transform:translateX(5px)}}
  /* independent breeze groups so no two flowers move alike */
  .sway{transform-origin:50% 100%;animation:sway 9s ease-in-out infinite}
  .sway2{transform-origin:50% 100%;animation:sway2 13s ease-in-out infinite}
  .sway3{transform-origin:50% 100%;animation:sway3 17s ease-in-out -4s infinite}
  @keyframes sway{0%,100%{transform:rotate(-.55deg) translateX(-2px)}50%{transform:rotate(.5deg) translateX(3px)}}
  @keyframes sway2{0%,100%{transform:rotate(.42deg) translateX(3px)}46%{transform:rotate(-.6deg) translateX(-3px)}}
  @keyframes sway3{0%,100%{transform:rotate(-.3deg)}38%{transform:rotate(.46deg)}72%{transform:rotate(-.18deg)}}

  /* ---------------- wish page ---------------- */
  #wishCv{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none}
  .wish-hint{
    position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);
    text-align:center;font-size:clamp(14px,4vw,16px);letter-spacing:.12em;
    color:#FFF6E4;text-shadow:0 0 18px rgba(255,186,110,.7),0 2px 12px rgba(0,0,0,.5);
    transition:opacity .9s var(--ease);animation:hintBreathe 4.6s ease-in-out infinite;pointer-events:none;
  }
  @keyframes hintBreathe{0%,100%{opacity:.55}50%{opacity:1}}
  .wish-hint.gone{opacity:0;animation:none}
  .wish-ring{
    position:absolute;left:50%;top:50%;width:clamp(96px,26vw,128px);aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;border:1px solid rgba(255,214,150,.42);opacity:0;transition:opacity .6s var(--ease);pointer-events:none;
  }
  .wish-ring.show{opacity:1;animation:ringPulse 2.8s ease-in-out infinite}
  @keyframes ringPulse{0%,100%{transform:translate(-50%,-50%) scale(1);border-color:rgba(255,214,150,.30)}50%{transform:translate(-50%,-50%) scale(1.08);border-color:rgba(255,226,180,.7)}}

  /* ---------------- celebration ---------------- */
  /* a soft darker pocket of sky so the celebration title stays legible over fireworks */
  #scCel::before{content:"";position:absolute;left:0;right:0;top:0;height:46vh;pointer-events:none;z-index:1;
    background:linear-gradient(180deg,rgba(3,6,18,.62) 0%,rgba(3,6,18,.40) 44%,rgba(3,6,18,0) 100%)}
  .finale-copy{
    position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 8vh);z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 clamp(20px,6vw,34px);
    text-align:center;pointer-events:none;
  }
  .finale-copy .msg.light{color:#F5F8FF;text-shadow:0 2px 10px rgba(0,0,0,.8),0 0 26px rgba(0,0,0,.55)}
  .festive{margin:0;font-family:var(--display);
    font-size:clamp(30px,8.8vw,48px);line-height:1.14;display:flex;flex-wrap:wrap;justify-content:center;max-width:94vw;
    padding:.06em .1em}
  .fsp{width:.34em}
  .fch{
    display:inline-block;
    background:linear-gradient(180deg,#FFF8DC 0%,#FFDE93 40%,#FFB0C6 72%,#BFE6FF 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 12px rgba(255,196,120,.75)) drop-shadow(0 2px 16px rgba(0,0,0,.45));
    animation:shimmer 5.4s ease-in-out infinite;
  }
  @keyframes shimmer{0%,72%,100%{transform:translateY(0) rotate(0)}80%{transform:translateY(-5px) rotate(-1.4deg)}90%{transform:translateY(1px) rotate(.6deg)}}
  /* the celebration copy fades in on its own story beat, not on page load */
  .finale-copy{opacity:0;transition:opacity 1.6s var(--ease),transform 1.6s var(--ease);transform:translateY(10px)}
  .finale-copy.reveal{opacity:1;transform:none}
  .moonlit{
  color:#FFFFFF;
  text-shadow:
    0 0 20px rgba(150,200,255,.75),
    0 0 52px rgba(80,150,255,.45),
    0 2px 22px rgba(0,0,0,.5);
}
  .night-orn{color:#C0D4FF;opacity:.65;letter-spacing:.4em;font-size:clamp(15px,4.2vw,18px);text-shadow:0 0 14px rgba(140,185,255,.5)}
  .glass{
  margin-top:8px;
  padding:14px 24px;
  border-radius:16px;

  background:rgba(20,38,78,.18);
  border:1px solid rgba(220,232,255,.10);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  box-shadow:0 8px 28px rgba(0,0,0,.12);

  max-width:29ch;
}

.glass .msg{
  line-height:1.8;
  letter-spacing:.02em;
  text-shadow:0 2px 12px rgba(0,0,0,.28);
}
  .msg.light{color:rgba(255,255,255,.94);text-shadow:0 2px 18px rgba(0,0,0,.62)}

  /* ---------------- cake prompts ---------------- */
  #cakeCv{touch-action:none}
  .cake-ui{
    position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 74px);
    display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 24px;text-align:center;pointer-events:none;z-index:3;
  }
  .prompt{
    margin:0;font-size:clamp(14.5px,4.1vw,16.5px);letter-spacing:.11em;color:#FFF3E0;
    text-shadow:0 0 16px rgba(255,170,100,.6),0 2px 14px rgba(0,0,0,.6);
    opacity:0;transition:opacity .8s var(--ease);
  }
  /* hintBreathe animates opacity, and a running animation outranks the base
     declaration — so it must only run while the line is actually shown, or the
     prompt can never be cleared. */
  .prompt.show{opacity:1;animation:hintBreathe 4.8s ease-in-out infinite}
  .cap-line{margin:0;font-family:var(--display);font-size:clamp(24px,7.4vw,34px);color:#FFF6E6;
    text-shadow:0 0 22px rgba(255,180,110,.7),0 2px 16px rgba(0,0,0,.55);opacity:0;transition:opacity 1s var(--ease)}
  .cap-line.show{opacity:1}

  /* ---------------- final page ---------------- */
  .final-wrap{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(14px,3vh,22px);padding:calc(env(safe-area-inset-top,0px) + 8vh) clamp(24px,7.5vw,36px) calc(env(safe-area-inset-bottom,0px) + 10vh);
    text-align:center;
  }
  .final-wrap > *{opacity:0;transform:translateY(14px)}
  .scene.on .final-wrap > *{animation:arriveSoft 1.8s var(--ease) forwards}
  .scene.on .final-wrap > *:nth-child(1){animation-delay:.35s}
  .scene.on .final-wrap > *:nth-child(2){animation-delay:1.25s}
  .scene.on .final-wrap > *:nth-child(3){animation-delay:2.2s}
  .scene.on .final-wrap > *:nth-child(4){animation-delay:3.1s}
  @keyframes arriveSoft{to{opacity:1;transform:none}}
  .sign{font-family:var(--body);font-size:clamp(14px,4vw,16px);letter-spacing:.14em;color:rgba(255,244,228,.82);line-height:2}
  #replay{
    margin-top:6px;display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 22px;
    border:1px solid rgba(255,228,190,.34);border-radius:999px;background:rgba(255,226,180,.07);
    color:#FFF1DC;font-family:var(--body);font-size:15px;letter-spacing:.14em;cursor:pointer;
    backdrop-filter:blur(6px);transition:background .4s var(--ease),border-color .4s var(--ease),transform .2s var(--ease);
  }
  #replay:hover,#replay:focus-visible{background:rgba(255,226,180,.15);border-color:rgba(255,232,200,.6);outline:none}
  #replay:active{transform:scale(.97)}

  /* final-page actions: the gift link sits above/beside Replay */
  .final-actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;margin-top:10px}
  #giftLink{
    display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 24px;
    border:1px solid rgba(255,214,164,.5);border-radius:999px;text-decoration:none;
    background:linear-gradient(180deg,rgba(255,231,192,.22),rgba(255,178,124,.12));
    color:#FFF6E6;font-family:var(--body);font-size:15px;letter-spacing:.08em;cursor:pointer;white-space:nowrap;
    box-shadow:0 10px 30px rgba(0,0,0,.28),0 0 24px rgba(255,190,120,.18),inset 0 1px 0 rgba(255,255,255,.2);
    backdrop-filter:blur(6px);
    transition:background .4s var(--ease),border-color .4s var(--ease),transform .2s var(--ease),box-shadow .4s var(--ease);
  }
  #giftLink:hover,#giftLink:focus-visible{
    background:linear-gradient(180deg,rgba(255,236,206,.34),rgba(255,186,134,.2));
    border-color:rgba(255,232,200,.78);
    box-shadow:0 12px 34px rgba(0,0,0,.32),0 0 34px rgba(255,196,130,.3),inset 0 1px 0 rgba(255,255,255,.28);
    outline:none;
  }
  #giftLink:active{transform:scale(.97)}

  /* ---------------- chrome ---------------- */
  #dots{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
    display:flex;justify-content:center;gap:7px;z-index:6;opacity:.5;transition:opacity .6s var(--ease)}
  #dots.dim{opacity:0;pointer-events:none}
  .dot{width:16px;height:2px;border-radius:2px;border:0;padding:0;background:rgba(255,255,255,.45);cursor:pointer;
    transition:transform .4s var(--ease),background .4s var(--ease),width .4s var(--ease)}
  .dot.on{background:#fff;width:26px}
  #sound{
    position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:7;
    width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.22);
    background:rgba(10,20,40,.22);backdrop-filter:blur(8px);color:rgba(255,255,255,.8);font-size:12px;
    cursor:pointer;opacity:.55;transition:opacity .4s var(--ease);display:flex;align-items:center;justify-content:center;padding:0
  }
  #sound:hover,#sound:focus-visible{opacity:1;outline:none}

  /* environmental veil: deep night blue that DARKENS a scene, never a black cut.
     It tops out well below opaque, so a dead black frame is impossible. */
  #veil{position:fixed;inset:0;pointer-events:none;z-index:8;opacity:0;
    background:radial-gradient(120% 90% at 50% 42%,rgba(10,18,48,.35) 0%,rgba(4,7,20,.72) 100%);
    transition:opacity 900ms var(--ease)}
  /* light bridge: embers and the lantern-to-candle warm light fly over the change */
  #linkCv{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9;opacity:0;
    transition:opacity 500ms linear}
  #linkCv.show{opacity:1}

  /* ---------------- opening gate ---------------- */
  #intro{
    position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:clamp(16px,3vh,26px);background:radial-gradient(circle at 50% 38%,#13355A 0%,#0A1730 52%,#04060F 100%);
    transition:opacity 1s var(--ease);padding:36px;text-align:center;
  }
  #intro.hide{opacity:0;pointer-events:none}
  #introStars{position:absolute;inset:0;width:100%;height:100%}
  #intro .inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.6vh,22px)}
  #intro h1{font-family:var(--display);font-size:clamp(38px,12vw,58px);margin:0;color:#FFF6E2;
    text-shadow:0 0 26px rgba(255,206,140,.55),0 0 70px rgba(120,160,255,.28);
    opacity:0;animation:arriveSoft 2.2s var(--ease) .5s forwards}
  #intro p{margin:0;font-size:clamp(15px,4.2vw,17px);line-height:1.75;color:rgba(255,248,236,.8);max-width:25ch;
    opacity:0;animation:arriveSoft 2s var(--ease) 1.5s forwards}
  #startBtn{
    margin-top:4px;min-height:48px;padding:13px 26px;border-radius:999px;border:1px solid rgba(255,232,198,.3);
    background:rgba(255,232,198,.06);color:#FFF3E2;font-family:var(--body);font-size:15px;letter-spacing:.16em;
    cursor:pointer;backdrop-filter:blur(6px);opacity:0;
    animation:arriveSoft 1.8s var(--ease) 2.6s forwards,gateBreathe 5s ease-in-out 4.4s infinite;
  }
  @keyframes gateBreathe{0%,100%{border-color:rgba(255,232,198,.22);box-shadow:0 0 0 rgba(255,210,150,0)}50%{border-color:rgba(255,238,212,.6);box-shadow:0 0 26px rgba(255,200,140,.22)}}
  #startBtn:active{transform:scale(.98)}

  @media (min-width:900px){
    .msg{max-width:34ch}
    .copy{padding-top:13vh}
    .t-xl{font-size:clamp(52px,5.4vw,74px)}
  }
  /* short landscape / desktop: keep the celebration title clear of the couple */
  @media (max-height:560px){
    .copy{padding-top:calc(env(safe-area-inset-top,0px) + 7vh)}
    .finale-copy{top:calc(env(safe-area-inset-top,0px) + 4vh)}
    .cake-ui{bottom:calc(env(safe-area-inset-bottom,0px) + 46px)}
  }
  @media (prefers-reduced-motion:reduce){
    .sway,.sway2,.sway3,.swipe-cue,.fch,.wish-ring.show,.prompt,.wish-hint,#startBtn,.scene.on .camera{animation:none}
    .copy > *,.final-wrap > *{opacity:1;transform:none;filter:none;animation:none}
    .writein{-webkit-text-fill-color:#FFF6E2;color:#FFF6E2;background:none}
    :root{--tdur:700ms}
    .scene{filter:none;transform:none}
    .scene.out{filter:none;transform:none}
  }
</style>
</head>
<body>
  <div id="stage"></div>
  <div id="dots"></div>
  <button id="sound" aria-label="Toggle music">&#9835;</button>

  <!-- =====================================================================
       BACKGROUND MUSIC  -  PUT YOUR THREE SONGS HERE
       Drop your files next to this HTML file (a "music" folder is fine) and
       change ONLY the src="..." values below. mp3 / m4a / ogg / wav all work.

         music1  plays from the moment the card is opened (opening pages)
         music2  plays on the celebration / sky-lantern screen
         music3  plays from the cake-cutting screen through the final page

       Nothing else needs editing. If a file is missing the card falls back
       to its built-in score instead of breaking.
       ===================================================================== -->
  <audio id="music1" src="music1-opening.mp3" preload="auto" loop></audio>
  <audio id="music2" src="music2-celebration.mp3" preload="auto" loop></audio>
  <audio id="music3" src="music3-cake.mp3" preload="auto" loop></audio>

  <canvas id="linkCv"></canvas>
  <div id="veil"></div>
  <div id="intro">
    <canvas id="introStars"></canvas>
    <div class="inner">
      <h3>It's 12</h3>
      <h1>Happy 17th Birthday</h1>
      <button id="startBtn">&#9834;&nbsp; tap to begin</button>
    </div>
  </div>
<script>/* ===================== REALISTIC AUDIO ENGINE (Web Audio, fully synthesized) ===================== */
const AE = (() => {
  let ctx = null, master = null, revSend = null, noise2 = null, started = false;
  let musicOn = false, musicTimers = [], musicGain = null, ambGain = null, ambNodes = [];

  function noiseBuffer(dur) {
    const b = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; d[i] = w; last = w; }
    return b;
  }
  function impulse(dur, decay) {
    const len = Math.floor(ctx.sampleRate * dur);
    const b = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c);
      for (let i = 0; i < len; i++) {
        const t = i / len;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (1 - t * 0.2);
      }
    }
    return b;
  }
  function init() {
    if (ctx) return ctx;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.9;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 3.5;
    comp.attack.value = 0.004; comp.release.value = 0.25;
    const conv = ctx.createConvolver(); conv.buffer = impulse(2.6, 2.4);
    revSend = ctx.createGain(); revSend.gain.value = 0.34;
    revSend.connect(conv);
    master.connect(comp); conv.connect(comp); comp.connect(ctx.destination);
    noise2 = noiseBuffer(2.2);
    musicGain = ctx.createGain(); musicGain.gain.value = 0.9; musicGain.connect(master); musicGain.connect(revSend);
    return ctx;
  }
  async function unlock() { init(); if (ctx.state === "suspended") await ctx.resume(); started = true; }
  const now = () => (ctx ? ctx.currentTime : 0);

  function src(t, dur, rate) {
    const s = ctx.createBufferSource(); s.buffer = noise2; s.loop = true;
    s.playbackRate.value = rate || 1; s.start(t); s.stop(t + dur + 0.05); return s;
  }
  function env(t, a, peak, d, curve) {
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    if (curve === "lin") g.gain.linearRampToValueAtTime(0.0001, t + a + d);
    else g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
    return g;
  }
  function out(node, wet) {
    node.connect(master);
    if (wet) { const w = ctx.createGain(); w.gain.value = wet; node.connect(w); w.connect(revSend); }
  }

  /* --- rocket launch: airy whoosh + rising whistle (doppler-ish) --- */
  function launch(t, dist = 1) {
    if (!ctx) return;
    const dur = 1.15, n = src(t, dur, 1), f = ctx.createBiquadFilter(), g = env(t, 0.12, 0.075 / dist, dur, "lin");
    f.type = "bandpass"; f.Q.value = 1.1;
    f.frequency.setValueAtTime(520, t);
    f.frequency.exponentialRampToValueAtTime(2600, t + dur);
    n.connect(f); f.connect(g); out(g, 0.25);
    const o = ctx.createOscillator(), og = env(t, 0.15, 0.035 / dist, dur, "lin");
    o.type = "sine"; o.frequency.setValueAtTime(360, t);
    o.frequency.exponentialRampToValueAtTime(1150, t + dur * 0.92);
    o.connect(og); out(og, 0.3); o.start(t); o.stop(t + dur + 0.05);
  }
  /* --- shell burst: sharp crack + deep boom + rumble tail --- */
  function boom(t, size = 1, dist = 1) {
    if (!ctx) return;
    const v = (0.55 * size) / dist;
    // crack
    const n1 = src(t, 0.28, 1.6), h = ctx.createBiquadFilter(), g1 = env(t, 0.002, v * 0.8, 0.26);
    h.type = "highpass"; h.frequency.value = 1100;

    // body
    const n2 = src(t, 1.5, 0.7), lp = ctx.createBiquadFilter(), g2 = env(t + 0.005, 0.012, v, 1.35);
    lp.type = "lowpass"; lp.Q.value = 0.9;
    lp.frequency.setValueAtTime(1500, t);
    lp.frequency.exponentialRampToValueAtTime(150, t + 0.9);
    n2.connect(lp); lp.connect(g2); out(g2, 0.75);

    const o = ctx.createOscillator(), og = env(t, 0.01, v * 0.75, 0.75);
    o.type = "sine"; o.frequency.setValueAtTime(105 / size, t);
    o.frequency.exponentialRampToValueAtTime(32, t + 0.6);
    o.connect(og); out(og, 0.45); o.start(t); o.stop(t + 0.9);
  }
  /* --- crackle / glitter tail --- */
  function crackle(t, count = 26, dist = 1, spread = 1.5) {
    if (!ctx) return;
    for (let i = 0; i < count; i++) {
      const tt = t + Math.random() * spread;
      const n = src(tt, 0.035, 2.2), f = ctx.createBiquadFilter(), g = env(tt, 0.002, (0.05 + Math.random() * 0.05) / dist, 0.03);
      f.type = "highpass"; f.frequency.value = 2600 + Math.random() * 2600;
      n.connect(f); f.connect(g); out(g, 0.4);
    }
  }
  /* --- sparkle chime --- */
  function sparkle(t, freq = 1760, vol = 0.06) {
    if (!ctx) return;
    const o = ctx.createOscillator(), g = env(t, 0.004, vol, 0.9);
    o.type = "sine"; o.frequency.value = freq;
    o.connect(g); out(g, 0.6); o.start(t); o.stop(t + 1.1);
  }
  /* --- party popper: paper crack + streamer flutter --- */
  function popper(t, vol = 1) {
    if (!ctx) return;
    const n = src(t, 0.05, 1.8), bp = ctx.createBiquadFilter(), g = env(t, 0.001, 0.62 * vol, 0.05);
    bp.type = "bandpass"; bp.frequency.value = 1500; bp.Q.value = 0.8;
    n.connect(bp); bp.connect(g); out(g, 0.55);
    const o = ctx.createOscillator(), og = env(t, 0.001, 0.4 * vol, 0.12);
    o.type = "triangle"; o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.1);
    o.connect(og); out(og, 0.3); o.start(t); o.stop(t + 0.2);
    // paper streamer flutter
    const n2 = src(t + 0.04, 0.7, 1.1), hp = ctx.createBiquadFilter(), g2 = env(t + 0.04, 0.05, 0.07 * vol, 0.65, "lin");
    hp.type = "highpass"; hp.frequency.value = 2200;
    n2.connect(hp); hp.connect(g2); out(g2, 0.3);
  }
  /* --- blowout whistle / party blower --- */
  function blower(t, vol = 1) {
    if (!ctx) return;
    const dur = 0.62;
    const o = ctx.createOscillator(), o2 = ctx.createOscillator();
    const bp = ctx.createBiquadFilter(), g = env(t, 0.04, 0.2 * vol, dur, "lin");
    o.type = "sawtooth"; o2.type = "square";
    o.frequency.setValueAtTime(430, t); o.frequency.linearRampToValueAtTime(600, t + 0.1);
    o.frequency.linearRampToValueAtTime(520, t + dur);
    o2.frequency.setValueAtTime(866, t); o2.frequency.linearRampToValueAtTime(1180, t + 0.12);
    const lfo = ctx.createOscillator(), lg = ctx.createGain();
    lfo.frequency.value = 15; lg.gain.value = 26;
    lfo.connect(lg); lg.connect(o.frequency); lfo.start(t); lfo.stop(t + dur + 0.1);
    bp.type = "bandpass"; bp.frequency.value = 1000; bp.Q.value = 1.6;
    const g2 = ctx.createGain(); g2.gain.value = 0.35;
    o.connect(bp); o2.connect(g2); g2.connect(bp); bp.connect(g); out(g, 0.3);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
    // breath
    const n = src(t, dur, 1), hp = ctx.createBiquadFilter(), ng = env(t, 0.05, 0.05 * vol, dur, "lin");
    hp.type = "highpass"; hp.frequency.value = 2600;
    n.connect(hp); hp.connect(ng); out(ng, 0.2);
  }
  /* --- knife through cake: soft crisp slice --- */
  function slice(t) {
    if (!ctx) return;
    const n = src(t, 0.5, 0.9), bp = ctx.createBiquadFilter(), g = env(t, 0.06, 0.1, 0.42, "lin");
    bp.type = "bandpass"; bp.frequency.setValueAtTime(1800, t);
    bp.frequency.exponentialRampToValueAtTime(600, t + 0.45); bp.Q.value = 0.7;
    n.connect(bp); bp.connect(g); out(g, 0.25);
  }
  function plateClink(t) {
    if (!ctx) return;
    [2400, 3300, 4700].forEach((f, i) => {
      const o = ctx.createOscillator(), g = env(t + i * 0.004, 0.002, 0.05 - i * 0.012, 0.5);
      o.type = "sine"; o.frequency.value = f; o.connect(g); out(g, 0.6); o.start(t); o.stop(t + 0.6);
    });
  }
  /* --- blowing out candles --- */
  function puff(t) {
    if (!ctx) return;
    const n = src(t, 0.55, 1), bp = ctx.createBiquadFilter(), g = env(t, 0.07, 0.16, 0.45, "lin");
    bp.type = "bandpass"; bp.frequency.setValueAtTime(900, t);
    bp.frequency.exponentialRampToValueAtTime(350, t + 0.5); bp.Q.value = 0.6;
    n.connect(bp); bp.connect(g); out(g, 0.2);
  }
  /* --- balloon rubber squeak / lift --- */
  function balloonPuff(t) {
    if (!ctx) return;
    const n = src(t, 0.8, 0.6), lp = ctx.createBiquadFilter(), g = env(t, 0.2, 0.035, 0.6, "lin");
    lp.type = "lowpass"; lp.frequency.value = 700;
    n.connect(lp); lp.connect(g); out(g, 0.3);
  }
  /* --- crowd: cheering + applause --- */
  function cheer(t, dur = 4, vol = 0.5) {
    if (!ctx) return;
    const n = src(t, dur, 1), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    bp.type = "bandpass"; bp.frequency.value = 800; bp.Q.value = 0.5;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.075 * vol, t + 0.35);
    g.gain.linearRampToValueAtTime(0.05 * vol, t + dur * 0.55);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    n.connect(bp); bp.connect(g); out(g, 0.55);
    const claps = Math.floor(dur * 22);
    for (let i = 0; i < claps; i++) {
      const tt = t + 0.1 + Math.random() * (dur - 0.4);
      const cn = src(tt, 0.04, 1.5), hp = ctx.createBiquadFilter(), cg = env(tt, 0.002, (0.025 + Math.random() * 0.03) * vol, 0.05);
      hp.type = "highpass"; hp.frequency.value = 1400 + Math.random() * 1200;
      cn.connect(hp); hp.connect(cg); out(cg, 0.5);
    }
  }
  /* --- gentle night ambience --- */
  function startAmbience(vol = 0.03) {
    if (!ctx) return;
    stopAmbience();
    const t = now();
    const n = src(t, 600, 0.8), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    lp.type = "lowpass"; lp.frequency.value = 420;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 2.5);
    n.connect(lp); lp.connect(g); g.connect(master);
    ambGain = g; ambNodes = [n];
  }
  function stopAmbience() {
    if (!ctx || !ambGain) return;
    const t = now();
    ambGain.gain.cancelScheduledValues(t);
    ambGain.gain.setTargetAtTime(0.0001, t, 0.5);
    ambNodes.forEach(n => { try { n.stop(t + 2); } catch (e) { } });
    ambGain = null; ambNodes = [];
  }

  /* ===================== MUSIC: music-box Happy Birthday + warm strings ===================== */
  const N = { C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392, A4: 440, Bb4: 466.16, C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880, Bb5: 932.33, C6: 1046.5, F3: 174.61, G3: 196, A3: 220, Bb3: 233.08, C3: 130.81, D3: 146.83, E3: 164.81, F2: 87.31, C2: 65.41, Bb1: 58.27 };
  const MEL = [
    [N.C5, .5], [N.C5, .25], [N.D5, .75], [N.C5, .75], [N.F5, .75], [N.E5, 1.25],
    [N.C5, .5], [N.C5, .25], [N.D5, .75], [N.C5, .75], [N.G5, .75], [N.F5, 1.25],
    [N.C5, .5], [N.C5, .25], [N.C6, .75], [N.A5, .75], [N.F5, .75], [N.G5, .4], [N.F5, 1.4],
    [N.Bb5, .5], [N.Bb5, .25], [N.A5, .75], [N.F5, .75], [N.G5, .75], [N.F5, 1.75]
  ];
  const CHORDS = [
    [N.F2, [N.F3, N.A3, N.C4]], [N.C2, [N.G3, N.Bb3, N.E4]], [N.F2, [N.F3, N.A3, N.C4]],
    [N.Bb1, [N.Bb3, N.D4, N.F4]], [N.C2, [N.C3, N.E3, N.G4]], [N.F2, [N.F3, N.A3, N.C4]]
  ];
  function bell(t, freq, dur, gain) {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), g2 = ctx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    o2.type = "triangle"; o2.frequency.value = freq * 2.006;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 1.5);
    g2.gain.setValueAtTime(0.0001, t); g2.gain.linearRampToValueAtTime(gain * 0.28, t + 0.012);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.7 + 0.5);
    o.connect(g); o2.connect(g2); g.connect(musicGain); g2.connect(musicGain);
    o.start(t); o2.start(t); o.stop(t + dur + 1.8); o2.stop(t + dur + 1.2);
  }
  function pad(t, root, notes, dur) {
    [root, ...notes].forEach((fr, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = i === 0 ? "sine" : "triangle"; o.frequency.value = fr;
      f.type = "lowpass"; f.frequency.value = 1500;
      const amp = i === 0 ? 0.075 : 0.03;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(amp, t + 1);
      g.gain.linearRampToValueAtTime(amp * 0.7, t + dur * 0.8);
      g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.7);
      o.connect(f); f.connect(g); g.connect(musicGain);
      o.start(t); o.stop(t + dur + 0.9);
    });
  }
  /* extra voices for the other two tracks */
  function pluck(t, freq, dur, gain, type = "triangle") {
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = type; o.frequency.value = freq;
    f.type = "lowpass"; f.frequency.setValueAtTime(freq * 7, t); f.frequency.exponentialRampToValueAtTime(freq * 1.6, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(musicGain);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function bassNote(t, freq, dur, gain = 0.12) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function shaker(t, gain = 0.045) {
    const s = src(t, 0.09, 1), f = ctx.createBiquadFilter(), g = ctx.createGain();
    f.type = "highpass"; f.frequency.value = 5200;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    s.connect(f); f.connect(g); g.connect(musicGain);
  }
  function swell(t, freq, dur, gain = 0.05) {
    const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = "sawtooth"; o.frequency.value = freq;
    f.type = "lowpass"; f.frequency.setValueAtTime(400, t); f.frequency.linearRampToValueAtTime(2200, t + dur * 0.6);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(gain, t + dur * 0.55);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(g); g.connect(musicGain); g.connect(revSend);
    o.start(t); o.stop(t + dur + 0.1);
  }

  /* --- TRACK 1: "garden" soft music box Happy Birthday (pages 1-5) --- */
  function trackGarden(startAt) {
    const b = 60 / 88;
    [N.F5, N.A5, N.C6, N.F5].forEach((fr, i) => bell(startAt + 0.05 + i * 0.16, fr, 0.4, 0.1));
    let t = startAt + 0.95; const melStart = t;
    MEL.forEach(([fr, len]) => { bell(t, fr, len * b * 0.9, 0.16); t += len * b; });
    CHORDS.forEach(([r, ns], i) => pad(melStart - b * 0.5 + i * b * 4, r, ns, b * 4));
    return t - startAt + 2.4;
  }

  /* --- TRACK 2: "sky" cinematic, dreamy lantern/fireworks theme (celebration page) --- */
  const SKY_CH = [
    [N.F2, [N.F3, N.A3, N.C4]], [N.D3 / 2, [N.F3, N.A3, N.D4]],
    [N.Bb1, [N.Bb3, N.D4, N.F4]], [N.C2, [N.C3, N.G3, N.E4]]
  ];
  function trackSky(startAt) {
    const bar = 3.6;
    SKY_CH.forEach(([r, ns], i) => {
      const t = startAt + i * bar;
      pad(t, r, ns, bar + 0.6);
      swell(t + 0.2, r * 2, bar * 0.9, 0.035);
      // slow shimmering arpeggio, like distant lanterns
      ns.concat([ns[0] * 2, ns[1] * 2]).forEach((fr, k) => bell(t + 0.3 + k * 0.42, fr * 2, 0.9, 0.055));
    });
    // soaring top line
    const line = [[N.A5, 2.2], [N.C6, 1.6], [N.Bb5, 2.0], [N.A5, 2.6], [N.F5, 2.2], [N.G5, 1.6], [N.A5, 2.2]];
    let t = startAt + 1.2;
    line.forEach(([fr, d]) => { bell(t, fr, d, 0.085); swell(t, fr / 2, d * 0.9, 0.02); t += d; });
    return Math.max(SKY_CH.length * bar, t - startAt) + 1.2;
  }

  /* --- TRACK 3: "party" bouncy marimba party groove (cake page) --- */
  const PARTY_MEL = [
    [N.C5, .5], [N.C5, .5], [N.D5, 1], [N.C5, 1], [N.F5, 1], [N.E5, 2],
    [N.C5, .5], [N.C5, .5], [N.D5, 1], [N.C5, 1], [N.G5, 1], [N.F5, 2],
    [N.C5, .5], [N.C5, .5], [N.C6, 1], [N.A5, 1], [N.F5, 1], [N.E5, .5], [N.D5, 1.5],
    [N.Bb5, .5], [N.Bb5, .5], [N.A5, 1], [N.F5, 1], [N.G5, 1], [N.F5, 2]
  ];
  const PARTY_BASS = [N.F2, N.F2, N.C2, N.C2, N.F2, N.F2, N.Bb1, N.C2];
  function trackParty(startAt) {
    const b = 60 / 132;
    let t = startAt, beats = 0;
    PARTY_MEL.forEach(([fr, len]) => {
      pluck(t, fr, Math.max(0.22, len * b * 0.85), 0.1);
      pluck(t + 0.012, fr * 2.01, Math.max(0.16, len * b * 0.5), 0.035, "sine");
      t += len * b; beats += len;
    });
    const totalBeats = Math.ceil(beats);
    for (let i = 0; i < totalBeats; i++) {
      const bt = startAt + i * b;
      bassNote(bt, PARTY_BASS[Math.floor(i / 4) % PARTY_BASS.length], b * 0.9, 0.1);
      shaker(bt + b * 0.5, 0.04);
      if (i % 4 === 0) shaker(bt, 0.055);
    }
    return totalBeats * b + 0.6;
  }

  const TRACKS = { garden: trackGarden, sky: trackSky, party: trackParty };
  let curTrack = "garden", baseLevel = 0.9;
  function scheduleMusic(startAt) {
    const total = (TRACKS[curTrack] || trackGarden)(startAt);
    musicTimers.push(setTimeout(() => { if (musicOn) scheduleMusic(ctx.currentTime + 0.15); }, total * 1000));
  }
  function musicStart(track) {
    if (track) curTrack = track;
    if (!ctx || musicOn) return;
    musicOn = true; musicGain.gain.setTargetAtTime(baseLevel, now(), 0.3); scheduleMusic(now() + 0.1);
  }
  function musicStop() { musicOn = false; musicTimers.forEach(clearTimeout); musicTimers = []; if (ctx) musicGain.gain.setTargetAtTime(0.0001, now(), 0.25); }
  function musicLevel(v, time = 1.2) { baseLevel = v; if (ctx && musicGain && musicOn) musicGain.gain.setTargetAtTime(v, now(), time / 3); }
  /* crossfade between the three section tracks */
  function setTrack(name, level) {
    if (!TRACKS[name]) return;
    if (typeof level === "number") baseLevel = level;
    if (name === curTrack) { if (ctx && musicOn) musicGain.gain.setTargetAtTime(baseLevel, now(), 0.4); return; }
    curTrack = name;
    if (!ctx || !musicOn) return;
    musicTimers.forEach(clearTimeout); musicTimers = [];
    musicGain.gain.setTargetAtTime(0.0001, now(), 0.28);          // fade old out
    musicTimers.push(setTimeout(() => {
      if (!musicOn) return;
      musicGain.gain.setTargetAtTime(baseLevel, now(), 0.5);       // fade new in
      scheduleMusic(now() + 0.08);
    }, 950));
  }
  function currentTrack() { return curTrack; }

  return {
    unlock, init, now, launch, boom, crackle, sparkle, popper, blower, slice, plateClink,
    puff, balloonPuff, cheer, startAmbience, stopAmbience,
    musicStart, musicStop, musicLevel, setTrack, currentTrack,
    get on() { return musicOn; }, get ready() { return started; }
  };
})();

<script>/* ===================== BACKGROUND MUSIC (three songs, one per section) ===================== */
/* =========================================================================
   BACKGROUND MUSIC  —  three real songs, one per section of the story.

   TO USE YOUR OWN MUSIC: change only the three <audio> tags near the top of
   the HTML file (ids music1 / music2 / music3). Nothing in here needs editing.

     music1   opening pages       starts the moment the card is opened
     music2   celebration         the sky-lantern scene
     music3   cake cutting        carries on to the final page

   Guarantees enforced here:
     - only ONE song is ever audible
     - the previous song is faded out AND paused BEFORE the next one starts
     - a song always begins at 0:00 when its section is entered
     - staying inside a section never restarts its song
     - stopAll() silences everything instantly (gift link, replay, page exit)
     - if a file is missing or undecodable, the card falls back to its built-in
       synthesised score instead of going silent or breaking
   ========================================================================= */
const BGM = (() => {
  const IDS = { opening: "music1", celebration: "music2", cake: "music3" };
  const VOL = { opening: 0.70, celebration: 0.80, cake: 0.75 };
  const SYNTH = { opening: "garden", celebration: "night", cake: "cake" };
  const OUT_MS = 260;    // old song fades down over this, then pauses
  const IN_MS = 420;     // new song fades up over this

  const el = {}, dead = {};
  let want = null, playing = null, gen = 0;
  let enabled = true, fileMode = false, pending = null, armed = false;

  for (const key in IDS) {
    const a = document.getElementById(IDS[key]);
    if (!a) { dead[key] = true; continue; }
    a.loop = true;
    a.preload = "auto";
    a.volume = 0;
    a.addEventListener("error", () => {
      dead[key] = true;
      if (want === key) { playing = null; fileMode = false; synth(key); }
    });
    el[key] = a;
  }

  const has = key => !!el[key] && !dead[key];

  function clearFade(a) { if (a && a._fx) { clearInterval(a._fx); a._fx = 0; } }

  function fadeTo(a, target, ms, done) {
    clearFade(a);
    const from = a.volume, steps = Math.max(1, Math.round(ms / 25));
    let i = 0;
    a._fx = setInterval(() => {
      i++;
      const v = from + (target - from) * (i / steps);
      try { a.volume = v < 0 ? 0 : v > 1 ? 1 : v; } catch (e) { }
      if (i >= steps) { clearFade(a); done && done(); }
    }, 25);
  }

  /* a stopped song is paused AND rewound, so the next entry is a clean 0:00 */
  function hardStop(a) {

  g += `<g transform="translate(548 740) rotate(180)">${peonyOutline(.78, line, 2.1)}</g>`;
  g += `<g transform="translate(300 6) rotate(96)">${bigLeaf(1, line, 2.1)}</g>`;
  g += `<g transform="translate(600 330) rotate(196)">${bigLeaf(1.15, line, 2.1)}</g>`;
  g += `<g transform="translate(470 600) rotate(-46)">${bigLeaf(.95, line, 2.1)}</g>`;
  g += `<g transform="translate(90 890) rotate(-8)">${bigLeaf(1, line, 2.1)}</g>`;

<script>/* ===================== PETAL FIELD ===================== */
/* ===================== PETAL FIELD =====================
   A very quiet canvas that sits over each light page: a few detached petals drifting
   down, faint pollen motes, and one slow sweep of soft light. Deliberately sparse —
   the point is atmosphere you feel rather than animation you watch. */
class PetalField {
  constructor(canvas, opts = {}) {
    this.cv = canvas;
    this.tint = opts.tint || "#FFFFFF";
    this.accent = opts.accent || "#F6C9DE";
    this.density = opts.density === undefined ? 1 : opts.density;
    this.running = false;
    this.petals = []; this.motes = [];
    this.reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.resize();
    this._onResize = () => this.resize();
    window.addEventListener("resize", this._onResize);
  }
  resize() {
    const a = fitCanvas(this.cv); this.c = a.c; this.w = a.w; this.h = a.h;
    this.S = Math.min(this.w / 380, 1.25);
    const pc = Math.round((this.reduced ? 3 : 9) * this.density);
    const mc = Math.round((this.reduced ? 8 : 26) * this.density);
    this.petals = Array.from({ length: pc }, () => this.newPetal(rnd(-this.h * 0.2, this.h)));
    this.motes = Array.from({ length: mc }, () => ({
      x: rnd(0, this.w), y: rnd(0, this.h), r: rnd(0.5, 1.6) * this.S,
      vy: rnd(-7, 4), vx: rnd(-4, 4), p: rnd(0, 6.3), sp: rnd(0.5, 1.3), a: rnd(0.10, 0.34)
    }));
  }
  /* petals detach one at a time and take their own lazy path down */
  newPetal(y) {
    return {
      x: rnd(0, this.w), y: y === undefined ? rnd(-60, -10) : y,
      r: rnd(4.5, 9) * this.S,
      vy: rnd(9, 21), vx: rnd(-7, 7),
      p: rnd(0, 6.3), sp: rnd(0.5, 1.1), amp: rnd(10, 34),
      rot: rnd(0, 6.3), vr: rnd(-0.5, 0.5),
      flip: rnd(0.6, 1), fsp: rnd(0.7, 1.6),
      col: Math.random() > 0.45 ? this.tint : this.accent,
      a: rnd(0.35, 0.72)

  }
  start() { if (this.running) return; this.running = true; this.last = performance.now(); this.loop(); }
  stop() { this.running = false; }
  destroy() { this.stop(); window.removeEventListener("resize", this._onResize); }
  loop() {
    if (!this.running) return;
    const now = performance.now();
    let dt = (now - this.last) / 1000; this.last = now;
    dt = Math.min(dt, 0.05);

    this.draw(now / 1000);
    requestAnimationFrame(() => this.loop());
  }
  update(dt, T) {
    const breeze = Math.sin(T * 0.13) * 9 + Math.sin(T * 0.041) * 6;   // slow, non-looping feel
    this.petals.forEach(p => {
      p.p += dt * p.sp; p.rot += p.vr * dt; p.flip = 0.35 + Math.abs(Math.sin(T * p.fsp + p.p)) * 0.65;
      p.x += (p.vx + breeze + Math.sin(p.p) * p.amp) * dt;
      p.y += (p.vy + Math.cos(p.p * 0.7) * 3) * dt;
      if (p.y > this.h + 40 || p.x < -60 || p.x > this.w + 60) Object.assign(p, this.newPetal());
    });
    this.motes.forEach(m => {
      m.p += dt * m.sp;
      m.x += (m.vx + breeze * 0.35 + Math.sin(m.p) * 5) * dt;
      m.y += m.vy * dt;
      if (m.y < -10) { m.y = this.h + 10; m.x = rnd(0, this.w); }
      if (m.y > this.h + 10) { m.y = -10; m.x = rnd(0, this.w); }
    });
  }
  draw(T) {
    const { c, w, h } = this;
    c.clearRect(0, 0, w, h);

    // one very soft band of light drifting across the page
    const lx = (0.5 + Math.sin(T * 0.045) * 0.42) * w;
    const lg = c.createRadialGradient(lx, h * 0.28, 10, lx, h * 0.28, w * 0.75);
    lg.addColorStop(0, "rgba(255,255,255,.16)");
    lg.addColorStop(0.55, "rgba(255,255,255,.05)");
    lg.addColorStop(1, "rgba(255,255,255,0)");
    c.fillStyle = lg; c.fillRect(0, 0, w, h);

    // pollen motes
    this.motes.forEach(m => {
      c.globalAlpha = m.a * (0.55 + Math.sin(m.p * 1.7) * 0.45);
      c.fillStyle = "#FFFFFF";
      c.beginPath(); c.arc(m.x, m.y, m.r, 0, 6.3); c.fill();
    });
    c.globalAlpha = 1;

    // drifting petals — each one tumbles on its own axis
    this.petals.forEach(p => {
      c.save();
      c.translate(p.x, p.y);
      c.rotate(p.rot);
      c.scale(1, p.flip);                         // reads as a petal turning over in the air
      c.globalAlpha = p.a;
      const g = c.createLinearGradient(-p.r, -p.r, p.r, p.r);
      g.addColorStop(0, p.col);
      g.addColorStop(1, "rgba(255,255,255,.35)");
      c.fillStyle = g;
      c.beginPath();
      c.moveTo(0, -p.r);
      c.bezierCurveTo(p.r * 0.95, -p.r * 0.45, p.r * 0.7, p.r * 0.7, 0, p.r);
      c.bezierCurveTo(-p.r * 0.7, p.r * 0.7, -p.r * 0.95, -p.r * 0.45, 0, -p.r);
      c.closePath(); c.fill();
      c.strokeStyle = "rgba(255,255,255,.30)"; c.lineWidth = 0.7; c.stroke();
      c.restore();
    });
    c.globalAlpha = 1;
  }
}
</script>
<script>/* ===================== WISH CANDLE ===================== */
/* ===================== WISH SCENE =====================
   Press and hold the flame: it brightens, breathes, the world dims, embers climb.
   Let go: the flame gutters, smoke curls up, and the embers carry the wish into the sky,
   which is what hands off to the celebration scene. */
class WishScene {
  constructor(canvas, opts = {}) {
    this.cv = canvas;
    this.onWish = opts.onWish || function () { };      // fired once the embers have flown
    this.onPhase = opts.onPhase || function () { };    // "idle" | "holding" | "released" | "done"
    this.running = false;
    this.hold = 0;          // 0..1 charge while pressed
    this.lit = 1;           // flame strength
    this.held = false;
    this.phase = "idle";
    this.embers = [];
    this.smoke = [];
    this.motes = [];
    this.flick = 0;
    this.gust = 0;
    this.doneAt = 0;
    this.reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.resize();
    this._onResize = () => this.resize();
    window.addEventListener("resize", this._onResize);
    this.bindPointer();
  }
  resize() {
    const a = fitCanvas(this.cv); this.c = a.c; this.w = a.w; this.h = a.h;
    this.S = Math.min(this.w / 380, this.h / 760);
    this.cx = this.w * 0.5;
    this.baseY = this.h * 0.76;                 // candle sits low so copy stays clear
    if (!this.motes.length)
      this.motes = Array.from({ length: 26 }, () => ({
        x: rnd(0, this.w), y: rnd(0, this.h), r: rnd(0.6, 1.7), vy: rnd(-9, -2), vx: rnd(-4, 4), p: rnd(0, 6.3)
      }));
  }
  wickY() { return this.baseY - 132 * this.S; }
  /* a generous touch target around the flame, not a tiny hotspot */
  hits(x, y) {
    const r = Math.max(64, 92 * this.S);

  }
  bindPointer() {
    const local = e => {
      const b = this.cv.getBoundingClientRect();

    };

      if (window.AE && AE.ready) AE.sparkle(AE.now(), 1318, 0.045);
    });

      if (!this.held) return;

      const [, ] = local(e);

      else this.setPhase("idle");         // too short to count as a wish
    };

    this.cv.addEventListener("pointercancel", up);
    this.cv.addEventListener("pointerleave", up);

    this.cv.setAttribute("tabindex", "0");
    this.cv.setAttribute("role", "button");
    this.cv.setAttribute("aria-label", "Press and hold to make a wish on the candle");
    this.cv.addEventListener("keydown", e => {
      if ((e.key === " " || e.key === "Enter") && this.phase === "idle") { e.preventDefault(); this.held = true; this.setPhase("holding"); }
    });
    this.cv.addEventListener("keyup", e => {
      if (e.key === " " || e.key === "Enter") { if (this.held) { this.held = false; if (this.hold > 0.2) this.blowOut(); else this.setPhase("idle"); } }
    });
  }
  setPhase(p) { if (this.phase !== p) { this.phase = p; this.onPhase(p); } }
  blowOut() {
    this.setPhase("released");
    this.gust = 1;
    if (window.AE && AE.ready) { AE.puff(AE.now()); AE.sparkle(AE.now() + 0.25, 1760, 0.05); AE.sparkle(AE.now() + 0.55, 2093, 0.04); }

    for (let i = 0; i < n; i++) {
      const d = rnd(0, 1);
      this.embers.push({
        x: this.cx + rnd(-9, 9) * this.S, y: this.wickY() - rnd(0, 26) * this.S,
        vy: -rnd(26, 74) * (0.6 + d * 0.7), vx: rnd(-10, 10),
        r: rnd(0.8, 2.3) * this.S, p: rnd(0, 6.3), sp: rnd(1.4, 3.2),
        life: rnd(3.4, 6.2), age: -rnd(0, 0.9), warm: rnd(0.85, 1.1)
      });
    }
    for (let i = 0; i < 18; i++)
      this.smoke.push({ x: this.cx + rnd(-5, 5), y: this.wickY() - rnd(0, 18), vy: -rnd(14, 30), vx: rnd(-6, 6), r: rnd(5, 13) * this.S, age: -i * 0.07, life: rnd(2.6, 4.2), p: rnd(0, 6.3) });

  reset() {
    this.hold = 0; this.lit = 1; this.held = false; this.embers = []; this.smoke = [];
    this.gust = 0; this.doneAt = 0; this.phase = "idle"; this.onPhase("idle");
  }
  start() { if (this.running) return; this.running = true; this.last = performance.now(); this.loop(); }
  stop() { this.running = false; }
  destroy() { this.stop(); window.removeEventListener("resize", this._onResize); }
  loop() {
    if (!this.running) return;
    const now = performance.now();
    let dt = (now - this.last) / 1000; this.last = now;
    dt = Math.min(dt, 0.05);
    this.update(dt, now / 1000);

    requestAnimationFrame(() => this.loop());
  }
  update(dt, T) {

          vy: -rnd(28, 70), vx: rnd(-8, 8), r: rnd(0.6, 1.7) * this.S,
          p: rnd(0, 6.3), sp: rnd(1.6, 3.4), life: rnd(1.1, 2.2), age: 0, warm: rnd(0.9, 1.1)

      e.p += dt * e.sp;

      e.x += (e.vx + Math.sin(e.p) * 13) * dt;
      e.y += e.vy * dt;
      return e.age < e.life && e.y > -40;
    });
    this.smoke = this.smoke.filter(s => {
      s.age += dt; if (s.age < 0) return true;
      s.p += dt * 0.9;
      s.x += (s.vx + Math.sin(s.p) * 9) * dt; s.y += s.vy * dt; s.vy *= 1 - dt * 0.25; s.r += dt * 9 * this.S;
      return s.age < s.life;
    });
    this.motes.forEach(m => {
      m.p += dt * 1.2; m.y += m.vy * dt; m.x += (m.vx + Math.sin(m.p) * 5) * dt;
      if (m.y < -8) { m.y = this.h + 8; m.x = rnd(0, this.w); }
    });
  }
  draw(T) {
    const { c, w, h, S, cx } = this;
    c.clearRect(0, 0, w, h);
    const glowAmt = this.lit * (0.55 + this.hold * 0.75);

    /* the page art shows through; we only add light, shade and the candle */
    // vignette deepens as the wish charges, pulling the eye to the flame
    const vg = c.createRadialGradient(cx, this.wickY(), 10, cx, this.wickY(), Math.max(w, h) * 0.78);
    vg.addColorStop(0, "rgba(4,10,24,0)");
    vg.addColorStop(0.45, `rgba(4,10,24,${(0.10 + this.hold * 0.34).toFixed(3)})`);
    vg.addColorStop(1, `rgba(3,7,18,${(0.30 + this.hold * 0.46).toFixed(3)})`);
    c.fillStyle = vg; c.fillRect(0, 0, w, h);

    // dust motes catching the candlelight
    c.save(); c.globalCompositeOperation = "lighter";
    this.motes.forEach(m => {
      const d = Math.hypot(m.x - cx, m.y - this.wickY());
      const near = Math.max(0, 1 - d / (w * 0.7));
      c.globalAlpha = (0.10 + near * 0.5) * (0.4 + glowAmt * 0.6);
      c.fillStyle = "#FFE3AE";
      c.beginPath(); c.arc(m.x, m.y, m.r * (0.8 + Math.sin(m.p) * 0.25), 0, 6.3); c.fill();
    });
    c.restore();

    // warm pool of light on the surroundings
    c.save(); c.globalCompositeOperation = "lighter";
    const pool = c.createRadialGradient(cx, this.wickY() + 8 * S, 4, cx, this.wickY() + 8 * S, (150 + this.hold * 130) * S);
    pool.addColorStop(0, `rgba(255,206,130,${(0.34 * glowAmt).toFixed(3)})`);
    pool.addColorStop(0.45, `rgba(255,166,88,${(0.16 * glowAmt).toFixed(3)})`);
    pool.addColorStop(1, "rgba(255,150,70,0)");
    c.fillStyle = pool; c.fillRect(0, 0, w, h);
    c.restore();

    this.drawCandle(T, glowAmt);

    // smoke after the flame dies
    c.save();
    this.smoke.forEach(s => {
      if (s.age < 0) return;
      const k = s.age / s.life;
      c.globalAlpha = Math.max(0, 0.20 * (1 - k));
      const g = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * (1 + k * 1.7));
      g.addColorStop(0, "rgba(226,226,232,.9)"); g.addColorStop(1, "rgba(210,210,220,0)");

      const r = e.r * (1 + Math.sin(e.p) * 0.18);

      g.addColorStop(0, `rgba(255,236,190,${(0.95 * fade).toFixed(3)})`);
      g.addColorStop(0.35, `rgba(255,176,96,${(0.55 * fade * e.warm).toFixed(3)})`);

      c.globalAlpha = fade; c.fillStyle = "#FFF2D0";

  drawCandle(T, glowAmt) {

    const bodyW = 34 * S, bodyTop = this.baseY - 120 * S, bodyH = this.baseY - bodyTop;

    // soft shadow under the candle so it sits on something
    c.save();
    const sh = c.createRadialGradient(cx, this.baseY + 6 * S, 2, cx, this.baseY + 6 * S, bodyW * 2.1);
    sh.addColorStop(0, "rgba(20,30,50,.34)"); sh.addColorStop(1, "rgba(20,30,50,0)");
    c.fillStyle = sh; c.beginPath(); c.ellipse(cx, this.baseY + 6 * S, bodyW * 2.1, 10 * S, 0, 0, 6.3); c.fill();

    wax.addColorStop(0, "#E8D6C2"); wax.addColorStop(0.28, "#FFF7EC");

    c.quadraticCurveTo(cx, bodyTop - 3 * S, cx + bodyW / 2, bodyTop + 6 * S);
    c.lineTo(cx + bodyW / 2, this.baseY - 4 * S);
    c.quadraticCurveTo(cx, this.baseY + 5 * S, cx - bodyW / 2, this.baseY - 4 * S);
    c.closePath(); c.fill();
    // a couple of wax drips
    c.fillStyle = "rgba(255,255,255,.55)";
    c.beginPath(); c.ellipse(cx - bodyW * 0.30, bodyTop + bodyH * 0.34, 3.2 * S, 9 * S, 0.1, 0, 6.3); c.fill();
    c.beginPath(); c.ellipse(cx + bodyW * 0.26, bodyTop + bodyH * 0.52, 2.6 * S, 7 * S, -0.1, 0, 6.3); c.fill();
    // warm rim where the flame lights the wax
    c.save(); c.globalCompositeOperation = "lighter"; c.globalAlpha = 0.5 * glowAmt;
    const rim = c.createLinearGradient(0, bodyTop, 0, bodyTop + bodyH * 0.7);
    rim.addColorStop(0, "rgba(255,190,110,.9)"); rim.addColorStop(1, "rgba(255,170,90,0)");
    c.fillStyle = rim;

    c.restore();

    const wy = this.wickY();
    c.strokeStyle = this.lit > 0.05 ? "#4A3220" : "#2C2118";
    c.lineWidth = 2.1 * S; c.lineCap = "round";
    c.beginPath(); c.moveTo(cx, bodyTop + 4 * S); c.quadraticCurveTo(cx + 1.5 * S, wy + 5 * S, cx, wy); c.stroke();

    /* flame: irregular flicker, leans with the "breath", grows while charging */
    const lean = Math.sin(T * 1.7) * 2.4 + Math.sin(T * 4.3) * 1.1 + this.gust * 16;
    const jitter = Math.sin(this.flick * 2.1) * 0.35 + Math.sin(this.flick * 5.7) * 0.2;
    const grow = (1 + this.hold * 0.5) * this.lit * (1 + jitter * 0.1);
    const fh = 42 * S * grow, fw = 13 * S * grow;
    const tipX = cx + lean * S * (1 + this.hold * 0.5), tipY = wy - fh;

    c.save(); c.globalCompositeOperation = "lighter";
    // outer halo
    const halo = c.createRadialGradient(cx, wy - fh * 0.35, 1, cx, wy - fh * 0.35, fh * 2.4);
    halo.addColorStop(0, `rgba(255,214,150,${(0.55 * this.lit).toFixed(3)})`);
    halo.addColorStop(0.4, `rgba(255,170,86,${(0.22 * this.lit).toFixed(3)})`);
    halo.addColorStop(1, "rgba(255,150,70,0)");
    c.fillStyle = halo; c.beginPath(); c.arc(cx, wy - fh * 0.35, fh * 2.4, 0, 6.3); c.fill();

    // body of the flame
    const grad = c.createLinearGradient(cx, wy + 4 * S, tipX, tipY);
    grad.addColorStop(0, "rgba(255,146,40,.95)");
    grad.addColorStop(0.35, "rgba(255,196,96,.98)");
    grad.addColorStop(0.75, "rgba(255,238,190,.98)");
    grad.addColorStop(1, "rgba(255,252,235,.5)");
    c.fillStyle = grad;
    c.beginPath();
    c.moveTo(cx - fw, wy + 2 * S);
    c.bezierCurveTo(cx - fw * 1.15, wy - fh * 0.45, tipX - fw * 0.34, wy - fh * 0.72, tipX, tipY);
    c.bezierCurveTo(tipX + fw * 0.34, wy - fh * 0.72, cx + fw * 1.15, wy - fh * 0.45, cx + fw, wy + 2 * S);
    c.quadraticCurveTo(cx, wy + 7 * S, cx - fw, wy + 2 * S);
    c.closePath(); c.fill();

    // blue-hot base + bright core
    c.globalAlpha = 0.75 * this.lit;
    c.fillStyle = "rgba(128,186,255,.55)";
    c.beginPath(); c.ellipse(cx, wy - fh * 0.06, fw * 0.55, fh * 0.16, 0, 0, 6.3); c.fill();
    c.globalAlpha = 1;
    const core = c.createLinearGradient(cx, wy, tipX, tipY * 1.0);
    core.addColorStop(0, "rgba(255,240,205,.9)"); core.addColorStop(1, "rgba(255,255,245,.15)");
    c.fillStyle = core;
    c.beginPath();
    c.moveTo(cx - fw * 0.4, wy);
    c.bezierCurveTo(cx - fw * 0.5, wy - fh * 0.4, tipX - fw * 0.12, wy - fh * 0.6, tipX * 0.5 + cx * 0.5, tipY + fh * 0.22);
    c.bezierCurveTo(cx + fw * 0.5, wy - fh * 0.6, cx + fw * 0.5, wy - fh * 0.4, cx + fw * 0.4, wy);
    c.closePath(); c.fill();
    c.restore();
  }
}
</script>
<script>/* ===================== CELEBRATION SCENE ===================== */
/* ===================== CELEBRATION — cinematic night scene =====================
   A scripted ~13s story: the couple prepare a paper sky lantern, light it,
   raise it together, let it go, and watch it climb while the sky answers.
   The timeline owns "when the scene is finished" — nothing else does.        */

const clamp01 = t => (t < 0 ? 0 : t > 1 ? 1 : t);
const seg = (T, a, b) => clamp01((T - a) / (b - a));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeIn = t => t * t * t;
const mix = (a, b, t) => a + (b - a) * t;

/* 1-D value noise — used anywhere something should wobble irregularly
   (wind, flame, fabric) instead of riding a clean sine wave. */
function noise1(x, seed = 0) {
  const i = Math.floor(x), f = x - i;
  const h = n => {
    let s = Math.sin((n + seed * 57.3) * 12.9898) * 43758.5453;
    return s - Math.floor(s);
  };
  const u = f * f * (3 - 2 * f);
  return mix(h(i), h(i + 1), u) * 2 - 1;
}

/* ---------------------------------------------------------------- lantern -- */
class SkyLantern {
  constructor(o) {
    Object.assign(this, {
      x: 0, y: 0, z: 1,                 // z = depth 0.15 (far) .. 1 (foreground)
      vx: 0, vy: 0, rot: 0, vrot: 0,
      lift: -26, drag: 0.55,
      seed: Math.random() * 100,
      flame: 1, warm: 1, age: 0, born: 0,
      windPhase: Math.random() * 40
    }, o);
    this.baseLift = this.lift;
  }
  step(dt, T, windBase) {
    this.age += dt;
    // buoyancy ramps in: hot air has to build before it really pulls
    const buoy = this.baseLift * (0.35 + 0.65 * clamp01(this.age / 2.6));
    this.vy += (buoy - this.vy) * Math.min(1, dt * 0.9);
    // layered wind: slow drift + gusts, different per lantern
    const wind = windBase * (0.5 + this.z) +
      noise1(T * 0.35 + this.windPhase, this.seed) * 16 * this.z +
      Math.sin(T * 0.21 + this.seed) * 6;
    this.vx += (wind - this.vx) * Math.min(1, dt * 0.6);
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    // the body swings behind the drift like a pendulum, then settles
    const target = Math.max(-0.26, Math.min(0.26, this.vx * 0.0055));
    this.vrot += (target - this.rot) * 5.5 * dt;
    this.vrot *= 1 - 2.4 * dt;
    this.rot += this.vrot * dt;
    this.flame = 0.86 + 0.14 * noise1(T * 7 + this.seed * 3, this.seed);
    return this.y > -140;
  }
  /* recedes: smaller and dimmer the higher and further it gets */
  scaleAt(h) {
    const climb = clamp01((h - this.y) / (h * 1.5));
    return this.z * (1 - 0.55 * climb);
  }
}

function paintLantern(c, x, y, s, rot, flame, alphaMul = 1, detail = true) {
  if (s < 0.012) return;
  const W = 150 * s, H = 200 * s;
  c.save();
  c.translate(x, y);
  c.rotate(rot);
  c.globalAlpha = alphaMul;

  /* ---- warm bloom in the air around it (additive) ---- */
  c.save();
  c.globalCompositeOperation = "lighter";
  const bloom = c.createRadialGradient(0, H * 0.1, W * 0.06, 0, H * 0.1, W * 2.6);
  bloom.addColorStop(0, `rgba(255,186,104,${0.42 * flame * alphaMul})`);
  bloom.addColorStop(0.32, `rgba(255,146,62,${0.15 * flame * alphaMul})`);
  bloom.addColorStop(1, "rgba(255,120,40,0)");
  c.fillStyle = bloom;
  c.beginPath(); c.arc(0, H * 0.1, W * 2.6, 0, 6.3); c.fill();
  c.restore();

  /* ---- paper body: domed crown, full belly, open mouth at the bottom ---- */
  const body = new Path2D();
  body.moveTo(0, -H * 0.5);
  body.bezierCurveTo(W * 0.34, -H * 0.5, W * 0.5, -H * 0.2, W * 0.5, H * 0.06);
  body.bezierCurveTo(W * 0.5, H * 0.27, W * 0.42, H * 0.4, W * 0.31, H * 0.47);
  body.lineTo(-W * 0.31, H * 0.47);
  body.bezierCurveTo(-W * 0.42, H * 0.4, -W * 0.5, H * 0.27, -W * 0.5, H * 0.06);
  body.bezierCurveTo(-W * 0.5, -H * 0.2, -W * 0.34, -H * 0.5, 0, -H * 0.5);
  body.closePath();

  // lit rice paper: brightest where the flame sits, cooling toward the crown
  const paper = c.createRadialGradient(-W * 0.1, H * 0.3, W * 0.03, 0, H * 0.06, W * 0.95);
  paper.addColorStop(0, `rgba(255,246,214,${0.98 * flame})`);
  paper.addColorStop(0.24, `rgba(255,206,124,${0.96 * flame})`);
  paper.addColorStop(0.58, `rgba(255,156,70,${0.93 * flame})`);
  paper.addColorStop(1, `rgba(214,96,44,${0.86 * flame})`);
  c.fillStyle = paper;
  c.fill(body);

  if (detail && s > 0.05) {
    c.save();
    c.clip(body);
    // vertical gores: the paper is made of panels, so the cylinder curves in shading
    for (let i = -3; i <= 3; i++) {
      const gx = (i / 3.4) * W * 0.5;
      c.strokeStyle = `rgba(150,64,20,${0.13 + 0.05 * Math.abs(i)})`;
      c.lineWidth = Math.max(0.5, 0.9 * s * 8);
      c.beginPath();
      c.moveTo(gx * 0.55, -H * 0.5);
      c.quadraticCurveTo(gx, -H * 0.05, gx * 0.72, H * 0.47);
      c.stroke();
    }
    // soft crease wrinkles so the paper isn't a smooth capsule
    c.strokeStyle = "rgba(255,236,196,.18)";
    c.lineWidth = Math.max(0.4, 0.6 * s * 8);
    for (let i = 0; i < 5; i++) {
      const yy = -H * 0.42 + i * H * 0.2;
      c.beginPath();
      c.moveTo(-W * 0.5, yy);
      c.quadraticCurveTo(0, yy + H * 0.035 * (i % 2 ? 1 : -1), W * 0.5, yy + H * 0.012);
      c.stroke();
    }
    // shadowed right shoulder — the volume reads as round
    const shade = c.createLinearGradient(-W * 0.5, 0, W * 0.5, 0);
    shade.addColorStop(0, "rgba(90,34,8,.20)");
    shade.addColorStop(0.32, "rgba(90,34,8,0)");
    shade.addColorStop(0.72, "rgba(90,34,8,0)");
    shade.addColorStop(1, "rgba(70,26,6,.34)");
    c.fillStyle = shade;
    c.fillRect(-W * 0.5, -H * 0.5, W, H);
    c.restore();
  }

  /* ---- the mouth: you can see up into the hot interior ---- */
  c.save();
  const mouth = c.createLinearGradient(0, H * 0.4, 0, H * 0.52);
  mouth.addColorStop(0, `rgba(255,226,160,${0.9 * flame})`);
  mouth.addColorStop(1, "rgba(120,42,10,.85)");
  c.fillStyle = mouth;
  c.beginPath(); c.ellipse(0, H * 0.47, W * 0.31, H * 0.045, 0, 0, 6.3); c.fill();
  c.restore();

  /* ---- bamboo hoop + cross wires + burning fuel cell ---- */
  if (s > 0.04) {
    c.strokeStyle = `rgba(196,140,72,${0.8 * alphaMul})`;
    c.lineWidth = Math.max(0.6, 1.5 * s * 8);
    c.beginPath(); c.ellipse(0, H * 0.47, W * 0.31, H * 0.045, 0, 0, 6.3); c.stroke();
    c.strokeStyle = `rgba(120,70,30,${0.7 * alphaMul})`;
    c.lineWidth = Math.max(0.4, 0.9 * s * 8);
    c.beginPath();
    c.moveTo(-W * 0.3, H * 0.47); c.quadraticCurveTo(0, H * 0.56, W * 0.3, H * 0.47);
    c.stroke();
  }
  // the flame itself, low in the throat
  c.save();
  c.globalCompositeOperation = "lighter";
  const fh = H * 0.11 * flame;
  const fg = c.createRadialGradient(0, H * 0.46, 0, 0, H * 0.46, fh * 2.4);
  fg.addColorStop(0, `rgba(255,250,226,${0.95 * flame})`);
  fg.addColorStop(0.4, `rgba(255,186,90,${0.6 * flame})`);
  fg.addColorStop(1, "rgba(255,120,30,0)");
  c.fillStyle = fg;
  c.beginPath(); c.ellipse(0, H * 0.45, fh * 1.1, fh * 1.9, 0, 0, 6.3); c.fill();
  c.restore();

  c.restore();
}

/* ------------------------------------------------------------- fireworks -- */
class Fireworks {
  constructor(scene) { this.s = scene; this.rockets = []; this.parts = []; this.flash = 0; this.flashX = 0; this.flashY = 0; }
  clear() { this.rockets.length = 0; this.parts.length = 0; this.flash = 0; }
  launch(opt = {}) {
    const s = this.s;
    const depth = opt.depth != null ? opt.depth : rnd(0.55, 1);
    const x = opt.x != null ? opt.x : rnd(s.w * 0.14, s.w * 0.86);
    const apex = opt.apex != null ? opt.apex : rnd(s.h * 0.12, s.h * 0.40);
    this.rockets.push({
      x, y: s.h * 1.03, vx: rnd(-22, 22) * depth, vy: -rnd(340, 440) * depth,
      apex, depth, sparkT: 0,
      col: opt.col || pick(s.palette),
      type: opt.type || pick(["peony", "peony", "chrys", "willow", "ring", "palm", "crackle"]),
      twin: opt.twin || false
    });
    AE.launch(AE.now(), 1 / Math.max(0.5, depth));
  }
  burst(x, y, type, col, depth) {
    const s = this.s;
    const budget = Math.max(0, s.maxParts - this.parts.length);
    let n = type === "willow" ? 66 : type === "ring" ? 58 : type === "palm" ? 46 : type === "chrys" ? 86 : 74;
    n = Math.min(n, budget);
    const base = rnd(160, 250) * depth;
    for (let i = 0; i < n; i++) {
      let a, sp;
      if (type === "ring") { a = (i / n) * 6.2832 + rnd(-0.03, 0.03); sp = base * rnd(0.95, 1.04); }
      else if (type === "palm") { a = -Math.PI / 2 + rnd(-1.15, 1.15); sp = base * rnd(0.55, 1.15); }
      else { a = Math.random() * 6.2832; sp = base * Math.pow(Math.random(), type === "chrys" ? 0.34 : 0.5); }
      this.parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: type === "willow" ? rnd(2.4, 3.8) : type === "chrys" ? rnd(1.6, 2.6) : rnd(1.0, 2.0),
        age: 0,
        col: Math.random() > 0.88 ? "#FFF6E2" : col,
        r: rnd(1.0, 2.3) * depth,
        drag: type === "willow" ? 1.15 : 1.9,
        g: type === "willow" ? 58 : 40,
        twinkle: type === "crackle" ? Math.random() > 0.4 : Math.random() > 0.9
      });
    }
    this.flash = Math.max(this.flash, 0.45 + depth * 0.55);
    this.flashX = x; this.flashY = y;
    const dist = 1 / Math.max(0.45, depth);
    const t = AE.now() + 0.07 + (1 - depth) * 0.42;      // light arrives before sound
    AE.boom(t, 0.8 + depth * 0.6, dist);
    if (type === "crackle") AE.crackle(t + 0.11, 26, dist, 1.5);
    if (Math.random() > 0.6) AE.sparkle(t + 0.28, pick([1568, 1760, 2093]), 0.045);
  }
  step(dt) {
    const s = this.s;
    this.flash = Math.max(0, this.flash - dt * 2.4);
    this.rockets = this.rockets.filter(r => {
      r.vy += 128 * dt;
      r.x += r.vx * dt; r.y += r.vy * dt;
      r.sparkT -= dt;
      if (r.sparkT <= 0 && this.parts.length < s.maxParts) {
        r.sparkT = 0.018;
        this.parts.push({
          x: r.x + rnd(-1.4, 1.4), y: r.y, vx: rnd(-10, 10), vy: rnd(16, 58),
          life: rnd(0.22, 0.5), age: 0, col: "#FFD79A", r: rnd(0.7, 1.6) * r.depth,
          drag: 2.6, g: 30, twinkle: false
        });
      }
      if (r.y <= r.apex || r.vy > -50) {
        this.burst(r.x, r.y, r.type, r.col, r.depth);
        if (r.twin) {
          const rr2 = r;
          setTimeout(() => {
            if (s.running) this.burst(rr2.x + rnd(-50, 50), rr2.y + rnd(-40, 20), "crackle", pick(s.palette), rr2.depth * 0.8);
          }, rnd(220, 400));
        }
        return false;
      }
      return true;
    });
    this.parts = this.parts.filter(p => {
      p.age += dt;
      const k = 1 - p.drag * dt;
      p.vx *= k; p.vy *= k;
      p.vy += p.g * dt * 2.6;
      p.x += p.vx * dt; p.y += p.vy * dt;
      return p.age < p.life && p.y < s.h + 60;
    });
  }
  draw(gc) {
    gc.save();
    gc.globalCompositeOperation = "lighter";
    for (const p of this.parts) {
      const k = 1 - p.age / p.life;
      let a = Math.min(1, k * 1.6);
      if (p.twinkle) a *= 0.35 + 0.65 * Math.abs(Math.sin(p.age * 38));
      gc.globalAlpha = a;
      gc.fillStyle = p.col;
      gc.shadowColor = p.col;
      gc.shadowBlur = 10 * k + 2;
      gc.beginPath(); gc.arc(p.x, p.y, p.r * (0.55 + k * 0.6), 0, 6.3); gc.fill();
    }
    gc.shadowBlur = 14;
    for (const r of this.rockets) {
      gc.globalAlpha = 1; gc.fillStyle = "#FFE9B8"; gc.shadowColor = "#FFB55C";
      gc.beginPath(); gc.arc(r.x, r.y, 2 * r.depth + 0.6, 0, 6.3); gc.fill();
    }
    gc.restore();
  }
}

/* ----------------------------------------------------------------- scene -- */
class CelebrationScene {
  constructor(cv, glow) {
    this.cv = cv; this.gv = glow;
    this.running = false;
    this.reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.palette = ["#FFD36E", "#FF7BA9", "#7FE3FF", "#B08CFF", "#9CFFB0", "#FFAE63", "#FFF3D6", "#FF6B6B"];
    this.maxParts = this.reduced ? 260 : 1000;
    this.onBeat = () => { };        // director listens for story beats
    this.onComplete = () => { };    // fires exactly once
    this._completed = false;
    this.lanterns = []; this.balloons = []; this.motes = []; this.embers = [];
    this.fw = new Fireworks(this);
    this._onResize = () => this.resize();
    this.resize();
    addEventListener("resize", this._onResize);
    this.reset();
  }

  /* the whole story, in one place */
  get SCRIPT() {
    const k = this.reduced ? 0.58 : 1;
    return {
      titleIn: 1.5 * k,
      prepare: [1.5 * k, 3.5 * k],
      ignite: 3.5 * k,
      inflate: [3.7 * k, 5.8 * k],
      raise: [5.5 * k, 7.0 * k],
      release: [7.0 * k, 8.5 * k],
      firstShell: 8.2 * k,
      climax: [9.0 * k, 14.0 * k],
      calm: 14.5 * k,
      hold: 16.0 * k,
      end: 17.5 * k
    };
  }

  resize() {
    const a = fitCanvas(this.cv); this.c = a.c; this.w = a.w; this.h = a.h; this.dpr = a.dpr;
    const b = fitCanvas(this.gv); this.gc = b.c;
    this.seedStatic();
  }

  /* A scratch canvas used to build TRUE rim light.
     Stroking the figure path would outline every limb sub-path and read as a
     wireframe. Instead we fill an offset copy of the silhouette and subtract the
     silhouette itself: what survives is a crescent along the real outer edge only,
     because every internal limb edge sits inside the union and gets erased. */
  rimCtx(H) {
    const dpr = this.dpr || 1;
    const w = Math.ceil(H * 1.6 * dpr), h = Math.ceil(H * 1.7 * dpr);
    if (!this._rb || this._rb.width < w || this._rb.height < h) {
      this._rb = document.createElement("canvas");
      this._rb.width = w; this._rb.height = h;
      this._rbc = this._rb.getContext("2d");
    }
    return this._rbc;
  }
  buildRim(body, H, ux, uy, off, color) {
    const rc = this.rimCtx(H);
    if (!rc) return null;
    const dpr = this.dpr || 1;
    const ox = H * 0.8, oy = H * 1.45;          // local origin placed inside the buffer
    rc.setTransform(1, 0, 0, 1, 0, 0);
    rc.clearRect(0, 0, this._rb.width, this._rb.height);
    rc.setTransform(dpr, 0, 0, dpr, ox * dpr, oy * dpr);
    // 1. OPAQUE copy of the silhouette, nudged toward the light
    rc.globalCompositeOperation = "source-over";
    rc.fillStyle = "#ffffff";
    rc.save();
    rc.translate(ux * off, uy * off);
    rc.fill(body);
    rc.restore();
    // 2. subtract the silhouette itself. The mask must be opaque or the erase
    //    leaves residue across the whole body and the figure washes out.
    rc.globalCompositeOperation = "destination-out";
    rc.fill(body);
    // 3. tint whatever crescent survived
    rc.globalCompositeOperation = "source-in";
    rc.fillStyle = color;
    rc.fillRect(-H, -H * 1.45, H * 2, H * 1.9);
    rc.globalCompositeOperation = "source-over";
    return { canvas: this._rb, ox, oy, dpr };
  }
  seedStatic() {
    const { w, h } = this;
    const starN = this.reduced ? 90 : 210;
    this.stars = Array.from({ length: starN }, () => ({
      x: rnd(0, w), y: rnd(0, h * 0.78), r: rnd(0.35, 1.5), p: rnd(0, 6.3), s: rnd(0.5, 2.1), z: rnd(0.2, 1)
    }));
    this.skyline = Array.from({ length: 30 }, (_, i) => ({
      x: (i / 30) * w * 1.08 - w * 0.04, w: w * rnd(0.045, 0.1), h: rnd(h * 0.025, h * 0.1),
      lights: Array.from({ length: 6 }, () => ({ dx: Math.random(), dy: Math.random(), on: Math.random() > 0.42 }))
    }));
  }

  reset() {
    this.T = 0; this.last = 0;
    this._completed = false;
    this._beats = {};
    this.fw.clear();
    this.lanterns.length = 0;
    this.balloons.length = 0;
    this.embers.length = 0;
    this.mainLantern = null;
    this.flameUp = 0;        // 0 unlit .. 1 burning hard
    this.inflate = 0;
    this.nextShell = 0;
    this.camY = 0; this.camScale = 1; this.camX = 0;
    const { w, h } = this;
    // distant lanterns already in the sky — this is a festival, not an empty field
    const far = this.reduced ? 5 : 11;
    for (let i = 0; i < far; i++) {
      this.lanterns.push(new SkyLantern({
        x: rnd(w * 0.04, w * 0.96), y: rnd(-h * 0.1, h * 0.8),
        z: rnd(0.16, 0.42), lift: -rnd(11, 20), born: -rnd(4, 20)
      }));
      this.lanterns[i].age = rnd(3, 20);
    }
    const bal = this.reduced ? 3 : 6;
    this.balloons = Array.from({ length: bal }, () => this.newBalloon(rnd(h * 0.3, h * 1.4)));
    const moteN = this.reduced ? 18 : 46;
    this.motes = Array.from({ length: moteN }, () => ({
      x: rnd(0, w), y: rnd(0, h), r: rnd(0.5, 1.7), vy: rnd(-13, -4), vx: rnd(-5, 5),
      p: rnd(0, 6.3), z: rnd(0.3, 1), hue: pick([38, 44, 28, 204])
    }));
  }
  newBalloon(y) {
    const z = rnd(0.4, 0.95);
    return {
      x: rnd(this.w * 0.06, this.w * 0.94), y: y == null ? this.h + rnd(60, 340) : y, z,
      vy: -rnd(14, 30) * z, sw: rnd(0, 6.3), amp: rnd(7, 20), spin: rnd(-0.1, 0.1),
      seed: rnd(0, 40),
      col: pick(["#FF6E8A", "#FFD166", "#6EC7FF", "#B98CFF", "#7BE8A7", "#FF9E6E"])
    };
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.reset();
    this.last = performance.now();
    AE.startAmbience(0.026);
    this.loop();
  }
  stop() {
    this.running = false;
    AE.stopAmbience();
  }
  destroy() { this.stop(); removeEventListener("resize", this._onResize); }

  beat(name, t) {                       // guarantees each story beat fires once
    if (this._beats[name] || this.T < t) return false;
    this._beats[name] = true;
    return true;
  }

  loop() {
    if (!this.running) return;
    const now = performance.now();
    let dt = (now - this.last) / 1000; this.last = now;
    dt = Math.min(dt, 0.05);
    this.T += dt;
    this.update(dt);
    this.draw();
    this._raf = requestAnimationFrame(() => this.loop());
  }

  /* geometry the couple and the lantern agree on */
  groundY() { return this.h * 0.945; }
  figH() { return Math.min(this.h * 0.345, this.w * 0.78); }
  /* where their hands hold the lantern, world space */
  gripPoint() {
    const S = this.SCRIPT, FH = this.figH(), g = this.groundY();
    const prep = easeInOut(seg(this.T, S.prepare[0], S.prepare[1]));
    const rise = easeInOut(seg(this.T, S.raise[0], S.raise[1]));
    const y = g - FH * (0.60 + 0.06 * prep + 0.42 * rise);
    return { x: this.w * 0.5, y };
  }

  update(dt) {
    const S = this.SCRIPT, { w, h } = this;
    const T = this.T;

    /* ---------- story beats ---------- */
    if (this.beat("title", S.titleIn)) this.onBeat("title");
    if (this.beat("ignite", S.ignite)) { AE.puff(AE.now(), 0.35); AE.sparkle(AE.now() + 0.05, 1318, 0.05); }
    this.flameUp = easeOut(seg(T, S.ignite, S.ignite + 1.1));
    this.inflate = easeInOut(seg(T, S.inflate[0], S.inflate[1]));

    /* ---------- release: the held lantern becomes a free one ---------- */
    if (this.beat("release", S.release[0] + 0.35)) {
      const g = this.gripPoint();
      this.mainLantern = new SkyLantern({
        x: g.x, y: g.y, z: 1, vy: -6, lift: -34, born: T
      });
      this.lanterns.push(this.mainLantern);
      AE.puff(AE.now(), 0.55);
      this.onBeat("release");
    }
    const releasing = seg(T, S.release[0], S.release[1]);

    /* ---------- fireworks cadence, shaped by the script ---------- */
    if (this.beat("firstShell", S.firstShell)) {
      this.fw.launch({ depth: 0.5, apex: h * 0.3, x: w * 0.72 });
      this.nextShell = T + 1.5;
    }
    if (T > S.firstShell && T < S.calm) {
      if (T >= this.nextShell) {
        const inClimax = T >= S.climax[0] && T <= S.climax[1];
        this.fw.launch({
          depth: inClimax ? rnd(0.7, 1) : rnd(0.45, 0.7),
          twin: inClimax && Math.random() > 0.65
        });
        if (inClimax && Math.random() > 0.55) {
          setTimeout(() => this.running && this.fw.launch({ depth: rnd(0.5, 0.9) }), rnd(160, 420));
        }
        this.nextShell = T + (inClimax ? rnd(0.75, 1.35) : rnd(1.5, 2.2));
      }
    }
    if (this.beat("cheer", S.climax[0])) AE.cheer(AE.now(), 4.5, 0.6);
    this.fw.step(dt);

    /* ---------- camera: push in, then follow the lantern up ---------- */
    const push = easeInOut(seg(T, 0, 4.5));
    const follow = this.mainLantern ? easeOut(seg(T, S.release[1], S.release[1] + 4.2)) : 0;
    this.camScale = mix(1.075, 1.0, push) + follow * 0.03;
    this.camY = follow * h * 0.055 + Math.sin(T * 0.22) * h * 0.004;
    this.camX = Math.sin(T * 0.14) * w * 0.006;

    /* ---------- ambient bodies ---------- */
    const windBase = 10 + noise1(T * 0.16, 7) * 9;
    this.lanterns = this.lanterns.filter(l => l.step(dt, T, windBase));
    if (!this.reduced && this.lanterns.length < 13 && Math.random() < dt * 0.32 && T < S.calm) {
      this.lanterns.push(new SkyLantern({
        x: rnd(w * 0.05, w * 0.95), y: h + rnd(20, 120),
        z: rnd(0.18, 0.4), lift: -rnd(12, 20), born: T
      }));
    }
    for (const b of this.balloons) {
      b.y += b.vy * dt;
      b.sw += dt * (0.5 + b.z * 0.4);
      b.x += (Math.sin(b.sw) * b.amp + noise1(T * 0.3 + b.seed, 3) * 7) * dt;
      if (b.y < -150) Object.assign(b, this.newBalloon());
    }
    for (const m of this.motes) {
      m.y += m.vy * dt; m.x += (m.vx + Math.sin(m.p) * 7) * dt; m.p += dt * 1.2;
      if (m.y < -12) { m.y = h + 12; m.x = rnd(0, w); }
    }
    // a few embers lift off the lantern while it burns near the ground
    if (this.flameUp > 0.4 && T < S.release[1] + 2 && this.embers.length < 26 && Math.random() < dt * 12) {
      const g = this.gripPoint();
      this.embers.push({ x: g.x + rnd(-10, 10), y: g.y + rnd(0, 14), vx: rnd(-8, 8), vy: -rnd(20, 52), r: rnd(0.7, 1.8), age: 0, life: rnd(1, 2.2) });
    }
    this.embers = this.embers.filter(e => {
      e.age += dt; e.vy -= 14 * dt; e.x += e.vx * dt; e.y += e.vy * dt;
      return e.age < e.life;
    });

    /* ---------- completion — the timeline decides, nothing else ---------- */
    if (!this._completed && T >= S.end) {
      this._completed = true;
      this.onComplete(this.lastLightPoint());
    }
  }

  /* the warm light that carries over into the cake scene */
  lastLightPoint() {
    const l = this.mainLantern;
    if (!l) return { x: this.w * 0.5, y: this.h * 0.3, s: 0.3 };
    return { x: l.x + this.camX, y: l.y - this.camY, s: Math.max(0.08, l.scaleAt(this.h)) };
  }

  /* ============================== rendering ============================== */
  draw() {
    const { c, gc, w, h } = this;
    const T = this.T;
    c.save();
    c.setTransform(c.getTransform());

    /* ---- deep night sky ---- */
    const sky = c.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#04060F");
    sky.addColorStop(0.34, "#0A1230");
    sky.addColorStop(0.67, "#132A52");
    sky.addColorStop(1, "#1E4468");
    c.fillStyle = sky; c.fillRect(0, 0, w, h);

    // moon + halo (background layer, moves least)
    const px = -this.camX * 0.3, py = this.camY * 0.25;
    const mx = w * 0.79 + px, my = h * 0.135 + py;
    const mg = c.createRadialGradient(mx, my, 2, mx, my, w * 0.44);
    mg.addColorStop(0, "rgba(255,247,222,.28)"); mg.addColorStop(1, "rgba(255,247,222,0)");
    c.fillStyle = mg; c.fillRect(0, 0, w, h);
    c.save(); c.globalAlpha = 0.94; c.fillStyle = "#FFF8E4";
    c.beginPath(); c.arc(mx, my, Math.max(10, w * 0.032), 0, 6.3); c.fill(); c.restore();

    // stars — parallax by depth
    for (const s of this.stars) {
      const a = 0.28 + 0.66 * Math.abs(Math.sin(T * s.s + s.p));
      c.globalAlpha = a;
      c.fillStyle = "#FFFFFF";
      const sx = s.x + px * s.z * 1.4, sy = s.y + py * s.z * 1.2;
      c.beginPath(); c.arc(sx, sy, s.r, 0, 6.3); c.fill();
    }
    c.globalAlpha = 1;

    /* ---- BACKGROUND: distant lanterns behind the city ---- */
