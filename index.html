      c.fillStyle = gr; c.beginPath(); c.arc(0, 0, th * 1.5, 0, Math.PI * 2); c.fill();
      /* moonlight on the upper rim */
      c.strokeStyle = 'rgba(206,224,255,0.18)';
      c.lineWidth = Math.max(0.4, faceR * 0.05);
      c.beginPath(); c.arc(0, 0, faceR * 0.92, -2.5, -0.5); c.stroke();
    }
    c.restore();
  }

  /* ---- verbena: a dome of little florets, the outside opening first ---- */
  _fUmbel(c, pl, hd, b, sc) {
    const col = hd.col, R = hd.R * sc, f = pl.fol;
    const grow = GB.eo(GB.cl(b / 0.38, 0, 1));
    /* the green involucre the cluster rises out of */
    c.save();
    c.beginPath();
    c.ellipse(0, R * 0.10, R * (0.30 + 0.34 * grow), R * 0.26, 0, 0, Math.PI * 2);
    c.fillStyle = GB.hsl(f.h, f.s, f.l * 1.2); c.fill();
    for (const fl of hd.florets) {
      const p = GB.eio(GB.cl((b - 0.18 - fl.delay * 0.55) / 0.34, 0, 1));
      const px = fl.px * sc * (0.30 + 0.70 * grow), py = fl.py * sc * (0.30 + 0.70 * grow);
      const r = fl.r * sc;
      c.save(); c.translate(px, py);
      if (p < 0.03) {
        /* still a bud */
        c.fillStyle = GB.hsl(f.h + fl.hj * 0.5, f.s * 0.9, f.l * (1.15 + 0.3 * grow));
        c.beginPath(); c.ellipse(0, 0, r * (0.30 + 0.20 * grow), r * (0.40 + 0.24 * grow), fl.rot, 0, Math.PI * 2); c.fill();
      } else {
        c.rotate(fl.rot);
        const rr = r * (0.34 + 0.66 * p);
        for (let i = 0; i < fl.lobes; i++) {
          const a = (i / fl.lobes) * Math.PI * 2;
          c.beginPath();
          c.ellipse(Math.cos(a) * rr * 0.66, Math.sin(a) * rr * 0.66, rr * 0.46, rr * 0.30, a, 0, Math.PI * 2);
          const gr = c.createLinearGradient(Math.cos(a) * rr * 0.2, Math.sin(a) * rr * 0.2, Math.cos(a) * rr * 1.2, Math.sin(a) * rr * 1.2);
          gr.addColorStop(0, GB.hsl(col.h + fl.hj, col.s * 1.2, (col.l + fl.lj) * 0.62));
          gr.addColorStop(1, GB.hsl(col.h + fl.hj - 4, col.s * 0.85, GB.cl((col.l + fl.lj) * 1.16, 0, 92)));
          c.fillStyle = gr; c.fill();
        }
        c.fillStyle = GB.hsl(col.h + 8, 22, 92, 0.85 * p);
        c.beginPath(); c.arc(0, 0, rr * 0.26, 0, Math.PI * 2); c.fill();
        c.fillStyle = GB.hsl(col.h, col.s * 1.4, (col.l + fl.lj) * 0.32, 0.55 * p);
        c.beginPath(); c.arc(0, 0, rr * 0.12, 0, Math.PI * 2); c.fill();
      }
      c.restore();
    }
    c.restore();
  }

  /* ---- a raceme that opens from the bottom up ---- */
  _fSpike(c, pl, hd, b, sc) {
    const col = hd.col, f = pl.fol;
    const H = hd.spikeH * sc * (0.28 + 0.72 * GB.eo(GB.cl(b / 0.45, 0, 1)));
    c.save();
    /* the spike's own axis continues the stem */
    c.strokeStyle = GB.hsl(f.h + 6, f.s, f.l * 1.35);
    c.lineWidth = Math.max(0.6, pl.w1 * 0.9);
    c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(H * 0.06, -H * 0.5, 0, -H); c.stroke();
    for (const fl of hd.florets) {
      const p = GB.eio(GB.cl((b - 0.18 - fl.delay * 0.62) / 0.30, 0, 1));
      const y = -H * fl.u * 0.96;
      const r = fl.r * sc;
      c.save(); c.translate(H * 0.06 * Math.sin(fl.u * Math.PI), y);
      c.rotate(fl.side * (0.6 + fl.tilt) + (fl.side > 0 ? 0 : Math.PI));
      if (p < 0.04) {
        c.fillStyle = GB.hsl(f.h, f.s, f.l * 1.3);
        c.beginPath(); c.ellipse(r * 0.4, 0, r * 0.52, r * 0.34, 0, 0, Math.PI * 2); c.fill();
      } else {
        const L = r * (1.0 + 1.7 * p), W = r * (0.42 + 0.72 * p);
        /* a small two-lipped tube */
        c.beginPath();
        c.moveTo(0, 0);
        c.quadraticCurveTo(L * 0.5, -W * 0.72, L, -W * 0.50 * p);
        c.quadraticCurveTo(L * 1.16, 0, L, W * 0.62 * p);
        c.quadraticCurveTo(L * 0.5, W * 0.80, 0, 0);
        c.closePath();
        const gr = c.createLinearGradient(0, 0, L, 0);
        gr.addColorStop(0, GB.hsl(col.h + fl.hj, col.s * 1.2, (col.l + fl.lj) * 0.50));
        gr.addColorStop(1, GB.hsl(col.h + fl.hj - 4, col.s * 0.85, GB.cl((col.l + fl.lj) * 1.18, 0, 92)));
        c.fillStyle = gr; c.fill();
        c.fillStyle = GB.hsl(col.h, col.s * 1.4, (col.l + fl.lj) * 0.34, 0.5);
        c.beginPath(); c.ellipse(L * 0.82, 0, L * 0.12, W * 0.22, 0, 0, Math.PI * 2); c.fill();
      }
      c.restore();
    }
    c.restore();
  }

  /* ---- an airy spray of tiny blossoms ---- */
  _fSpray(c, pl, hd, b, sc) {
    const col = hd.col, f = pl.fol;
    const grow = GB.eo(GB.cl(b / 0.42, 0, 1));
    c.save();
    c.strokeStyle = GB.hsl(f.h + 6, f.s * 0.9, f.l * 1.4, 0.9);
    c.lineWidth = Math.max(0.35, hd.R * 0.10);
    c.beginPath();
    for (const fl of hd.florets) {
      c.moveTo(0, 0);
      c.quadraticCurveTo(fl.px * sc * 0.4 * grow, fl.py * sc * 0.75 * grow, fl.px * sc * grow, fl.py * sc * grow);
    }
    c.stroke();
    for (const fl of hd.florets) {
      const p = GB.eio(GB.cl((b - 0.20 - fl.delay * 0.5) / 0.32, 0, 1));
      const r = fl.r * sc * (0.28 + 0.72 * p);
      c.save(); c.translate(fl.px * sc * grow, fl.py * sc * grow); c.rotate(fl.rot);
      if (p < 0.05) {
        c.fillStyle = GB.hsl(f.h, f.s, f.l * 1.35);
        c.beginPath(); c.arc(0, 0, r * 0.7, 0, Math.PI * 2); c.fill();
      } else {
        for (let i = 0; i < fl.lobes; i++) {
          const a = (i / fl.lobes) * Math.PI * 2;
          c.beginPath();
          c.ellipse(Math.cos(a) * r * 0.58, Math.sin(a) * r * 0.58, r * 0.50, r * 0.40, a, 0, Math.PI * 2);
          c.fillStyle = GB.hsl(col.h + fl.hj, col.s * (0.9 + 0.3 * Math.cos(a)), (col.l + fl.lj) * (0.82 + 0.3 * Math.cos(a - 0.9)));
          c.fill();
        }
        c.fillStyle = GB.hsl(48, 30, 74, 0.8);
        c.beginPath(); c.arc(0, 0, r * 0.22, 0, Math.PI * 2); c.fill();
      }
      c.restore();
    }
    c.restore();
  }

  /* ─── fireflies ─── */
  _fireflies(c, w, h, T, dt) {
    this.ffFade = GB.cl(this.ffFade + (T > 8 ? dt / 4 : 0), 0, 1);
    const fadeIn = this.ffFade;
    if (fadeIn <= 0.002) return;
    for (const ff of this.fireflies) {
      ff.x += ff.vx; ff.y += ff.vy;
      if (ff.x < 0) ff.x = w; if (ff.x > w) ff.x = 0;
      if (ff.y < h * 0.58) ff.y = h * 0.98; if (ff.y > h) ff.y = h * 0.60;
      const glow = 0.18 + 0.82 * Math.abs(Math.sin(T * ff.sp + ff.ph));
      const a = glow * fadeIn * 0.62;
      const grd = c.createRadialGradient(ff.x, ff.y, 0, ff.x, ff.y, ff.r * 4.2);
      grd.addColorStop(0, `rgba(196,214,255,${a * 0.42})`);
      grd.addColorStop(0.5, `rgba(186,206,255,${a * 0.10})`);
      grd.addColorStop(1, 'rgba(186,206,255,0)');
      c.fillStyle = grd; c.beginPath(); c.arc(ff.x, ff.y, ff.r * 4.2, 0, Math.PI * 2); c.fill();
      c.globalAlpha = a * 0.90; c.fillStyle = '#DDE5F2';
      c.beginPath(); c.arc(ff.x, ff.y, ff.r * 0.62, 0, Math.PI * 2); c.fill();
      c.globalAlpha = 1;
    }
  }

  /* ─── shooting star ─── */
  _shootingStar(c, w, h, T) {
    if (!this.shootingStar && T >= this.nextSS) {
      this.shootingStar = {
        t0: T,
        x: w * (0.08 + Math.random() * 0.38),
        y: h * (0.04 + Math.random() * 0.18),
        len: w * 0.13,
        ang: Math.PI / 5.5,
        dur: 0.75
      };
      this.nextSS = T + 22 + Math.random() * 18;
    }
    if (!this.shootingStar) return;
    const ss = this.shootingStar;
    const prog = (T - ss.t0) / ss.dur;
    if (prog > 1) { this.shootingStar = null; return; }
    const fade = prog < 0.45 ? prog / 0.45 : (1 - prog) / 0.55;
    const hx = ss.x + Math.cos(ss.ang) * ss.len * prog;
    const hy = ss.y + Math.sin(ss.ang) * ss.len * prog;
    const tx = hx - Math.cos(ss.ang) * ss.len * 0.22;
    const ty = hy - Math.sin(ss.ang) * ss.len * 0.22;
    const grd = c.createLinearGradient(tx, ty, hx, hy);
    grd.addColorStop(0, 'rgba(210,232,255,0)');
    grd.addColorStop(1, `rgba(218,238,255,${fade * 0.65})`);
    c.save(); c.strokeStyle = grd; c.lineWidth = 1.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(tx, ty); c.lineTo(hx, hy); c.stroke();
    c.restore();
  }
}

/* every delayed callback in the experience goes through here, so replay can
   cancel all of them in one line. No orphan timers, ever. */
const TIMERS = new Set();
function later(fn, ms) {
  const id = setTimeout(() => { TIMERS.delete(id); fn(); }, ms);
  TIMERS.add(id);
  return id;
}
function clearAllTimers() { TIMERS.forEach(clearTimeout); TIMERS.clear(); }

  lock: false,               // navigation lock: true while any transition runs
  started: false,

  /* the single choke point. Illegal moves are dropped, not thrown. */
  set(next) {
    if (this.state === next) return true;
    const allowed = VALID[this.state] || [];
    if (!allowed.includes(next) && !(next === ST.GATE)) return false;
    this.state = next;
    return true;
  },

  /* ---------------------------------------------------------------
     Is manual navigation allowed right now? Only on the garden pages,
     and only when nothing else is mid-transition. Every other state —
     including the whole celebration — answers no.
     --------------------------------------------------------------- */
  canNavigate() { return this.state === ST.PAGE && !this.lock; },

  /* ---------- layer helpers (no translateX anywhere) ---------- */
  show(el, dur) {
    document.documentElement.style.setProperty("--tdur", (dur || 1400) + "ms");
    el.classList.remove("out", "warm");
    el.classList.add("on");
  },
  hide(el, dur) {
    if (!el || !el.classList.contains("on")) return;
    document.documentElement.style.setProperty("--tdur", (dur || 1400) + "ms");
    el.classList.remove("on");
    el.classList.add("out");
    later(() => el.classList.remove("out"), (dur || 1400) + 80);
  },

  markDots(i) {
    dots.forEach((d, k) => d.classList.toggle("on", k === i));
    dotsEl.classList.toggle("dim", i > 4);
  },

  /* ---------- garden pages ---------- */
  begin() {
    if (this.started) return;
    this.started = true;
    this.state = ST.PAGE;
    this.page = 0;
    this.show(pageEls[0], 1200);
    this.activatePage(0);
    this.markDots(0);
  },

  goToPage(i, dur = 1250) {
    if (!this.canNavigate()) return;
    i = Math.max(0, Math.min(SLIDES.length - 1, i));
    if (i === this.page) return;
    this.lock = true;
    const from = pageEls[this.page], to = pageEls[i];
    this.page = i;
    this.show(to, dur);
    this.hide(from, dur);
    this.deactivatePage(+from.dataset.index);
    this.activatePage(i);
    this.markDots(i);
    later(() => { this.lock = false; }, dur * 0.55);
  },

  next() {
    if (!this.canNavigate()) return;
    if (this.page >= SLIDES.length - 1) { this.enterCelebration(); return; }
    this.goToPage(this.page + 1);
  },
  prev() {
    if (!this.canNavigate()) return;
    if (this.page > 0) this.goToPage(this.page - 1);
  },

  activatePage(i) {
    if (i === 0 && typeof gardenScene !== 'undefined') gardenScene.start();
    petalFields[i] && petalFields[i].start();
    if (SLIDES[i].wish && wish) {
      wish.start();
      later(() => {
        const ring = document.getElementById("wishRing");
        if (ring && wish.phase === "idle") ring.classList.add("show");
      }, 900);
    }
    // Music 1 owns every opening page; moving between pages never restarts it
    BGM.play("opening");
    if (!BGM.fileMode) AE.setTrack(i >= 4 ? "night" : "garden");
  },
  deactivatePage(i) {
    // inactive scenes must not burn a single frame
    if (i === 0 && typeof gardenScene !== 'undefined') gardenScene.stop();
    petalFields[i] && petalFields[i].stop();
    if (SLIDES[i] && SLIDES[i].wish && wish) wish.stop();
  },

  /* =========================================================================
     OPENING → CELEBRATION
     An environmental change, not a page change: the garden darkens, embers
     climb, stars come out, and the night is already there underneath.
     ========================================================================= */
  enterCelebration(fromWish) {
    if (this.state !== ST.PAGE || this.lock) return;
    if (!this.set(ST.CEL_ENTER)) return;
    this.lock = true;
    const fromEl = pageEls[this.page];

    // 1. the world dims — to deep blue, never to black
    veil.style.transition = "opacity 900ms var(--ease)";
    veil.style.opacity = "0.5";

    // 2. embers lift out of the page and keep flying across the change
    const origin = fromWish && wish
      ? { x: wish.cx, y: wish.wickY() }
      : { x: innerWidth * 0.5, y: innerHeight * 0.72 };
    bridge.rise(fromWish ? 46 : 26, origin);

    // 3. the night is mounted and already rendering behind the veil
    celEl.classList.add("warm");
    celebration.reset();

    later(() => {
      celebration.start();
      celebration.onBeat = name => {
        if (name === "titleIn") document.getElementById("celCopy").classList.add("reveal");
        if (name === "climax") this.set(ST.CEL_CLIMAX);
      };
      celebration.onComplete = pt => this.celebrationFinished(pt);
      this.show(celEl, 1500);
      this.hide(fromEl, 1500);
      this.deactivatePage(this.page);
      veil.style.opacity = "0";
      this.markDots(5);
      // Music 1 stops completely, Music 2 starts from 0:00
      BGM.play("celebration");
      if (!BGM.fileMode) AE.setTrack("night");
      AE.startAmbience(0.03);
      this.set(ST.CEL_ACTIVE);

      // 4. the cake is built in the background while the story plays.
      //    Readiness never triggers navigation — it only removes the wait.
      later(() => { try { cake.prepare(); } catch (e) { } }, 260);
      later(() => { try { finalSky.resize(); } catch (e) { } }, 900);

      // the lock stays on for the whole celebration: it is released only by
      // celebrationFinished(). A swipe in between reaches nothing.
    }, 620);
  },

  wishComplete() {
    // the wish embers fly and the night follows — but only from the wish page
    if (this.state !== ST.PAGE || this.page !== 2) return;
    later(() => {
      if (this.state === ST.PAGE && this.page === 2) this.goToPage(3);
    }, 1500);
  },

  /* =========================================================================
     CELEBRATION → CAKE
     Fires once, from the scene's own timeline, the instant the story ends.
     The last warm light in the sky travels down and becomes the candle glow.
     ========================================================================= */
  celebrationFinished(pt) {
    if (!this.set(ST.CEL_DONE)) return;
    if (!this.set(ST.CAKE_TRANS)) return;

    const from = pt && isFinite(pt.x) ? pt : { x: innerWidth * 0.5, y: innerHeight * 0.3, s: 0.5 };
    const rect = cakeEl.getBoundingClientRect();
    const target = cake.lightPoint();
    const to = { x: rect.left + target.x, y: rect.top + target.y, s: 0.22 };

    // the cake is already built; bring it forward immediately
    cakeEl.classList.add("warm");
    cake.start();
    this.show(cakeEl, 950);
    this.hide(celEl, 950);
    this.markDots(6);

    // one warm light crosses the cut so there is never an empty frame
    bridge.carry(from, to, 0.95, () => {
      bridge.clear();
      this.set(ST.CAKE);
      this.lock = false;               // cake interactions are now live
    });

    // Music 2 stops completely, Music 3 starts from 0:00
    BGM.play("cake");
    if (!BGM.fileMode) AE.setTrack("cake");
    // cleanup happens AFTER the transition has already started
    later(() => {
      celebration.stop();
      AE.stopAmbience();
    }, 1000);
  },

  /* =========================================================================
     CAKE → FINAL
     The candle glow lifts away and becomes a star. Nothing fades to black.
     ========================================================================= */
  cakeFinished(pt) {
    if (this.state !== ST.CAKE) return;
    if (!this.set(ST.FIN_TRANS)) return;
    this.lock = true;

    const rect = cakeEl.getBoundingClientRect();
    const from = pt && isFinite(pt.x)
      ? { x: rect.left + pt.x, y: rect.top + pt.y, s: 0.3 }
      : { x: innerWidth * 0.5, y: innerHeight * 0.55, s: 0.3 };
    const to = { x: innerWidth * 0.5, y: innerHeight * 0.2, s: 0.12 };

    finalEl.classList.add("warm");
    finalSky.reset();
    finalSky.start();
    this.show(finalEl, 1500);
    this.hide(cakeEl, 1500);
    this.markDots(7);
    // Music 3 carries straight through to the final page: no switch, no restart
    if (!BGM.fileMode) AE.setTrack("final");

    bridge.carry(from, to, 1.35, () => {
      bridge.clear();
      this.set(ST.FINAL);
      this.lock = false;
    });

    later(() => cake.stop(), 1550);
  },

  /* =========================================================================
     REPLAY — a genuine fresh visit: every loop, timer, particle and piece of
     scene state is torn down before anything starts again.
     ========================================================================= */
  replay() {
    if (this.lock) return;
    this.lock = true;

    veil.style.transition = "opacity 700ms var(--ease)";
    veil.style.opacity = "0.55";

    later(() => {
      // 1. stop every animation loop
      clearAllTimers();
      celebration.stop();
      cake.stop();
      finalSky.stop();
      bridge.clear();
      if (typeof gardenScene !== 'undefined') gardenScene.reset();
      petalFields.forEach(p => p && p.stop());
      wish && wish.stop();

      // 2. wipe every piece of scene state
      celebration.reset();
      cake.reset();
      cake.prepared = false;
      wish && wish.reset();
      AE.stopAmbience();
      BGM.stopAll();          // replay begins Music 1 again from 0:00

      // 3. reset the DOM layers
      [...pageEls, celEl, cakeEl, finalEl].forEach(el => el.classList.remove("on", "out", "warm"));
      document.getElementById("celCopy").classList.remove("reveal");
      setLine("cakeCaption", "");
      setLine("cakePrompt", "");
      const made = pageEls[2].querySelector(".wish-made");
      if (made) made.style.opacity = "0";
      const hint = document.getElementById("wishHint");
      if (hint) hint.classList.remove("gone");
      const ring = document.getElementById("wishRing");
      if (ring) ring.classList.remove("show");

      // 4. rewind the state machine itself
      this.state = ST.GATE;
      this.started = false;
      this.page = 0;
      this.begin();

      veil.style.opacity = "0";
      later(() => { this.lock = false; }, 700);
    }, 720);
  }
};
const D = Director;

/* ===================== SCENE-AWARE GESTURES =====================
   One listener for the whole stage. It asks the director whether navigation is
   even possible before it does anything, so a swipe during the celebration or
   during a transition is simply not a navigation event. Object interaction
   (the wish flame, the knife, the slice) always wins over scene navigation. */
(() => {
  let sx = 0, sy = 0, st = 0, tracking = false;

  const isObjectInteraction = (e) => {
    // the cake canvas owns its own pointer stream
    if (e.target && e.target.closest && e.target.closest(".no-swipe")) {
      // ...except on the wish page, where only the flame itself is an object
      if (e.target.id === "wishCv" && wish) {
        const b = e.target.getBoundingClientRect();
        return wish.hits(e.clientX - b.left, e.clientY - b.top);
      }
      return true;
    }
    return false;
  };

  stage.addEventListener("pointerdown", e => {
    if (isObjectInteraction(e)) { tracking = false; return; }
    tracking = true;
    sx = e.clientX; sy = e.clientY; st = performance.now();
  }, { passive: true });

  stage.addEventListener("pointerup", e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy, dt = performance.now() - st;
    const horizontal = Math.abs(dx) > Math.abs(dy) * 1.3;
    const far = Math.abs(dx) > 44;
    const flick = Math.abs(dx) > 18 && dt < 260;
    if (!horizontal || !(far || flick)) return;
    // THE gate: outside the garden pages this returns false and nothing happens.
    if (!D.canNavigate()) return;
    dx < 0 ? D.next() : D.prev();
  }, { passive: true });

  stage.addEventListener("pointercancel", () => { tracking = false; }, { passive: true });

  // a tap on the right/left third of a garden page also turns the page
  stage.addEventListener("click", e => {
    if (isObjectInteraction(e)) return;
    if (!D.canNavigate()) return;
    if (e.target.closest("button")) return;
    const x = e.clientX / innerWidth;
    if (x > 0.7) D.next();
    else if (x < 0.3) D.prev();
  });

  addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "PageDown") { if (D.canNavigate()) D.next(); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { if (D.canNavigate()) D.prev(); }
  });

  // nothing in this experience scrolls
  addEventListener("wheel", e => { e.preventDefault(); }, { passive: false });
  addEventListener("touchmove", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
})();

/* ===================== OPENING GATE, AUDIO, REPLAY ===================== */
(() => {
  const intro = document.getElementById("intro");
  const startBtn = document.getElementById("startBtn");
  const soundBtn = document.getElementById("sound");
  const starsCv = document.getElementById("introStars");

  /* the gate has its own quiet sky so the very first frame is already alive */
  (() => {
    const a = fitCanvas(starsCv); const c = a.c;
    const stars = Array.from({ length: 80 }, () => ({
      x: rnd(0, a.w), y: rnd(0, a.h), r: rnd(0.3, 1), p: rnd(0, 6.3), sp: rnd(0.3, 1)
    }));
    let raf = 0;
    const t0 = performance.now();
    const tick = () => {
      if (!document.body.contains(starsCv) || intro.classList.contains("hide")) { cancelAnimationFrame(raf); return; }
      const T = (performance.now() - t0) / 1000;
      c.clearRect(0, 0, a.w, a.h);
      c.save(); c.globalCompositeOperation = "lighter";
      for (const s of stars) {
        c.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(T * s.sp + s.p));
        c.fillStyle = "#FFFFFF";
        c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.3); c.fill();
      }
      c.restore();
      raf = requestAnimationFrame(tick);
    };
    tick();
  })();

  function openCard() {
    if (D.started) return;
    AE.unlock();
    BGM.unlock();
    BGM.play("opening");                        // Music 1, from the very beginning
    if (!BGM.fileMode) AE.musicStart("garden");
    intro.classList.add("hide");
    later(() => { intro.style.display = "none"; }, 1100);
    D.begin();
  }
  startBtn.addEventListener("click", openCard);
  intro.addEventListener("click", e => { if (e.target === intro || e.target === starsCv) openCard(); });

  let soundOn = true;
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    if (!soundOn) {
      BGM.setEnabled(false); AE.musicStop();
      soundBtn.style.opacity = "0.35"; soundBtn.innerHTML = "&#9834;";
    } else {
      AE.unlock(); BGM.setEnabled(true);
      if (!BGM.fileMode) AE.musicStart();
      soundBtn.style.opacity = "1"; soundBtn.innerHTML = "&#9835;";
    }
  });

  /* the gift button on the final page: every song stops before we leave */
  const giftLink = document.getElementById("giftLink");
  if (giftLink) {
    const OPEN_IN_NEW_TAB = false;   // true = keep the card open behind the link
    giftLink.addEventListener("click", e => {
      e.preventDefault();
      const url = giftLink.getAttribute("href");
      BGM.stopAll();                                       // all three songs: paused + rewound
      try { AE.musicStop(); AE.stopAmbience(); } catch (err) { }
      setTimeout(() => {
        if (OPEN_IN_NEW_TAB) window.open(url, "_blank", "noopener");
        else location.href = url;
      }, 120);
    });
  }

  /* try Music 1 the instant the card loads; if the browser holds audio back
     until a gesture, the gate tap starts it instead */
  BGM.play("opening");

  document.getElementById("replay").addEventListener("click", () => D.replay());

  // keep canvases honest when the viewport changes (rotation, browser chrome)
  let rz = 0;
  addEventListener("resize", () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      if (D.state === ST.CAKE || D.state === ST.CAKE_TRANS) cake.layout();
    }, 180);
  });
})();

/* ---- QA hook: lets a screenshot land on an exact story beat. Harmless at runtime. ---- */
window.__qa = {
  D, celebration, cake, finalSky, bridge, wish,
  jump(scene, t) {
    const intro = document.getElementById("intro");
    intro.classList.add("hide"); intro.style.display = "none";
    if (!D.started) { D.started = true; D.state = ST.PAGE; D.page = 0; D.show(pageEls[0], 1); D.activatePage(0); }
    if (scene === "page") { D.state = ST.PAGE; D.lock = false; D.goToPage(t, 1); return; }
    if (scene === "cel") {
      [...pageEls].forEach(el => el.classList.remove("on", "out"));
      D.state = ST.PAGE; D.lock = false;
      D.enterCelebration(false);
      document.getElementById("celCopy").classList.add("reveal");
      if (t) this.seek(celebration, t);
      return;
    }
    if (scene === "cake") {
      [...pageEls, celEl].forEach(el => el.classList.remove("on", "out"));
      D.state = ST.CAKE; D.lock = false;
      cakeEl.classList.add("warm");
      cake.prepare(); cake.start();
      D.show(cakeEl, 1);
      D.markDots(6);
      if (t) this.seek(cake, t);
      return;
    }
    if (scene === "final") {
      [...pageEls, celEl, cakeEl].forEach(el => el.classList.remove("on", "out"));
      D.state = ST.FINAL; D.lock = false;
      finalSky.reset(); finalSky.start();
      D.show(finalEl, 1);
      D.markDots(7);
    }
  },
  /* wait until the scene's loop is actually live, then fast-forward its clock */
  seek(scene, t) {
    const tryIt = () => {
      if (scene.running) { scene.T = t; return; }
      setTimeout(tryIt, 60);
    };
    setTimeout(tryIt, 60);
  },
  state: () => D.state
};
</script>
