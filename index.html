  rise(n = 34, from) {
    const { w, h } = this;
    const x0 = from ? from.x : w * 0.5, y0 = from ? from.y : h * 0.72;
    for (let i = 0; i < (this.reduced ? 12 : n); i++) {
      this.p.push({
        x: x0 + rnd(-w * 0.09, w * 0.09), y: y0 + rnd(-20, 40),
        vy: -rnd(90, 240), vx: rnd(-26, 26), r: rnd(1, 2.8),
        p: rnd(0, 6.3), sp: rnd(1, 2.4), life: rnd(1.6, 3.2), age: 0,
        col: pick(["#FFD79A", "#FFC06E", "#FFF0C8", "#FFB77A"])
      });
    }
    this.start();
  }

  /* the single warm light that travels between two scenes.
     dur is in seconds; onArrive fires exactly once, when it lands. */
  carry(from, to, dur, onArrive) {
    this.orb = {
      x0: from.x, y0: from.y, s0: from.s == null ? 1 : from.s,
      x1: to.x, y1: to.y, s1: to.s == null ? 1 : to.s,
      t: 0, dur, fired: false, onArrive: onArrive || null,
      bow: (to.y > from.y ? 1 : -1) * rnd(0.06, 0.14)
    };
    this.start();
  }

  start() {
    this.show();
    if (this.running) return;
    this.running = true;
    this.last = performance.now();
    this.loop();
  }
  stop() { this.running = false; if (this._raf) cancelAnimationFrame(this._raf); this._raf = 0; }
  clear() {
    this.stop();
    this.p = []; this.orb = null;
    this.hide();
    if (this.c) this.c.clearRect(0, 0, this.w, this.h);
  }
  destroy() { this.stop(); removeEventListener("resize", this._onResize); }

  loop() {
    if (!this.running) return;
    const now = performance.now();
    const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    const { c, w, h } = this;
    c.clearRect(0, 0, w, h);
    c.save();
    c.globalCompositeOperation = "lighter";

    /* embers */
    this.p = this.p.filter(e => {
      e.age += dt;
      const k = 1 - e.age / e.life;
      if (k <= 0) return false;
      e.vy += 26 * dt;                   // they slow as they climb
      e.x += (e.vx + Math.sin(e.age * e.sp + e.p) * 22) * dt;
      e.y += e.vy * dt;
      const a = Math.min(1, k * 1.6) * 0.85;
      const g = c.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 7);
      g.addColorStop(0, e.col);
      g.addColorStop(0.3, `rgba(255,180,110,${(a * 0.5).toFixed(3)})`);
      g.addColorStop(1, "rgba(255,150,80,0)");
      c.globalAlpha = a;
      c.fillStyle = g;
      c.beginPath(); c.arc(e.x, e.y, e.r * 7, 0, 6.3); c.fill();
      c.globalAlpha = a;
      c.fillStyle = "#FFF3D8";
      c.beginPath(); c.arc(e.x, e.y, e.r * 0.7, 0, 6.3); c.fill();
      return true;
    });

    /* the travelling warm light */
    const o = this.orb;
    if (o) {
      o.t = Math.min(1, o.t + dt / o.dur);
      const e = easeInOut(o.t);
      const x = mix(o.x0, o.x1, e);
      // a gentle arc rather than a straight line — it reads as falling light
      const y = mix(o.y0, o.y1, e) + Math.sin(e * Math.PI) * (o.y1 - o.y0) * o.bow;
      const s = mix(o.s0, o.s1, e);
      const R = Math.max(w, h) * 0.55 * s;
      const warm = c.createRadialGradient(x, y, 0, x, y, R);
      warm.addColorStop(0, "rgba(255,248,225,.95)");
      warm.addColorStop(0.06, "rgba(255,214,140,.72)");
      warm.addColorStop(0.22, "rgba(255,168,86,.28)");
      warm.addColorStop(0.55, "rgba(255,138,66,.09)");
      warm.addColorStop(1, "rgba(255,130,60,0)");
      c.globalAlpha = 1;
      c.fillStyle = warm;
      c.beginPath(); c.arc(x, y, R, 0, 6.3); c.fill();
      // core
      c.fillStyle = "rgba(255,252,240,.95)";
      c.beginPath(); c.arc(x, y, Math.max(1.5, 7 * s), 0, 6.3); c.fill();
      // a few sparks trail behind it
      if (!this.reduced && Math.random() < 0.55) {
        this.p.push({
          x, y, vx: rnd(-18, 18), vy: rnd(-30, 10), r: rnd(0.7, 1.8),
          p: rnd(0, 6.3), sp: rnd(1, 2), life: rnd(0.7, 1.5), age: 0,
          col: pick(["#FFD79A", "#FFF0C8"])
        });
      }
      if (o.t >= 1 && !o.fired) {
        o.fired = true;
        if (o.onArrive) o.onArrive();
        this.orb = null;
      }
    }
    c.restore();

    if (!this.p.length && !this.orb) { this.running = false; this.hide(); return; }
    this._raf = requestAnimationFrame(() => this.loop());
  }
}

/* ===================== FINAL SKY =====================
   The calm ending: a slow pull-back, a warm horizon that came from the candles,
   drifting stars and two or three lanterns still out there somewhere. Quiet on purpose. */
class FinalSky {
  constructor(cv) {
    this.cv = cv; this.running = false;
    this.reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    this._onResize = () => this.resize();
    this.resize();
    addEventListener("resize", this._onResize);
  }
  resize() {
    const a = fitCanvas(this.cv); this.c = a.c; this.w = a.w; this.h = a.h;
    const n = this.reduced ? 60 : 150;
    this.stars = Array.from({ length: n }, () => ({
      x: rnd(0, this.w), y: rnd(0, this.h * 0.92), r: rnd(0.4, 1.6),
      p: rnd(0, 6.3), sp: rnd(0.25, 0.9), z: rnd(0.3, 1),
      col: Math.random() < 0.14 ? "#FFE4C0" : "#EAF2FF"
    }));
    this.far = Array.from({ length: this.reduced ? 2 : 5 }, (_, i) => ({
      x: rnd(this.w * 0.1, this.w * 0.9), y: rnd(this.h * 0.18, this.h * 0.62),
      s: rnd(0.16, 0.32), vy: -rnd(2.4, 6), sw: rnd(0, 6.3), seed: rnd(0, 40)
    }));
    this.motes = Array.from({ length: this.reduced ? 8 : 26 }, () => ({
      x: rnd(0, this.w), y: rnd(0, this.h), r: rnd(0.5, 1.5),
      vy: -rnd(3, 12), vx: rnd(-4, 4), p: rnd(0, 6.3), a: rnd(0.1, 0.3)
    }));
  }
  start() { if (this.running) return; this.running = true; this.t0 = performance.now(); this.last = this.t0; this.loop(); }
  stop() { this.running = false; if (this._raf) cancelAnimationFrame(this._raf); this._raf = 0; }
  reset() { this.t0 = performance.now(); this.resize(); }
  destroy() { this.stop(); removeEventListener("resize", this._onResize); }
  loop() {
    if (!this.running) return;
    const now = performance.now();
    const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    const T = (now - this.t0) / 1000;
    const { c, w, h } = this;

    // slow pull-back: the world settles away from you at the end
    const zoom = 1.06 - easeOut(clamp01(T / 9)) * 0.06;
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#060A18"); g.addColorStop(0.55, "#0C1630"); g.addColorStop(1, "#131E3C");
    c.fillStyle = g; c.fillRect(0, 0, w, h);

    c.save();
    c.translate(w / 2, h / 2); c.scale(zoom, zoom); c.translate(-w / 2, -h / 2);

    // the warm light from the cake candles, now low on the horizon
    const gl = c.createRadialGradient(w * 0.5, h * 1.02, 10, w * 0.5, h * 1.02, h * 0.85);
    gl.addColorStop(0, `rgba(255,190,120,${(0.17 + Math.sin(T * 0.18) * 0.04).toFixed(3)})`);
    gl.addColorStop(0.5, "rgba(255,160,100,.05)");
    gl.addColorStop(1, "rgba(255,190,120,0)");
    c.fillStyle = gl; c.fillRect(0, 0, w, h);

    c.save(); c.globalCompositeOperation = "lighter";
    for (const s of this.stars) {
      const tw = 0.22 + 0.6 * Math.abs(Math.sin(T * s.sp + s.p));
      c.globalAlpha = tw * (0.45 + s.z * 0.55) * Math.min(1, T / 2.2);
      c.fillStyle = s.col;
      c.beginPath(); c.arc(s.x, s.y - T * 1.2 * s.z, s.r, 0, 6.3); c.fill();
      if (s.r > 1.25) {
        c.globalAlpha *= 0.35;
        c.beginPath(); c.arc(s.x, s.y - T * 1.2 * s.z, s.r * 3.6, 0, 6.3); c.fill();
      }
    }
    // a few lanterns still up there, very far away
    for (const l of this.far) {
      l.y += l.vy * dt; l.sw += dt * 0.4;
      l.x += Math.sin(l.sw) * 4 * dt;
      if (l.y < -30) { l.y = h * 0.8; l.x = rnd(w * 0.1, w * 0.9); }
      const a = 0.5 * Math.min(1, T / 3);
      const gg = c.createRadialGradient(l.x, l.y, 0, l.x, l.y, 26 * l.s * 6);
      gg.addColorStop(0, `rgba(255,206,130,${(a * 0.7).toFixed(3)})`);
      gg.addColorStop(1, "rgba(255,170,90,0)");
      c.globalAlpha = 1;
      c.fillStyle = gg;
      c.beginPath(); c.arc(l.x, l.y, 26 * l.s * 6, 0, 6.3); c.fill();
      if (typeof paintLantern === "function") paintLantern(c, l.x, l.y, l.s, Math.sin(l.sw) * 0.06, 1, a, false);
    }
    // the slowest possible dust
    for (const m of this.motes) {
      m.y += m.vy * dt; m.x += m.vx * dt;
      if (m.y < -10) { m.y = h + 10; m.x = rnd(0, w); }
      c.globalAlpha = m.a * (0.5 + 0.5 * Math.sin(T + m.p));
      c.fillStyle = "#FFE9C8";
      c.beginPath(); c.arc(m.x, m.y, m.r, 0, 6.3); c.fill();
    }
    c.restore();
    c.restore();

    const vg = c.createRadialGradient(w / 2, h * 0.5, Math.min(w, h) * 0.3, w / 2, h * 0.52, Math.max(w, h) * 0.8);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(3,5,14,.6)");
    c.fillStyle = vg; c.fillRect(0, 0, w, h);

    this._raf = requestAnimationFrame(() => this.loop());
  }
}
</script>
<script>/* ===================== SCENE DIRECTOR ===================== */
/* =============================================================================
   DIRECTOR — one centralized scene state machine.

   Nothing else in this file or any scene is allowed to change scenes. Scenes
   report what happened ("my story finished", "the user took a bite") and the
   director decides what that means. There is no scroll container, no carousel
   and no translateX: scenes are stacked layers that cross-dissolve.
   ============================================================================= */

/* ---- small shared utilities ---- */
function festiveTitle(text) {
  return [...text].map((ch, i) =>
    ch === " " ? "<span class=\"fsp\"> </span>"
      : `<span class="fch" style="animation-delay:${(i * 0.09).toFixed(2)}s">${ch}</span>`
  ).join("");
}
/* give each page its own breeze rhythm so no two flower groups move alike */
function varySway(html, i) {
  let n = 0;
  return html.replace(/class="sway"/g, () => `class="sway${["", "2", "3"][(i + n++) % 3]}"`);
}


/* ==================== MOONLIT GARDEN SCENE (opening page only) ==================== */
class MoonlitGardenScene {
  constructor(cv) {
    this.cv = cv;
    this.raf = 0;
    this.running = false;
    this.T = 0;
    this._prevT = 0;
    this.t0 = 0;
    this.c = null;
    this.w = 0; this.h = 0;
    this.stars = [];
    this.clouds = [];
    this.plants = [];
    this.fireflies = [];
    this.shootingStar = null;
    this.nextSS = 14;
    this._built = false;
    this._lw = 0; this._lh = 0;
  }

  /* seeded PRNG (same algorithm as rngS in the project) */
  _rng(seed) {
    let s = seed >>> 0;
    return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  /* ─── build particle / plant data once per (re)start ─── */
  _build(w, h) {
    if (this._built && this._lw === w && this._lh === h) return;
    this._built = true; this._lw = w; this._lh = h;
    const R = this._rng(8831);
    const rn = (a, b) => a + R() * (b - a);

    /* --- star field --- */
    this.stars = [];
    for (let i = 0; i < 320; i++) {
      const tier = R() < 0.60 ? 0 : R() < 0.72 ? 1 : 2;
      this.stars.push({
        x: rn(0, w),
        y: rn(0, h * 0.72),
        r: tier === 0 ? rn(0.18, 0.55) : tier === 1 ? rn(0.55, 0.95) : rn(0.9, 1.55),
        a0: tier === 0 ? rn(0.18, 0.45) : tier === 1 ? rn(0.4, 0.7) : rn(0.65, 0.95),
        sp: rn(0.18, 1.1),
        ph: rn(0, Math.PI * 2),
        tier
      });
    }

    /* --- clouds --- */
    this.clouds = [
      { cx: w * 0.14, cy: h * 0.14, rx: w * 0.24, ry: h * 0.055, a: 0.16, sp: 0.0028, ph: 0 },
      { cx: w * 0.72, cy: h * 0.10, rx: w * 0.20, ry: h * 0.048, a: 0.13, sp: 0.0022, ph: 1.2 },
      { cx: w * 0.48, cy: h * 0.23, rx: w * 0.16, ry: h * 0.038, a: 0.10, sp: 0.0018, ph: 2.7 },
    ];

    /* --- plants --- */
    this._buildPlants(w, h, R, rn);

    /* --- fireflies --- */
    const R2 = this._rng(331);
    const rn2 = (a, b) => a + R2() * (b - a);
    this.fireflies = Array.from({ length: 14 }, () => ({
      x: rn2(w * 0.04, w * 0.96),
      y: h * (0.60 + R2() * 0.35),
      r: rn2(0.9, 1.8),
      ph: rn2(0, Math.PI * 2),
      sp: rn2(0.12, 0.55),
      vx: (R2() - 0.5) * 0.22,
      vy: (R2() - 0.5) * 0.10
    }));

    this.shootingStar = null;
    this.nextSS = 14 + Math.random() * 8;
  }

  _buildPlants(w, h, R, rn) {
    const gardenBase = h;             // stems root here
    const gardenTop  = h * 0.70;      // tallest plants reach up to here
    const plants = [];

    /* colour palettes per flower type */
    const PAL = {
      rosette:    ['hsla(268,32%,76%,1)', 'hsla(280,27%,82%,1)', 'hsla(255,22%,84%,1)'],
      cosmos:     ['hsla(295,24%,79%,1)', 'hsla(310,18%,84%,1)', 'hsla(5,14%,87%,1)'],
      bellflower: ['hsla(252,38%,70%,1)', 'hsla(242,33%,75%,1)', 'hsla(266,28%,79%,1)'],
      lily:       ['hsla(205,18%,88%,1)', 'hsla(222,13%,91%,1)', 'hsla(242,10%,93%,1)'],
      anemone:    ['hsla(285,28%,72%,1)', 'hsla(260,22%,80%,1)', 'hsla(300,18%,78%,1)'],
    };
    const TYPES = ['rosette','cosmos','bellflower','lily','anemone'];
    const pick = (arr) => arr[Math.floor(R() * arr.length)];

    const stemC = () => `hsl(${210 + rn(0,22)},${36 + rn(0,18)}%,${16 + rn(0,9)}%)`;
    const leafC = () => `hsl(${200 + rn(0,28)},${38 + rn(0,18)}%,${14 + rn(0,10)}%)`;

    /* BG layer — 9 small foliage masses */
    for (let i = 0; i < 9; i++) {
      const x = (i / 8) * w * 0.88 + w * 0.06 + rn(-1, 1) * w * 0.04;
      plants.push({
        x, baseY: h * 0.86 + rn(0,1) * h * 0.06,
        height: h * (0.07 + rn(0,1) * 0.05),
        layer: 0, type: 'foliage',
        bp: 1, bloomT: 0, bloomSpd: 0,
        swPh: rn(0, Math.PI*2), swSp: rn(0.15,0.38), swAmt: rn(0.5,1.2),
        sc: rn(0.45, 0.75),
        col: `hsl(${215+rn(0,20)},${38+rn(0,18)}%,${11+rn(0,7)}%)`,
        stemC: stemC(), leafC: leafC()
      });
    }

    /* MID layer — 11 plants */
    const midT = ['cosmos','rosette','bellflower','lily','anemone','rosette','cosmos','bellflower','lily','anemone','rosette'];
    for (let i = 0; i < 11; i++) {
      const type = midT[i];
      const x = (i / 10) * w * 0.90 + w * 0.05 + rn(-1,1) * w * 0.025;
      plants.push({
        x, baseY: h * 0.90 + rn(0,1) * h * 0.06,
        height: h * (0.13 + rn(0,1) * 0.08),
        layer: 1, type,
        bp: 0,
        bloomT: 3.2 + i * 0.65 + rn(0,1) * 0.9,
        bloomSpd: rn(0.22, 0.34),
        swPh: rn(0, Math.PI*2), swSp: rn(0.12,0.28), swAmt: rn(0.9,1.8),
        sc: rn(0.68, 1.05),
        col: pick(PAL[type]),
        stemC: stemC(), leafC: leafC()
      });
    }

    /* FG layer — 7 prominent plants */
    const fgT = ['lily','rosette','anemone','cosmos','bellflower','lily','rosette'];
    for (let i = 0; i < 7; i++) {
      const type = fgT[i];
      const x = (i / 6) * w * 0.84 + w * 0.08 + rn(-1,1) * w * 0.03;
      plants.push({
        x, baseY: h * 0.965 + rn(0,1) * h * 0.03,
        height: h * (0.20 + rn(0,1) * 0.10),
        layer: 2, type,
        bp: 0,
        bloomT: 5.5 + i * 0.85 + rn(0,1) * 1.1,
        bloomSpd: rn(0.16, 0.26),
        swPh: rn(0, Math.PI*2), swSp: rn(0.09,0.20), swAmt: rn(1.2,2.2),
        sc: rn(0.88, 1.38),
        col: pick(PAL[type]),
        stemC: stemC(), leafC: leafC()
      });
    }

    plants.sort((a, b) => a.layer - b.layer || a.baseY - b.baseY);
    this.plants = plants;
  }

  /* ─── lifecycle ─── */
  start() {
    if (this.running) return;
    const cw = this.cv.clientWidth, ch = this.cv.clientHeight;
    if (!cw || !ch) { requestAnimationFrame(() => this.start()); return; }
    const a = fitCanvas(this.cv);
    this.c = a.c; this.w = a.w; this.h = a.h;
    this._build(a.w, a.h);
    this.running = true;
    this.T = 0; this._prevT = 0;
    this.t0 = performance.now();
    const tick = (now) => {
      if (!this.running) return;
      const newT = (now - this.t0) / 1000;
      const dt = Math.min(0.05, newT - this._prevT);
      this._prevT = newT; this.T = newT;
      /* handle resize */
      const cw2 = this.cv.clientWidth, ch2 = this.cv.clientHeight;
      if (cw2 !== this._lw || ch2 !== this._lh) {
        const b = fitCanvas(this.cv);
        this.c = b.c; this.w = b.w; this.h = b.h;
        this._build(b.w, b.h);
      }
      this._frame(dt);
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  stop() {
    this.running = false;
    cancelAnimationFrame(this.raf);
    this.raf = 0;
  }

  reset() {
    this.stop();
    this._built = false;
    this.T = 0; this._prevT = 0;
    /* reset bloom on all plants */
    for (const pl of this.plants) pl.bp = (pl.type === 'foliage') ? 1 : 0;
  }

  /* ─── main render ─── */
  _frame(dt) {
    const c = this.c, w = this.w, h = this.h, T = this.T;
    c.clearRect(0, 0, w, h);
    this._sky(c, w, h);
    this._clouds(c, w, h, T);
    this._moon(c, w, h);
    this._stars(c, T);
    this._gardenHaze(c, w, h);
    this._plants(c, w, h, T, dt);
    this._fireflies(c, w, h, T);
    this._shootingStar(c, w, h, T);
  }

  /* ─── sky ─── */
  _sky(c, w, h) {
    const g = c.createRadialGradient(w * 0.5, h * 0.28, 0, w * 0.5, h * 0.28, h * 0.88);
    g.addColorStop(0,    '#1B275C');
    g.addColorStop(0.28, '#101A45');
    g.addColorStop(0.58, '#07102A');
    g.addColorStop(1,    '#030810');
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    /* soft atmospheric warm-indigo band near horizon */
    const hz = c.createLinearGradient(0, h * 0.62, 0, h * 0.78);
    hz.addColorStop(0, 'rgba(28,20,68,0)');
    hz.addColorStop(1, 'rgba(18,14,52,0.22)');
    c.fillStyle = hz; c.fillRect(0, h * 0.62, w, h * 0.16);
  }

  /* ─── moon ─── */
  _moon(c, w, h) {
    const mx = w * 0.77, my = h * 0.13, mr = Math.min(w, h) * 0.058;
    /* large diffuse outer atmospheric halo */
    const g0 = c.createRadialGradient(mx, my, 0, mx, my, mr * 6);
    g0.addColorStop(0, 'rgba(190,218,255,0.10)');
    g0.addColorStop(0.45,'rgba(165,200,255,0.05)');
    g0.addColorStop(1,   'rgba(140,185,255,0)');
    c.fillStyle = g0; c.beginPath(); c.arc(mx, my, mr * 6, 0, Math.PI*2); c.fill();
    /* inner corona */
    const g1 = c.createRadialGradient(mx, my, 0, mx, my, mr * 2.4);
    g1.addColorStop(0, 'rgba(230,242,255,0.28)');
    g1.addColorStop(0.5,'rgba(205,228,255,0.12)');
    g1.addColorStop(1,  'rgba(185,215,255,0)');
    c.fillStyle = g1; c.beginPath(); c.arc(mx, my, mr * 2.4, 0, Math.PI*2); c.fill();
    /* moon disc */
    const gm = c.createRadialGradient(mx - mr*0.18, my - mr*0.22, 0, mx, my, mr);
    gm.addColorStop(0,   '#F5F8FF');
    gm.addColorStop(0.42,'#ECF3FF');
    gm.addColorStop(0.82,'#D8E8FF');
    gm.addColorStop(1,   '#C2D5F5');
    c.fillStyle = gm; c.beginPath(); c.arc(mx, my, mr, 0, Math.PI*2); c.fill();
    /* very faint surface shadow suggestion */
    c.save(); c.globalAlpha = 0.038;
    c.fillStyle = '#7080A0';
    c.beginPath(); c.ellipse(mx-mr*0.28, my+mr*0.12, mr*0.20, mr*0.14, 0.55, 0, Math.PI*2); c.fill();
    c.beginPath(); c.ellipse(mx+mr*0.18, my-mr*0.26, mr*0.12, mr*0.09, -0.3, 0, Math.PI*2); c.fill();
    c.restore();
  }

  /* ─── clouds ─── */
  _clouds(c, w, h, T) {
    c.save();
    for (const cl of this.clouds) {
      const ox = Math.sin(T * cl.sp + cl.ph) * w * 0.018;
      /* dark indigo-blue mass */
      c.globalAlpha = cl.a;
      c.filter = 'blur(22px)';
      c.fillStyle = '#243070';
      c.beginPath(); c.ellipse(cl.cx + ox, cl.cy, cl.rx, cl.ry, 0, 0, Math.PI*2); c.fill();
      /* cool moonlit top edge highlight */
      c.globalAlpha = cl.a * 0.55;
      c.fillStyle = 'rgba(188,215,255,0.22)';
      c.beginPath(); c.ellipse(cl.cx + ox, cl.cy - cl.ry * 0.32, cl.rx * 0.68, cl.ry * 0.52, 0, 0, Math.PI*2); c.fill();
    }
    c.filter = 'none'; c.globalAlpha = 1;
    c.restore();
  }

  /* ─── star field ─── */
  _stars(c, T) {
    c.save();
    for (const s of this.stars) {
      const tw = 0.5 + 0.5 * Math.sin(T * s.sp + s.ph);
      const a = s.a0 * (0.55 + 0.45 * tw);
      c.globalAlpha = a;
      if (s.tier === 2) {
        /* subtle cross-glow for bright stars */
        const grd = c.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 3.5);
        grd.addColorStop(0, 'rgba(215,232,255,0.55)');
        grd.addColorStop(1, 'rgba(215,232,255,0)');
        c.fillStyle = grd;
        c.beginPath(); c.arc(s.x, s.y, s.r * 3.5, 0, Math.PI*2); c.fill();
      }
      c.fillStyle = s.tier === 2 ? '#EAF3FF' : '#D5E6FF';
      c.beginPath(); c.arc(s.x, s.y, s.r, 0, Math.PI*2); c.fill();
    }
    c.globalAlpha = 1; c.restore();
  }

  /* ─── garden ground haze ─── */
  _gardenHaze(c, w, h) {
    const g = c.createLinearGradient(0, h * 0.68, 0, h);
    g.addColorStop(0, 'rgba(8,12,36,0)');
    g.addColorStop(0.45,'rgba(9,13,38,0.12)');
    g.addColorStop(1,   'rgba(5,8,24,0.60)');
    c.fillStyle = g; c.fillRect(0, h * 0.68, w, h * 0.32);
  }

  /* ─── plants ─── */
  _plants(c, w, h, T, dt) {
    for (const pl of this.plants) {
      if (pl.bloomT > 0 && T >= pl.bloomT && pl.bp < 1)
        pl.bp = Math.min(1, pl.bp + pl.bloomSpd * dt);
      const sw = Math.sin(T * pl.swSp + pl.swPh) * pl.swAmt * (Math.PI/180);
      c.save(); c.translate(pl.x, pl.baseY);
      if (pl.type === 'foliage') this._foliage(c, pl, sw);
      else                       this._plant(c, pl, sw);
      c.restore();
    }
  }

  _foliage(c, pl, sw) {
    c.save(); c.rotate(sw * 0.8);
    const sh = pl.height * pl.sc;
    c.fillStyle = pl.col;
    for (let i = 0; i < 4; i++) {
      const ox = (i - 1.5) * sh * 0.24;
      const oy = -(sh * (0.28 + i * 0.12));
      c.globalAlpha = 0.55 + i * 0.12;
      c.beginPath(); c.ellipse(ox, oy, sh * 0.16, sh * 0.22, 0, 0, Math.PI*2); c.fill();
    }
    c.globalAlpha = 1; c.restore();
  }

  _plant(c, pl, sw) {
    const stemH = pl.height * pl.sc;
    const bend = Math.sin(sw) * stemH * 0.18;
    const tipX = bend;
    const tipY = -stemH;

    /* stem */
    c.save();
    c.strokeStyle = pl.stemC; c.lineWidth = Math.max(1, pl.sc * 1.6); c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, 0);
    c.quadraticCurveTo(bend * 0.5, stemH * -0.55, tipX, tipY);
    c.stroke();

    /* leaves */
    const leafCnt = 2 + Math.round(pl.sc * 0.5);
    for (let i = 0; i < leafCnt; i++) {
      const t = (i + 1) / (leafCnt + 1);
      const lx = bend * t * 0.5, ly = -stemH * t;
      const side = i % 2 === 0 ? 1 : -1;
      const lLen = stemH * (0.17 + (1 - t) * 0.08) * pl.sc;
      const lAng = side * (0.65 + sw * 0.25);
      c.fillStyle = pl.leafC; c.globalAlpha = 0.72;
      c.beginPath();
      const lx2 = lx + Math.cos(lAng) * lLen, ly2 = ly + Math.sin(lAng) * lLen * 0.22 - lLen * 0.45;
      c.moveTo(lx, ly);
      c.bezierCurveTo(lx + Math.cos(lAng)*lLen*0.42, ly - lLen*0.12,
                      lx2 - Math.cos(lAng)*lLen*0.15, ly2 + lLen*0.1,
                      lx2, ly2);
      c.bezierCurveTo(lx2 + Math.cos(lAng)*lLen*0.08, ly2 + lLen*0.18,
                      lx + Math.cos(lAng)*lLen*0.25, ly + lLen*0.05,
                      lx, ly);
      c.closePath(); c.fill();
      c.globalAlpha = 1;
    }

    /* flower head */
    c.translate(tipX, tipY);
    c.rotate(sw * 0.55);
    this._flowerHead(c, pl);
    c.restore();
  }

  _flowerHead(c, pl) {
    const bp = pl.bp;
    const r = (pl.sc * 7 + 4) * Math.min(1, bp + 0.05); // tiny at first
    if (bp < 0.04)        { this._bud(c, r * 0.45, pl.col, 0);   return; }
    if (bp < 0.28)        { this._bud(c, r * 0.55, pl.col, (bp-0.04)/0.24 * 0.45); return; }
    const op = Math.min(1, (bp - 0.28) / 0.72);
    switch (pl.type) {
      case 'rosette':    this._rosette(c, r, pl.col, op); break;
      case 'cosmos':     this._cosmos(c, r, pl.col, op); break;
      case 'bellflower': this._bell(c, r, pl.col, op); break;
      case 'lily':       this._lily(c, r, pl.col, op); break;
      case 'anemone':    this._anemone(c, r, pl.col, op); break;
      default:           this._rosette(c, r, pl.col, op);
    }
  }

  _bud(c, r, col, openF) {
    const bh = r * (2.4 - openF * 1.1);
    const sp = r * openF * 0.55;
    c.globalAlpha = 0.88;
    c.fillStyle = col;
    c.beginPath();
    c.moveTo(0, 0);
    c.bezierCurveTo(-(r*0.48+sp), -bh*0.42, -(r*0.38+sp), -bh*0.85, 0, -bh);
    c.bezierCurveTo(  (r*0.38+sp), -bh*0.85,  (r*0.48+sp), -bh*0.42, 0, 0);
    c.closePath(); c.fill();
    c.globalAlpha = 1;
  }

  _rosette(c, r, col, prog) {
    const n = 5, pLen = r*(0.82+prog*0.88), pW = r*(0.44+prog*0.42);
    const sp = prog * r * 0.82;
    c.fillStyle = col;
    for (let i = 0; i < n; i++) {
      const a = (i/n)*Math.PI*2 - Math.PI/2;
      c.save(); c.translate(Math.cos(a)*sp, Math.sin(a)*sp);
      c.rotate(a + Math.PI/2);
      c.globalAlpha = 0.82 + prog*0.1;
      c.beginPath(); c.ellipse(0, -pLen*0.5, pW*0.5, pLen*0.5, 0, 0, Math.PI*2); c.fill();
      c.restore();
    }
    c.globalAlpha = 0.92; c.fillStyle = '#F2EDCF';
    c.beginPath(); c.arc(0, 0, r*0.20*(0.5+prog*0.5), 0, Math.PI*2); c.fill();
    c.globalAlpha = 1;
  }

  _cosmos(c, r, col, prog) {
    const n = 8, pLen = r*(0.72+prog*1.05);
    const pW = r*(0.13+prog*0.17);
    const sp = prog * r * 0.55;
    c.fillStyle = col;
    for (let i = 0; i < n; i++) {
      const a = (i/n)*Math.PI*2;
      c.save(); c.translate(Math.cos(a)*sp, Math.sin(a)*sp);
      c.rotate(a);
      c.globalAlpha = 0.78 + prog*0.12;
      c.beginPath(); c.ellipse(pLen*0.5, 0, pLen*0.5, pW*(0.35+prog*0.65), 0, 0, Math.PI*2); c.fill();
      c.restore();
    }
    c.globalAlpha = 0.88; c.fillStyle = 'rgba(255,240,185,0.75)';
    c.beginPath(); c.arc(0, 0, r*0.17*(0.5+prog*0.5), 0, Math.PI*2); c.fill();
    c.globalAlpha = 1;
  }

  _bell(c, r, col, prog) {
    const bh = r*(1.55 - prog*0.38), bw = r*(0.58+prog*1.0);
    c.globalAlpha = 0.86; c.fillStyle = col;
    c.beginPath();
    c.moveTo(0, 0);
    c.bezierCurveTo(-bw*0.28, -bh*0.22, -bw*(0.92+prog*0.08), -bh*0.28, -bw*(0.78+prog*0.10), -bh);
    c.bezierCurveTo(-bw*0.28, -bh*1.06,  bw*0.28, -bh*1.06,  bw*(0.78+prog*0.10), -bh);
    c.bezierCurveTo( bw*(0.92+prog*0.08), -bh*0.28,  bw*0.28, -bh*0.22, 0, 0);
    c.closePath(); c.fill();
    c.globalAlpha = 0.14; c.fillStyle = 'rgba(60,40,110,1)';
    c.beginPath(); c.ellipse(0, -bh*0.62, bw*0.38, bh*0.33, 0, 0, Math.PI*2); c.fill();
    c.globalAlpha = 1;
  }

  _lily(c, r, col, prog) {
    const n = 6, pLen = r*(0.82+prog*0.98);
    const sp = prog * r * 0.78;
    c.fillStyle = col;
    for (let i = 0; i < n; i++) {
      const a = (i/n)*Math.PI*2 - Math.PI/2;
      c.save(); c.rotate(a);
      c.globalAlpha = 0.80 + prog*0.12;
      c.beginPath();
      c.moveTo(0, 0);
      c.bezierCurveTo( r*0.18, -(pLen*0.32+sp*0.6), r*0.14, -(pLen*(0.82+prog*0.28)), 0, -(pLen+sp));
      c.bezierCurveTo(-r*0.14, -(pLen*(0.82+prog*0.28)), -r*0.18, -(pLen*0.32+sp*0.6), 0, 0);
      c.closePath(); c.fill();
      c.restore();
    }
    c.globalAlpha = 0.88; c.fillStyle = 'rgba(255,248,210,0.65)';
    c.beginPath(); c.arc(0, 0, r*0.18, 0, Math.PI*2); c.fill();
    c.globalAlpha = 1;
  }

  _anemone(c, r, col, prog) {
    const n = 7, pLen = r*(0.75+prog*0.92), pW = r*(0.28+prog*0.32);
    const sp = prog * r * 0.70;
    c.fillStyle = col;
    for (let i = 0; i < n; i++) {
      const a = (i/n)*Math.PI*2;
      c.save(); c.translate(Math.cos(a)*sp, Math.sin(a)*sp); c.rotate(a);
      c.globalAlpha = 0.80 + prog*0.13;
      c.beginPath(); c.ellipse(pLen*0.5, 0, pLen*0.52, pW*(0.4+prog*0.6), 0, 0, Math.PI*2); c.fill();
      c.restore();
    }
    /* dark ring then white center */
    c.globalAlpha = 0.72; c.fillStyle = 'rgba(30,18,58,0.85)';
    c.beginPath(); c.arc(0, 0, r*0.24*(0.4+prog*0.6), 0, Math.PI*2); c.fill();
    c.globalAlpha = 0.85; c.fillStyle = 'rgba(235,230,255,0.90)';
    c.beginPath(); c.arc(0, 0, r*0.12*(0.4+prog*0.6), 0, Math.PI*2); c.fill();
    c.globalAlpha = 1;
  }

  /* ─── fireflies ─── */
  _fireflies(c, w, h, T) {
    if (T < 9) return;
    const fadeIn = Math.min(1, (T - 9) / 4);
    for (const ff of this.fireflies) {
      ff.x += ff.vx; ff.y += ff.vy;
      if (ff.x < 0) ff.x = w; if (ff.x > w) ff.x = 0;
      if (ff.y < h * 0.58) ff.y = h * 0.98; if (ff.y > h) ff.y = h * 0.60;
      const glow = 0.18 + 0.82 * Math.abs(Math.sin(T * ff.sp + ff.ph));
      const a = glow * fadeIn * 0.85;
      const grd = c.createRadialGradient(ff.x, ff.y, 0, ff.x, ff.y, ff.r * 5.5);
      grd.addColorStop(0, `rgba(190,230,148,${a * 0.65})`);
      grd.addColorStop(1, 'rgba(190,230,148,0)');
      c.fillStyle = grd; c.beginPath(); c.arc(ff.x, ff.y, ff.r * 5.5, 0, Math.PI*2); c.fill();
      c.globalAlpha = a * 0.96; c.fillStyle = '#D5F0A8';
      c.beginPath(); c.arc(ff.x, ff.y, ff.r, 0, Math.PI*2); c.fill();
      c.globalAlpha = 1;
    }
  }

  /* ─── shooting star ─── */
  _shootingStar(c, w, h, T) {
    if (!this.shootingStar && T >= this.nextSS) {
      this.shootingStar = {
        t0: T,
        x: w * (0.08 + Math.random() * 0.38),
        y: h * (0.04 + Math.random() * 0.18),
        len: w * 0.13,
        ang: Math.PI / 5.5,
        dur: 0.75
      };
      this.nextSS = T + 22 + Math.random() * 18;
    }
    if (!this.shootingStar) return;
    const ss = this.shootingStar;
    const prog = (T - ss.t0) / ss.dur;
    if (prog > 1) { this.shootingStar = null; return; }
    const fade = prog < 0.45 ? prog / 0.45 : (1 - prog) / 0.55;
    const hx = ss.x + Math.cos(ss.ang) * ss.len * prog;
    const hy = ss.y + Math.sin(ss.ang) * ss.len * prog;
    const tx = hx - Math.cos(ss.ang) * ss.len * 0.22;
    const ty = hy - Math.sin(ss.ang) * ss.len * 0.22;
    const grd = c.createLinearGradient(tx, ty, hx, hy);
    grd.addColorStop(0, 'rgba(210,232,255,0)');
    grd.addColorStop(1, `rgba(218,238,255,${fade * 0.65})`);
    c.save(); c.strokeStyle = grd; c.lineWidth = 1.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(tx, ty); c.lineTo(hx, hy); c.stroke();
    c.restore();
  }
}
/* ==================== END MoonlitGardenScene ==================== */

/* every delayed callback in the experience goes through here, so replay can
   cancel all of them in one line. No orphan timers, ever. */
const TIMERS = new Set();
function later(fn, ms) {
  const id = setTimeout(() => { TIMERS.delete(id); fn(); }, ms);
  TIMERS.add(id);
  return id;
}
function clearAllTimers() { TIMERS.forEach(clearTimeout); TIMERS.clear(); }

/* ===================== STATE MACHINE ===================== */
const ST = {
  GATE: "GATE",
  PAGE: "PAGE",
  CEL_ENTER: "CELEBRATION_ENTER",
  CEL_ACTIVE: "CELEBRATION_ACTIVE",
  CEL_CLIMAX: "CELEBRATION_CLIMAX",
  CEL_DONE: "CELEBRATION_COMPLETE",
  CAKE_TRANS: "CAKE_TRANSITION",
  CAKE: "CAKE_ACTIVE",
  FIN_TRANS: "FINAL_TRANSITION",
  FINAL: "FINAL"
};
/* the only transitions that may ever happen */
const VALID = {
  GATE: [ST.PAGE],
  PAGE: [ST.PAGE, ST.CEL_ENTER],
  CELEBRATION_ENTER: [ST.CEL_ACTIVE],
  CELEBRATION_ACTIVE: [ST.CEL_CLIMAX, ST.CEL_DONE],
  CELEBRATION_CLIMAX: [ST.CEL_DONE],
  CELEBRATION_COMPLETE: [ST.CAKE_TRANS],
  CAKE_TRANSITION: [ST.CAKE],
  CAKE_ACTIVE: [ST.FIN_TRANS],
  FINAL_TRANSITION: [ST.FINAL],
  FINAL: [ST.GATE]
};

const Director = {
  state: ST.GATE,
  page: 0,
  lock: false,               // navigation lock: true while any transition runs
  started: false,

  /* the single choke point. Illegal moves are dropped, not thrown. */
  set(next) {
    if (this.state === next) return true;
    const allowed = VALID[this.state] || [];
    if (!allowed.includes(next) && !(next === ST.GATE)) return false;
    this.state = next;
    return true;
  },

  /* ---------------------------------------------------------------
     Is manual navigation allowed right now? Only on the garden pages,
     and only when nothing else is mid-transition. Every other state —
     including the whole celebration — answers no.
     --------------------------------------------------------------- */
  canNavigate() { return this.state === ST.PAGE && !this.lock; },

  /* ---------- layer helpers (no translateX anywhere) ---------- */
  show(el, dur) {
    document.documentElement.style.setProperty("--tdur", (dur || 1400) + "ms");
    el.classList.remove("out", "warm");
    el.classList.add("on");
  },
  hide(el, dur) {
    if (!el || !el.classList.contains("on")) return;
    document.documentElement.style.setProperty("--tdur", (dur || 1400) + "ms");
    el.classList.remove("on");
    el.classList.add("out");
    later(() => el.classList.remove("out"), (dur || 1400) + 80);
  },

  markDots(i) {
    dots.forEach((d, k) => d.classList.toggle("on", k === i));
    dotsEl.classList.toggle("dim", i > 4);
  },

  /* ---------- garden pages ---------- */
  begin() {
    if (this.started) return;
    this.started = true;
    this.state = ST.PAGE;
    this.page = 0;
    this.show(pageEls[0], 1200);
    this.activatePage(0);
    this.markDots(0);
  },

  goToPage(i, dur = 1250) {
    if (!this.canNavigate()) return;
    i = Math.max(0, Math.min(SLIDES.length - 1, i));
    if (i === this.page) return;
    this.lock = true;
    const from = pageEls[this.page], to = pageEls[i];
    this.page = i;
    this.show(to, dur);
    this.hide(from, dur);
    this.deactivatePage(+from.dataset.index);
    this.activatePage(i);
    this.markDots(i);
    later(() => { this.lock = false; }, dur * 0.55);
  },

  next() {
    if (!this.canNavigate()) return;
    if (this.page >= SLIDES.length - 1) { this.enterCelebration(); return; }
    this.goToPage(this.page + 1);
  },
  prev() {
    if (!this.canNavigate()) return;
    if (this.page > 0) this.goToPage(this.page - 1);
  },

  activatePage(i) {
    if (i === 0 && typeof gardenScene !== 'undefined') gardenScene.start();
    petalFields[i] && petalFields[i].start();
    if (SLIDES[i].wish && wish) {
      wish.start();
      later(() => {
        const ring = document.getElementById("wishRing");
        if (ring && wish.phase === "idle") ring.classList.add("show");
      }, 900);
    }
    // Music 1 owns every opening page; moving between pages never restarts it
    BGM.play("opening");
    if (!BGM.fileMode) AE.setTrack(i >= 4 ? "night" : "garden");
  },
  deactivatePage(i) {
    // inactive scenes must not burn a single frame
    if (i === 0 && typeof gardenScene !== 'undefined') gardenScene.stop();
    petalFields[i] && petalFields[i].stop();
    if (SLIDES[i] && SLIDES[i].wish && wish) wish.stop();
  },

  /* =========================================================================
     OPENING → CELEBRATION
     An environmental change, not a page change: the garden darkens, embers
     climb, stars come out, and the night is already there underneath.
     ========================================================================= */
  enterCelebration(fromWish) {
    if (this.state !== ST.PAGE || this.lock) return;
    if (!this.set(ST.CEL_ENTER)) return;
    this.lock = true;
    const fromEl = pageEls[this.page];

    // 1. the world dims — to deep blue, never to black
    veil.style.transition = "opacity 900ms var(--ease)";
    veil.style.opacity = "0.5";

    // 2. embers lift out of the page and keep flying across the change
    const origin = fromWish && wish
      ? { x: wish.cx, y: wish.wickY() }
      : { x: innerWidth * 0.5, y: innerHeight * 0.72 };
    bridge.rise(fromWish ? 46 : 26, origin);

    // 3. the night is mounted and already rendering behind the veil
    celEl.classList.add("warm");
    celebration.reset();

    later(() => {
      celebration.start();
      celebration.onBeat = name => {
        if (name === "titleIn") document.getElementById("celCopy").classList.add("reveal");
        if (name === "climax") this.set(ST.CEL_CLIMAX);
      };
      celebration.onComplete = pt => this.celebrationFinished(pt);
      this.show(celEl, 1500);
      this.hide(fromEl, 1500);
      this.deactivatePage(this.page);
      veil.style.opacity = "0";
      this.markDots(5);
      // Music 1 stops completely, Music 2 starts from 0:00
      BGM.play("celebration");
      if (!BGM.fileMode) AE.setTrack("night");
      AE.startAmbience(0.03);
      this.set(ST.CEL_ACTIVE);

      // 4. the cake is built in the background while the story plays.
      //    Readiness never triggers navigation — it only removes the wait.
      later(() => { try { cake.prepare(); } catch (e) { } }, 260);
      later(() => { try { finalSky.resize(); } catch (e) { } }, 900);

      // the lock stays on for the whole celebration: it is released only by
      // celebrationFinished(). A swipe in between reaches nothing.
    }, 620);
  },

  wishComplete() {
    // the wish embers fly and the night follows — but only from the wish page
    if (this.state !== ST.PAGE || this.page !== 2) return;
    later(() => {
      if (this.state === ST.PAGE && this.page === 2) this.goToPage(3);
    }, 1500);
  },

  /* =========================================================================
     CELEBRATION → CAKE
     Fires once, from the scene's own timeline, the instant the story ends.
     The last warm light in the sky travels down and becomes the candle glow.
     ========================================================================= */
  celebrationFinished(pt) {
    if (!this.set(ST.CEL_DONE)) return;
    if (!this.set(ST.CAKE_TRANS)) return;

    const from = pt && isFinite(pt.x) ? pt : { x: innerWidth * 0.5, y: innerHeight * 0.3, s: 0.5 };
    const rect = cakeEl.getBoundingClientRect();
    const target = cake.lightPoint();
    const to = { x: rect.left + target.x, y: rect.top + target.y, s: 0.22 };

    // the cake is already built; bring it forward immediately
    cakeEl.classList.add("warm");
    cake.start();
    this.show(cakeEl, 950);
    this.hide(celEl, 950);
    this.markDots(6);

    // one warm light crosses the cut so there is never an empty frame
    bridge.carry(from, to, 0.95, () => {
      bridge.clear();
      this.set(ST.CAKE);
      this.lock = false;               // cake interactions are now live
    });

    // Music 2 stops completely, Music 3 starts from 0:00
    BGM.play("cake");
    if (!BGM.fileMode) AE.setTrack("cake");
    // cleanup happens AFTER the transition has already started
    later(() => {
      celebration.stop();
      AE.stopAmbience();
    }, 1000);
  },

  /* =========================================================================
     CAKE → FINAL
     The candle glow lifts away and becomes a star. Nothing fades to black.
     ========================================================================= */
  cakeFinished(pt) {
    if (this.state !== ST.CAKE) return;
    if (!this.set(ST.FIN_TRANS)) return;
    this.lock = true;

    const rect = cakeEl.getBoundingClientRect();
    const from = pt && isFinite(pt.x)
      ? { x: rect.left + pt.x, y: rect.top + pt.y, s: 0.3 }
      : { x: innerWidth * 0.5, y: innerHeight * 0.55, s: 0.3 };
    const to = { x: innerWidth * 0.5, y: innerHeight * 0.2, s: 0.12 };

    finalEl.classList.add("warm");
    finalSky.reset();
    finalSky.start();
    this.show(finalEl, 1500);
    this.hide(cakeEl, 1500);
    this.markDots(7);
    // Music 3 carries straight through to the final page: no switch, no restart
    if (!BGM.fileMode) AE.setTrack("final");

    bridge.carry(from, to, 1.35, () => {
      bridge.clear();
      this.set(ST.FINAL);
      this.lock = false;
    });

    later(() => cake.stop(), 1550);
  },

  /* =========================================================================
     REPLAY — a genuine fresh visit: every loop, timer, particle and piece of
     scene state is torn down before anything starts again.
     ========================================================================= */
  replay() {
    if (this.lock) return;
    this.lock = true;

    veil.style.transition = "opacity 700ms var(--ease)";
    veil.style.opacity = "0.55";

    later(() => {
      // 1. stop every animation loop
      clearAllTimers();
      celebration.stop();
      cake.stop();
      finalSky.stop();
      bridge.clear();
      if (typeof gardenScene !== 'undefined') gardenScene.reset();
      petalFields.forEach(p => p && p.stop());
      wish && wish.stop();

      // 2. wipe every piece of scene state
      celebration.reset();
      cake.reset();
      cake.prepared = false;
      wish && wish.reset();
      AE.stopAmbience();
      BGM.stopAll();          // replay begins Music 1 again from 0:00

      // 3. reset the DOM layers
      [...pageEls, celEl, cakeEl, finalEl].forEach(el => el.classList.remove("on", "out", "warm"));
      document.getElementById("celCopy").classList.remove("reveal");
      setLine("cakeCaption", "");
      setLine("cakePrompt", "");
      const made = pageEls[2].querySelector(".wish-made");
      if (made) made.style.opacity = "0";
      const hint = document.getElementById("wishHint");
      if (hint) hint.classList.remove("gone");
      const ring = document.getElementById("wishRing");
      if (ring) ring.classList.remove("show");

      // 4. rewind the state machine itself
      this.state = ST.GATE;
      this.started = false;
      this.page = 0;
      this.begin();

      veil.style.opacity = "0";
      later(() => { this.lock = false; }, 700);
    }, 720);
  }
};
const D = Director;

/* ===================== SCENE-AWARE GESTURES =====================
   One listener for the whole stage. It asks the director whether navigation is
   even possible before it does anything, so a swipe during the celebration or
   during a transition is simply not a navigation event. Object interaction
   (the wish flame, the knife, the slice) always wins over scene navigation. */
(() => {
  let sx = 0, sy = 0, st = 0, tracking = false;

  const isObjectInteraction = (e) => {
    // the cake canvas owns its own pointer stream
    if (e.target && e.target.closest && e.target.closest(".no-swipe")) {
      // ...except on the wish page, where only the flame itself is an object
      if (e.target.id === "wishCv" && wish) {
        const b = e.target.getBoundingClientRect();
        return wish.hits(e.clientX - b.left, e.clientY - b.top);
      }
      return true;
    }
    return false;
  };

  stage.addEventListener("pointerdown", e => {
    if (isObjectInteraction(e)) { tracking = false; return; }
    tracking = true;
    sx = e.clientX; sy = e.clientY; st = performance.now();
  }, { passive: true });

  stage.addEventListener("pointerup", e => {
    if (!tracking) return;
    tracking = false;
    const dx = e.clientX - sx, dy = e.clientY - sy, dt = performance.now() - st;
    const horizontal = Math.abs(dx) > Math.abs(dy) * 1.3;
    const far = Math.abs(dx) > 44;
    const flick = Math.abs(dx) > 18 && dt < 260;
    if (!horizontal || !(far || flick)) return;
    // THE gate: outside the garden pages this returns false and nothing happens.
    if (!D.canNavigate()) return;
    dx < 0 ? D.next() : D.prev();
  }, { passive: true });

  stage.addEventListener("pointercancel", () => { tracking = false; }, { passive: true });

  // a tap on the right/left third of a garden page also turns the page
  stage.addEventListener("click", e => {
    if (isObjectInteraction(e)) return;
    if (!D.canNavigate()) return;
    if (e.target.closest("button")) return;
    const x = e.clientX / innerWidth;
    if (x > 0.7) D.next();
    else if (x < 0.3) D.prev();
  });

  addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "PageDown") { if (D.canNavigate()) D.next(); }
    if (e.key === "ArrowLeft" || e.key === "PageUp") { if (D.canNavigate()) D.prev(); }
  });

  // nothing in this experience scrolls
  addEventListener("wheel", e => { e.preventDefault(); }, { passive: false });
  addEventListener("touchmove", e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
})();

/* ===================== OPENING GATE, AUDIO, REPLAY ===================== */
(() => {
  const intro = document.getElementById("intro");
  const startBtn = document.getElementById("startBtn");
  const soundBtn = document.getElementById("sound");
  const starsCv = document.getElementById("introStars");

  /* the gate has its own quiet sky so the very first frame is already alive */
  (() => {
    const a = fitCanvas(starsCv); const c = a.c;
    const stars = Array.from({ length: 90 }, () => ({
      x: rnd(0, a.w), y: rnd(0, a.h), r: rnd(0.4, 1.5), p: rnd(0, 6.3), sp: rnd(0.3, 1)
    }));
    let raf = 0;
    const t0 = performance.now();
    const tick = () => {
      if (!document.body.contains(starsCv) || intro.classList.contains("hide")) { cancelAnimationFrame(raf); return; }
      const T = (performance.now() - t0) / 1000;
      c.clearRect(0, 0, a.w, a.h);
      c.save(); c.globalCompositeOperation = "lighter";
      for (const s of stars) {
        c.globalAlpha = 0.2 + 0.6 * Math.abs(Math.sin(T * s.sp + s.p));
        c.fillStyle = "#EAF2FF";
        c.beginPath(); c.arc(s.x, s.y, s.r, 0, 6.3); c.fill();
      }
      c.restore();
      raf = requestAnimationFrame(tick);
    };
    tick();
  })();

  function openCard() {
    if (D.started) return;
    AE.unlock();
    BGM.unlock();
    BGM.play("opening");                        // Music 1, from the very beginning
    if (!BGM.fileMode) AE.musicStart("garden");
    intro.classList.add("hide");
    later(() => { intro.style.display = "none"; }, 1100);
    D.begin();
  }
  startBtn.addEventListener("click", openCard);
  intro.addEventListener("click", e => { if (e.target === intro || e.target === starsCv) openCard(); });

  let soundOn = true;
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    if (!soundOn) {
      BGM.setEnabled(false); AE.musicStop();
      soundBtn.style.opacity = "0.35"; soundBtn.innerHTML = "&#9834;";
    } else {
      AE.unlock(); BGM.setEnabled(true);
      if (!BGM.fileMode) AE.musicStart();
      soundBtn.style.opacity = "1"; soundBtn.innerHTML = "&#9835;";
    }
  });

  /* the gift button on the final page: every song stops before we leave */
  const giftLink = document.getElementById("giftLink");
  if (giftLink) {
    const OPEN_IN_NEW_TAB = false;   // true = keep the card open behind the link
    giftLink.addEventListener("click", e => {
      e.preventDefault();
      const url = giftLink.getAttribute("href");
      BGM.stopAll();                                       // all three songs: paused + rewound
      try { AE.musicStop(); AE.stopAmbience(); } catch (err) { }
      setTimeout(() => {
        if (OPEN_IN_NEW_TAB) window.open(url, "_blank", "noopener");
        else location.href = url;
      }, 120);
    });
  }

  /* try Music 1 the instant the card loads; if the browser holds audio back
     until a gesture, the gate tap starts it instead */
  BGM.play("opening");

  document.getElementById("replay").addEventListener("click", () => D.replay());

  // keep canvases honest when the viewport changes (rotation, browser chrome)
  let rz = 0;
  addEventListener("resize", () => {
    clearTimeout(rz);
    rz = setTimeout(() => {
      if (D.state === ST.CAKE || D.state === ST.CAKE_TRANS) cake.layout();
    }, 180);
  });
})();

/* ---- QA hook: lets a screenshot land on an exact story beat. Harmless at runtime. ---- */
window.__qa = {
  D, celebration, cake, finalSky, bridge, wish,
  jump(scene, t) {
    const intro = document.getElementById("intro");
    intro.classList.add("hide"); intro.style.display = "none";
    if (!D.started) { D.started = true; D.state = ST.PAGE; D.page = 0; D.show(pageEls[0], 1); D.activatePage(0); }
    if (scene === "page") { D.state = ST.PAGE; D.lock = false; D.goToPage(t, 1); return; }
    if (scene === "cel") {
      [...pageEls].forEach(el => el.classList.remove("on", "out"));
      D.state = ST.PAGE; D.lock = false;
      D.enterCelebration(false);
      document.getElementById("celCopy").classList.add("reveal");
      if (t) this.seek(celebration, t);
      return;
    }
    if (scene === "cake") {
      [...pageEls, celEl].forEach(el => el.classList.remove("on", "out"));
      D.state = ST.CAKE; D.lock = false;
      cakeEl.classList.add("warm");
      cake.prepare(); cake.start();
      D.show(cakeEl, 1);
      D.markDots(6);
      if (t) this.seek(cake, t);
      return;
    }
    if (scene === "final") {
      [...pageEls, celEl, cakeEl].forEach(el => el.classList.remove("on", "out"));
      D.state = ST.FINAL; D.lock = false;
      finalSky.reset(); finalSky.start();
      D.show(finalEl, 1);
      D.markDots(7);
    }
  },
  /* wait until the scene's loop is actually live, then fast-forward its clock */
  seek(scene, t) {
    const tryIt = () => {
      if (scene.running) { scene.T = t; return; }
      setTimeout(tryIt, 60);
    };
    setTimeout(tryIt, 60);
  },
  state: () => D.state
};
</script>
