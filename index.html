    this.camX = Math.sin(T * 0.14) * w * 0.006;

    /* ---------- ambient bodies ---------- */
    const windBase = 10 + noise1(T * 0.16, 7) * 9;
    this.lanterns = this.lanterns.filter(l => l.step(dt, T, windBase));
    if (!this.reduced && this.lanterns.length < 24 && Math.random() < dt * 0.55 && T < S.calm) { /* more lanterns, faster spawn */
      this.lanterns.push(new SkyLantern({
        x: rnd(w * 0.05, w * 0.95), y: h + rnd(20, 120),
        z: rnd(0.18, 0.4), lift: -rnd(12, 20), born: T
      }));
    }
    for (const b of this.balloons) {
      b.y += b.vy * dt;
      b.sw += dt * (0.5 + b.z * 0.4);
      b.x += (Math.sin(b.sw) * b.amp + noise1(T * 0.3 + b.seed, 3) * 7) * dt;
      if (b.y < -150) Object.assign(b, this.newBalloon());
    }
    for (const m of this.motes) {
      m.y += m.vy * dt; m.x += (m.vx + Math.sin(m.p) * 7) * dt; m.p += dt * 1.2;
      if (m.y < -12) { m.y = h + 12; m.x = rnd(0, w); }
    }
    // a few embers lift off the lantern while it burns near the ground
    if (this.flameUp > 0.4 && T < S.release[1] + 2 && this.embers.length < 26 && Math.random() < dt * 12) {
      const g = this.gripPoint();
      this.embers.push({ x: g.x + rnd(-10, 10), y: g.y + rnd(0, 14), vx: rnd(-8, 8), vy: -rnd(20, 52), r: rnd(0.7, 1.8), age: 0, life: rnd(1, 2.2) });
    }
    this.embers = this.embers.filter(e => {
      e.age += dt; e.vy -= 14 * dt; e.x += e.vx * dt; e.y += e.vy * dt;
      return e.age < e.life;
    });

    /* ---------- completion — the timeline decides, nothing else ---------- */
    if (!this._completed && T >= S.end) {
      this._completed = true;
      this.onComplete(this.lastLightPoint());
    }
  }

  /* the warm light that carries over into the cake scene */
  lastLightPoint() {
    const l = this.mainLantern;
    if (!l) return { x: this.w * 0.5, y: this.h * 0.3, s: 0.3 };
    return { x: l.x + this.camX, y: l.y - this.camY, s: Math.max(0.08, l.scaleAt(this.h)) };
  }

  /* ============================== rendering ============================== */
  draw() {
    const { c, gc, w, h } = this;
    const T = this.T;
    c.save();
    c.setTransform(c.getTransform());

    /* ---- deep night sky ---- */
    const sky = c.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, "#0f172a");
    sky.addColorStop(0.34, "#0a1124");
    sky.addColorStop(0.67, "#060b18");
    sky.addColorStop(1, "#0a1330");
    c.fillStyle = sky; c.fillRect(0, 0, w, h);

    // moon + halo (background layer, moves least)
    const px = -this.camX * 0.3, py = this.camY * 0.25;
    const mx = w * 0.79 + px, my = h * 0.135 + py;
    const mg = c.createRadialGradient(mx, my, 2, mx, my, w * 0.44);
    mg.addColorStop(0, "rgba(226,232,240,.20)"); mg.addColorStop(1, "rgba(226,232,240,0)");
    c.fillStyle = mg; c.fillRect(0, 0, w, h);
    c.save(); c.globalAlpha = 0.94; c.fillStyle = "#F1F5F9";
    c.beginPath(); c.arc(mx, my, Math.max(10, w * 0.032), 0, 6.3); c.fill(); c.restore();

    // stars — parallax by depth (no per-star fillStyle; skip parallax on mobile)
    c.fillStyle = "#FFFFFF";
    for (const s of this.stars) {
      const a = 0.28 + 0.66 * Math.abs(Math.sin(T * s.s + s.p));
      c.globalAlpha = a;
      const sx = this._mobile ? s.x : s.x + px * s.z * 1.4;
      const sy = this._mobile ? s.y : s.y + py * s.z * 1.2;
      c.beginPath(); c.arc(sx, sy, s.r, 0, 6.3); c.fill();
    }
    c.globalAlpha = 1;

    /* ---- BACKGROUND: distant lanterns (skip on mobile) ---- */
    if (!this._mobile) {
      for (const l of this.lanterns) {
        if (l.z > 0.32) continue;
        const s = l.scaleAt(h);
        paintLantern(c, l.x + px * 0.6, l.y + py * 0.5, s * 0.55, l.rot, l.flame, 0.75, false);
      }
    }

    /* ---- city skyline ---- */
    c.fillStyle = "#050913";
    for (const b of this.skyline) {
      const y = h - b.h + py * 0.5;
      c.fillRect(b.x + px * 0.55, y, b.w, b.h + 20);
      for (let i = 0; i < b.lights.length; i++) {
        const l = b.lights[i];
        if (!l.on) continue;
        c.fillStyle = Math.sin(T * 0.6 + i * 2) > -0.7 ? "rgba(255,214,130,.7)" : "rgba(255,214,130,.22)";
        c.fillRect(b.x + px * 0.55 + 4 + l.dx * (b.w - 10), y + 5 + l.dy * (b.h - 12), 2.2, 3.2);
        c.fillStyle = "#050913";
      }
    }
    const haze = c.createLinearGradient(0, h * 0.78, 0, h);
    haze.addColorStop(0, "rgba(0,59,209,0)");
    haze.addColorStop(1, "rgba(0,59,209,.22)");
    c.fillStyle = haze; c.fillRect(0, h * 0.78, w, h * 0.22);

    /* ---- MIDGROUND: balloons, mid lanterns ---- */
    for (const b of this.balloons) this.drawBalloon(b, px, py);
    for (const l of this.lanterns) {
      if (l.z <= 0.32 || l === this.mainLantern) continue;
      const s = l.scaleAt(h);
      paintLantern(c, l.x + px * 0.85, l.y + py * 0.8, s * 0.62, l.rot, l.flame, 0.9, s > 0.06);
    }

    /* ---- fireworks on their own additive layer, with decaying trails ---- */
    gc.save();
    gc.globalCompositeOperation = "destination-out";
    gc.fillStyle = this._mobile ? "rgba(0,0,0,0.55)" : "rgba(0,0,0,0.2)";
    gc.fillRect(0, 0, w, h);
    gc.restore();
    this.fw.draw(gc);

    /* ---- FOREGROUND: hill, couple, main lantern ---- */
    c.save();
    c.translate(this.camX, -this.camY);
    this.drawGround(T);
    this.drawCouple(T);
    if (this.mainLantern) {
      const l = this.mainLantern;
      paintLantern(c, l.x, l.y, l.scaleAt(h) * 0.7, l.rot, l.flame, 1, true);
    }
    c.restore();

    /* ---- embers ---- */
    c.save(); c.globalCompositeOperation = "lighter";
    for (const e of this.embers) {
      const k = 1 - e.age / e.life;
      c.globalAlpha = k * 0.8;
      c.fillStyle = "#FFC978"; if (!this._mobile) { c.shadowColor = "#FF9A3C"; c.shadowBlur = 8; }
      c.beginPath(); c.arc(e.x, e.y - this.camY, e.r, 0, 6.3); c.fill();
    }
    for (const m of this.motes) {
      c.globalAlpha = (0.18 + 0.35 * Math.abs(Math.sin(m.p))) * m.z;
      c.fillStyle = `hsl(${m.hue},100%,78%)`;
      if (!this._mobile) { c.shadowColor = c.fillStyle; c.shadowBlur = 5; }
      c.beginPath(); c.arc(m.x + px * m.z, m.y, m.r, 0, 6.3); c.fill();
    }
    c.restore();

    /* ---- a big burst really does light the world (skipped on mobile) ---- */
    const fl = this.fw.flash; /* flash restored on all devices */
    if (fl > 0.01) {
      c.save();
      c.globalCompositeOperation = "lighter";
      const lift = c.createRadialGradient(this.fw.flashX, this.fw.flashY, 10, this.fw.flashX, this.fw.flashY, Math.max(w, h) * 0.9);
      lift.addColorStop(0, `rgba(186,214,255,${(fl * 0.16).toFixed(3)})`);
      lift.addColorStop(0.45, `rgba(255,214,170,${(fl * 0.07).toFixed(3)})`);
      lift.addColorStop(1, "rgba(255,214,170,0)");
      c.fillStyle = lift; c.fillRect(0, 0, w, h);
      c.restore();
    }

    /* ---- cinematic vignette (skip on mobile) ---- */
    if (!this._mobile) {
      const vg = c.createRadialGradient(w / 2, h * 0.46, Math.min(w, h) * 0.3, w / 2, h * 0.5, Math.max(w, h) * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.58)");
      c.fillStyle = vg; c.fillRect(0, 0, w, h);
    }
    c.restore();
  }

  drawBalloon(b, px, py) {
    const c = this.c, s = b.z, bw = 20 * s, bh = 25 * s;
    const x = b.x + px * s * 0.9, y = b.y + py * s;
    c.save();
    c.translate(x, y);
    const tilt = Math.sin(b.sw * 0.8) * 0.07 + b.spin;
    c.rotate(tilt);
    // string trails behind the motion instead of hanging straight
    c.strokeStyle = `rgba(255,255,255,${0.22 * s})`;
    c.lineWidth = Math.max(0.5, s);
    c.beginPath(); c.moveTo(0, bh);
    c.bezierCurveTo(bw * 0.5, bh + 24 * s, -bw * 0.6, bh + 48 * s, bw * 0.2 + Math.sin(b.sw * 1.3) * 6 * s, bh + 72 * s);
    c.stroke();
    const g = c.createRadialGradient(-bw * 0.34, -bh * 0.42, bw * 0.12, 0, 0, bw * 1.5);
    g.addColorStop(0, "rgba(255,255,255,.7)");
    g.addColorStop(0.22, b.col);
    g.addColorStop(1, "rgba(0,0,0,.42)");
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, 0, bw, bh, 0, 0, 6.3); c.fill();
    c.fillStyle = b.col;
    c.beginPath(); c.moveTo(-3 * s, bh - 1); c.lineTo(3 * s, bh - 1); c.lineTo(0, bh + 5.5 * s); c.closePath(); c.fill();
    c.restore();
  }

  drawGround(T) {
    const { c, w, h } = this;
    const gy = this.groundY(), FH = this.figH();
    c.save();
    const hill = c.createLinearGradient(0, gy - FH * 0.4, 0, h);
    hill.addColorStop(0, "rgba(12,20,34,.9)");
    hill.addColorStop(1, "#03050C");
    c.fillStyle = hill;
    c.beginPath();
    c.moveTo(-12, h + 12);
    c.quadraticCurveTo(w * 0.26, gy - FH * 0.12, w * 0.5, gy - FH * 0.07);
    c.quadraticCurveTo(w * 0.76, gy - FH * 0.12, w + 12, h + 12);
    c.closePath(); c.fill();
    // grass catching the lantern light
    const grip = this.gripPoint();
    c.lineCap = "round";
    const _gN = this._mobile ? 18 : 46;
    for (let i = 0; i < _gN; i++) {
      const x = (i / _gN) * w + Math.sin(i * 2.7) * 7;
      const d = 1 - Math.min(1, Math.abs(x - grip.x) / (w * 0.55));
      const warm = d * this.flameUp;
      c.strokeStyle = `rgba(${Math.round(120 + 110 * warm)},${Math.round(150 + 40 * warm)},${Math.round(170 - 70 * warm)},${(0.1 + 0.18 * warm).toFixed(3)})`;
      c.lineWidth = 1.1;
      const bend = Math.sin(T * 0.7 + i) * 3 + noise1(T * 0.4 + i, 2) * 2;
      const yb = gy - FH * 0.04 + Math.sin(i * 1.7) * 3;
      c.beginPath(); c.moveTo(x, yb);
      c.quadraticCurveTo(x + bend, yb - 10, x + bend * 2.2, yb - 19);
      c.stroke();
    }
    c.restore();
  }

  /* --------- two-bone IK: gives a real elbow / knee instead of a hinge --------- */
  joint(ax, ay, bx, by, l1, l2, bend) {
    const dx = bx - ax, dy = by - ay;
    const d = Math.max(0.001, Math.min(Math.hypot(dx, dy), l1 + l2 - 0.001));
    const a = (d * d + l1 * l1 - l2 * l2) / (2 * d);
    const hh = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const ux = dx / d, uy = dy / d;
    return { x: ax + ux * a - uy * hh * bend, y: ay + uy * a + ux * hh * bend };
  }
  /* a tapered, slightly curved limb segment — reads as muscle, not a stick */
  limbPath(p, x1, y1, x2, y2, w1, w2) {
    const a = Math.atan2(y2 - y1, x2 - x1) + Math.PI / 2;
    const nx = Math.cos(a), ny = Math.sin(a);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    p.moveTo(x1 + nx * w1, y1 + ny * w1);
    p.quadraticCurveTo(mx + nx * w1 * 1.12, my + ny * w1 * 1.12, x2 + nx * w2, y2 + ny * w2);
    p.lineTo(x2 - nx * w2, y2 - ny * w2);
    p.quadraticCurveTo(mx - nx * w1 * 1.05, my - ny * w1 * 1.05, x1 - nx * w1, y1 - ny * w1);
    p.closePath();
  }
  /* a hand that actually wraps something: palm, four fingers, thumb */
  handPath(p, hx, hy, ang, u, grip) {
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const L = (x, y) => ({ x: hx + x * ca - y * sa, y: hy + x * sa + y * ca });
    // palm
    const pc = L(0, 0);
    p.moveTo(pc.x + u * 0.9, pc.y);
    for (let i = 1; i <= 12; i++) {
      const t = (i / 12) * 6.2832;
      const q = L(Math.cos(t) * u * 0.9, Math.sin(t) * u * 0.66);
      p.lineTo(q.x, q.y);
    }
    p.closePath();
    // fingers curling over the rim as the grip tightens
    for (let f = 0; f < 4; f++) {
      const off = (f - 1.5) * u * 0.42;
      const curl = 0.55 + grip * 0.85;
      const a0 = L(u * 0.55, off);
      const a1 = L(u * 0.55 + u * 0.75 * Math.cos(curl * 0.6), off + u * 0.75 * Math.sin(curl * 0.6) * 0.35);
      const a2 = L(u * 0.55 + u * 1.0 * Math.cos(curl), off + u * 1.0 * Math.sin(curl) * 0.8);
      this.limbPath(p, a0.x, a0.y, a1.x, a1.y, u * 0.2, u * 0.17);
      this.limbPath(p, a1.x, a1.y, a2.x, a2.y, u * 0.17, u * 0.14);
    }
    // thumb, opposing
    const t0 = L(u * 0.1, -u * 0.5);
    const t1 = L(u * 0.75, -u * 0.75 - grip * u * 0.1);
    this.limbPath(p, t0.x, t0.y, t1.x, t1.y, u * 0.24, u * 0.18);
  }

  drawCouple(T) {
    const { c, w } = this;
    const S = this.SCRIPT;
    const gy = this.groundY(), FH = this.figH(), cx = w * 0.5;
    const grip = this.gripPoint();
    const releasing = easeInOut(seg(T, S.release[0], S.release[1]));
    const held = T < S.release[0] + 0.35;
    const lookUp = easeOut(seg(T, S.release[0] + 0.1, S.release[1] + 0.9));

    /* ---- the pool of warm light the lantern throws on the grass and on them ---- */
    const lightK = this.flameUp * (1 - releasing * 0.45);
    if (lightK > 0.01) {
      c.save();
      c.globalCompositeOperation = "lighter";
      const gl = c.createRadialGradient(grip.x, grip.y, 2, grip.x, grip.y, FH * 1.5);
      gl.addColorStop(0, `rgba(255,178,92,${(0.34 * lightK).toFixed(3)})`);
      gl.addColorStop(0.4, `rgba(255,140,60,${(0.12 * lightK).toFixed(3)})`);
      gl.addColorStop(1, "rgba(255,120,40,0)");
      c.fillStyle = gl;
      c.beginPath(); c.arc(grip.x, grip.y, FH * 1.5, 0, 6.3); c.fill();
      const gg = c.createRadialGradient(cx, gy, 4, cx, gy, FH * 0.95);
      gg.addColorStop(0, `rgba(255,160,70,${(0.17 * lightK).toFixed(3)})`);
      gg.addColorStop(1, "rgba(255,140,50,0)");
      c.fillStyle = gg;
      c.beginPath(); c.ellipse(cx, gy, FH * 0.95, FH * 0.2, 0, 0, 6.3); c.fill();
      c.restore();
    }

    /* ---- a second couple further down the hill, for depth ---- */
    const farX = Math.max(w * 0.19, cx - FH * 0.74);
    const farTgt = { x: farX, y: gy - FH * 0.46 * 1.45 };
    c.save(); c.globalAlpha = 0.55;
    if (!this._mobile) {
    this.person({ px: farX - FH * 0.075, H: FH * 0.46, dir: 1, kind: "him", grip: farTgt, gripAmt: 0.2, look: 0.8, phase: 2.1, T, light: farTgt, lightK: 0.35, far: true });
    this.person({ px: farX + FH * 0.075, H: FH * 0.43, dir: -1, kind: "her", grip: farTgt, gripAmt: 0.2, look: 0.8, phase: 3.4, T, light: farTgt, lightK: 0.35, far: true });
    } // end mobile guard
    c.restore();
    if (!this._mobile) { // their lantern, long gone up
      const ly = gy - FH * 0.46 * (2.4 + 0.45 * (0.5 + 0.5 * Math.sin(T * 0.24)));
      paintLantern(c, farX + Math.sin(T * 0.35) * 8, ly, 0.16, Math.sin(T * 0.4) * 0.06, 0.9, 0.7, false);
    } // end far lantern mobile guard

    /* ---- the main couple ---- */
    const gripAmt = held ? 1 : Math.max(0, 1 - seg(T, S.release[0] + 0.1, S.release[0] + 0.55));
    const armDown = easeInOut(seg(T, S.release[0] + 0.4, S.release[1] + 0.6));
    const restL = { x: cx - FH * 0.16, y: gy - FH * 0.5 };
    const restR = { x: cx + FH * 0.16, y: gy - FH * 0.5 };
    const handL = {
      x: mix(grip.x - FH * 0.055, restL.x, armDown),
      y: mix(grip.y + FH * 0.02, restL.y, armDown)
    };
    const handR = {
      x: mix(grip.x + FH * 0.055, restR.x, armDown),
      y: mix(grip.y + FH * 0.02, restR.y, armDown)
    };
    this.person({
      px: cx - FH * 0.165, H: FH, dir: 1, kind: "him", grip: handL, gripAmt,
      look: lookUp, phase: 0, T, light: grip, lightK
    });
    this.person({
      px: cx + FH * 0.165, H: FH * 0.935, dir: -1, kind: "her", grip: handR, gripAmt,
      look: lookUp, phase: 1.7, T, light: grip, lightK
    });

    /* ---- the lantern still in their hands ---- */
    if (held) {
      const s = 0.16 + 0.13 * this.inflate;
      const sway = Math.sin(T * 0.9) * 0.025 * this.inflate;
      paintLantern(c, grip.x, grip.y, s, sway, 0.15 + 0.85 * this.flameUp, 1, true);
    }
  }

  /* ----------------------------------------------------------------------
     One person on a 7.5-head canon, painted rather than filled flat:
     silhouette gradient + warm rim from the lantern + cool moon edge +
     fabric folds that move with the same breeze as the lanterns.
     ---------------------------------------------------------------------- */
  person(o) {
    const c = this.c;
    const { px, H, dir, kind, grip, gripAmt, look, phase, T, light, lightK, far } = o;
    const gy = this.groundY();
    const hu = H / 7.5;                                  // one head height
    const breathe = Math.sin(T * 0.95 + phase) * hu * 0.018;
    const shift = Math.sin(T * 0.3 + phase) * hu * 0.03;  // slow weight transfer
    const lean = Math.sin(T * 0.22 + phase) * 0.012 + (kind === "her" ? 0.02 : 0) * dir * -1;

    c.save();
    c.translate(px + shift, gy);
    c.rotate(lean * -dir);

    // ---- landmarks (negative = up) ----
    const yHeadTop = -7.5 * hu, yChin = -6.5 * hu, yShoulder = -6.0 * hu + breathe;
    const yChest = -5.5 * hu + breathe, yWaist = -4.55 * hu, yHip = -3.8 * hu;
    const yKnee = -2.0 * hu, yAnkle = -0.26 * hu;
    const shW = (kind === "him" ? 0.98 : 0.82) * hu;
    const hipW = (kind === "him" ? 0.74 : 0.86) * hu;
    const headR = hu * 0.37;
    const yHeadC = yHeadTop + hu * 0.5 + breathe;

    /* ================= BODY PATH ================= */
    const body = new Path2D();

    // legs (contrapposto: one leg bears the weight, the other relaxes)
    const stance = [[-1, 0.42, 0.0], [1, 0.3, 0.06]];
    for (const [sgn, bend, relax] of stance) {
      const hipX = sgn * hipW * 0.46;
      const ankX = sgn * hipW * 0.62 + sgn * relax * hu;
      const knee = this.joint(hipX, yHip, ankX, yAnkle, 1.78 * hu, 1.78 * hu, sgn * bend * 0.22);
      this.limbPath(body, hipX, yHip, knee.x, knee.y, hu * 0.26, hu * 0.19);
      this.limbPath(body, knee.x, knee.y, ankX, yAnkle, hu * 0.19, hu * 0.13);
      // foot with an actual arch and heel
      body.moveTo(ankX - hu * 0.13, yAnkle);
      body.quadraticCurveTo(ankX - hu * 0.2, -hu * 0.02, ankX - hu * 0.08, 0);
      body.lineTo(ankX + sgn * hu * 0.42, 0);
      body.quadraticCurveTo(ankX + sgn * hu * 0.46, -hu * 0.1, ankX + hu * 0.1, yAnkle);
      body.closePath();
    }

    // torso / clothing
    const windF = (k) => Math.sin(T * 1.25 + k * 4.2 + phase) * hu * 0.05 + noise1(T * 0.7 + k + phase, 5) * hu * 0.03;
    if (kind === "her") {
      // fitted bodice into a long skirt that catches the breeze
      body.moveTo(-shW * 0.92, yShoulder);
      body.quadraticCurveTo(-shW * 0.8, yChest, -hipW * 0.62, yWaist);
      body.quadraticCurveTo(-hipW * 0.9, yHip, -hipW * 1.05, yHip + hu * 0.5);
      body.quadraticCurveTo(-hipW * 1.35 + windF(0.2), yKnee, -hipW * 1.5 + windF(0.5), -hu * 0.16 + windF(0.9) * 0.4);
      body.quadraticCurveTo(0, hu * 0.1, hipW * 1.5 + windF(1.4), -hu * 0.16 + windF(1.8) * 0.4);
      body.quadraticCurveTo(hipW * 1.35 + windF(2.2), yKnee, hipW * 1.05, yHip + hu * 0.5);
      body.quadraticCurveTo(hipW * 0.9, yHip, hipW * 0.62, yWaist);
      body.quadraticCurveTo(shW * 0.8, yChest, shW * 0.92, yShoulder);
      body.quadraticCurveTo(0, yShoulder - hu * 0.22, -shW * 0.92, yShoulder);
      body.closePath();
    } else {
      // long open coat over trousers
      body.moveTo(-shW * 0.98, yShoulder);
      body.quadraticCurveTo(-shW * 1.04, yWaist, -shW * 0.96, yHip - hu * 0.1);
      body.quadraticCurveTo(-shW * 1.02 + windF(0.3), yHip + hu * 0.6, -shW * 0.92 + windF(0.7), yHip + hu * 1.15);
      body.lineTo(shW * 0.92 + windF(1.5), yHip + hu * 1.15);
      body.quadraticCurveTo(shW * 1.02 + windF(1.9), yHip + hu * 0.6, shW * 0.96, yHip - hu * 0.1);
      body.quadraticCurveTo(shW * 1.04, yWaist, shW * 0.98, yShoulder);
      body.quadraticCurveTo(0, yShoulder - hu * 0.24, -shW * 0.98, yShoulder);
      body.closePath();
    }

    // neck
    this.limbPath(body, 0, yShoulder + hu * 0.04, 0, yChin + hu * 0.06, hu * 0.17, hu * 0.15);

    // head — 3/4 rear, so we read skull, jaw and a hint of cheek
    const lookA = -dir * (0.06 + look * 0.34);
    const hc = { x: Math.sin(lookA) * hu * 0.04, y: yHeadC };
    body.moveTo(hc.x, hc.y - headR * 1.05);
    body.bezierCurveTo(hc.x + headR * 1.0, hc.y - headR * 1.0, hc.x + headR * 1.02, hc.y + headR * 0.42, hc.x + headR * 0.3, hc.y + headR * 0.98);
    body.quadraticCurveTo(hc.x, hc.y + headR * 1.16, hc.x - headR * 0.36, hc.y + headR * 0.9);
    body.quadraticCurveTo(hc.x - headR * 0.78, hc.y + headR * 0.4, hc.x - headR * 0.66, hc.y + headR * 0.04);
    body.quadraticCurveTo(hc.x - headR * 0.9, hc.y - headR * 0.12, hc.x - headR * 0.62, hc.y - headR * 0.4);
    body.quadraticCurveTo(hc.x - headR * 0.5, hc.y - headR * 0.95, hc.x, hc.y - headR * 1.05);
    body.closePath();

    // hair
    if (kind === "her") {
      const sw = Math.sin(T * 1.05 + phase) * headR * 0.14 + noise1(T * 0.8 + phase, 9) * headR * 0.1;
      body.moveTo(hc.x + headR * 0.05, hc.y - headR * 1.08);
      body.bezierCurveTo(hc.x + headR * 1.25, hc.y - headR * 0.6, hc.x + headR * 1.15, hc.y + headR * 0.4, hc.x + headR * 1.0 + sw * 0.5, hc.y + headR * 1.5);
      body.quadraticCurveTo(hc.x + headR * 0.95 + sw, hc.y + headR * 2.6, hc.x + headR * 0.42 + sw, hc.y + headR * 3.1);
      body.quadraticCurveTo(hc.x + headR * 0.3, hc.y + headR * 1.6, hc.x + headR * 0.16, hc.y + headR * 0.2);
      body.closePath();
      body.moveTo(hc.x - headR * 0.56, hc.y - headR * 0.55);
      body.quadraticCurveTo(hc.x - headR * 1.0, hc.y - headR * 0.05 + sw * 0.6, hc.x - headR * 0.74, hc.y + headR * 0.5);
      body.quadraticCurveTo(hc.x - headR * 0.52, hc.y - headR * 0.05, hc.x - headR * 0.44, hc.y - headR * 0.46);
      body.closePath();
    } else {
      body.moveTo(hc.x - headR * 0.58, hc.y - headR * 0.5);
      body.quadraticCurveTo(hc.x, hc.y - headR * 1.4, hc.x + headR * 0.98, hc.y - headR * 0.34);
      body.quadraticCurveTo(hc.x + headR * 1.06, hc.y + headR * 0.06, hc.x + headR * 0.84, hc.y + headR * 0.2);
      body.quadraticCurveTo(hc.x + headR * 0.6, hc.y - headR * 0.76, hc.x - headR * 0.52, hc.y - headR * 0.4);
      body.closePath();
    }

    // ---- arms: inner arm to the lantern, outer arm around the partner ----
    const gl = { x: grip.x - (px + shift), y: grip.y - gy };
    const shIn = { x: dir * shW * 0.7, y: yShoulder + hu * 0.12 };
    const elbowIn = this.joint(shIn.x, shIn.y, gl.x, gl.y, hu * 1.45, hu * 1.25, dir * 0.9);
    this.limbPath(body, shIn.x, shIn.y, elbowIn.x, elbowIn.y, hu * 0.23, hu * 0.17);
    this.limbPath(body, elbowIn.x, elbowIn.y, gl.x, gl.y, hu * 0.17, hu * 0.12);

    const shOut = { x: -dir * shW * 0.7, y: yShoulder + hu * 0.12 };
    const waist = { x: -dir * (hu * 0.86 + Math.sin(T * 0.5 + phase) * hu * 0.03), y: yWaist + hu * 0.24 };
    const elbowOut = this.joint(shOut.x, shOut.y, waist.x, waist.y, hu * 1.4, hu * 1.2, -dir * 0.95);
    this.limbPath(body, shOut.x, shOut.y, elbowOut.x, elbowOut.y, hu * 0.22, hu * 0.16);
    this.limbPath(body, elbowOut.x, elbowOut.y, waist.x, waist.y, hu * 0.16, hu * 0.11);

    // the hand that holds the lantern rim — fingers wrap it
    const handAng = Math.atan2(gl.y - elbowIn.y, gl.x - elbowIn.x);
    this.handPath(body, gl.x, gl.y, handAng, hu * 0.24, gripAmt);
    // resting hand on the partner's waist
    this.handPath(body, waist.x, waist.y, -dir * 0.3, hu * 0.2, 0.75);

    /* ================= PAINT ================= */
    // base: a body reads as a dark shape, but not a flat black cut-out
    const grad = c.createLinearGradient(0, yHeadTop, 0, 0);
    grad.addColorStop(0, kind === "her" ? "#1c2540" : "#18203a");
    grad.addColorStop(0.45, "#0f172a");
    grad.addColorStop(1, "#04070f");
    c.fillStyle = grad;
    c.fill(body);

    c.save();
    c.clip(body);

    // warm key light from the lantern, falling off with distance
    if (lightK > 0.01) {
      const lx = light.x - (px + shift), ly = light.y - gy;
      c.globalCompositeOperation = "lighter";
      // tight falloff: the lantern lights hands, forearms and chest — not the whole body
      const key = c.createRadialGradient(lx, ly, hu * 0.08, lx, ly, hu * 2.7);
      key.addColorStop(0, `rgba(255,188,114,${0.52 * lightK})`);
      key.addColorStop(0.3, `rgba(255,146,74,${0.17 * lightK})`);
      key.addColorStop(0.66, `rgba(214,104,56,${0.05 * lightK})`);
      key.addColorStop(1, "rgba(200,90,40,0)");
      c.fillStyle = key;
      c.fillRect(-H, yHeadTop - hu, H * 2, H + hu * 2);
      c.globalCompositeOperation = "source-over";
    }
    // cool moonlight from the upper right
    c.globalCompositeOperation = "lighter";
    const moon = c.createLinearGradient(shW * 1.2, yHeadTop, -shW * 0.4, yHip);
    moon.addColorStop(0, "rgba(226,232,240,.12)");
    moon.addColorStop(0.5, "rgba(203,213,225,.03)");
    moon.addColorStop(1, "rgba(203,213,225,0)");
    c.fillStyle = moon;
    c.fillRect(-H, yHeadTop - hu, H * 2, H + hu * 2);
    c.globalCompositeOperation = "source-over";

    if (!far && !this._mobile) { /* skip fabric folds + hair on mobile */
      // fabric folds — soft, curved, moving with the same breeze
      c.lineCap = "round";
      const foldCount = kind === "her" ? 7 : 5;
      for (let i = 0; i < foldCount; i++) {
        const t = (i + 0.5) / foldCount;
        const x0 = mix(-hipW * 1.1, hipW * 1.1, t);
        const wob = Math.sin(T * 1.2 + i * 1.7 + phase) * hu * 0.05;
        c.strokeStyle = "rgba(0,0,0,.32)";
        c.lineWidth = hu * 0.075;
        c.beginPath();
        if (kind === "her") {
          c.moveTo(x0 * 0.55, yWaist + hu * 0.1);
          c.quadraticCurveTo(x0 * 0.95 + wob, yKnee, x0 * 1.3 + wob * 1.6, -hu * 0.2);
        } else {
          c.moveTo(x0 * 0.7, yChest + hu * 0.2);
          c.quadraticCurveTo(x0 * 0.85 + wob * 0.6, yWaist, x0 * 0.9 + wob, yHip + hu * 0.9);
        }
        c.stroke();
        // the lit side of each fold — faint on purpose: fabric, not linework
        c.strokeStyle = `rgba(255,196,130,${(0.07 * lightK).toFixed(3)})`;
        c.lineWidth = hu * 0.028;
        c.stroke();
      }
      // shoulder seam / collar
      c.strokeStyle = "rgba(0,0,0,.4)";
      c.lineWidth = hu * 0.06;
      c.beginPath();
      c.moveTo(-shW * 0.55, yShoulder + hu * 0.06);
      c.quadraticCurveTo(0, yShoulder + hu * 0.3, shW * 0.55, yShoulder + hu * 0.06);
      c.stroke();
      // hair strands
      if (kind === "her") {
        c.strokeStyle = "rgba(255,196,140,.13)";
        c.lineWidth = hu * 0.03;
        for (let i = 0; i < 6; i++) {
          const sw2 = Math.sin(T * 1.05 + i + phase) * headR * 0.12;
          c.beginPath();
          c.moveTo(hc.x + headR * (0.2 + i * 0.12), hc.y - headR * 0.7);
          c.quadraticCurveTo(hc.x + headR * (1.0 + i * 0.04) + sw2, hc.y + headR * 1.0, hc.x + headR * (0.5 + i * 0.06) + sw2, hc.y + headR * 2.7);
          c.stroke();
        }
      }
    }
    c.restore();

    /* rim light — skipped on mobile (scratch canvas per person is expensive) */
    if (!this._mobile) {
      const lx = light.x - (px + shift), ly = light.y - gy;
      const L = Math.hypot(lx, ly) || 1;
      const ux = lx / L, uy = ly / L;

      if (lightK > 0.02) {
        const r = this.buildRim(body, H, ux, uy, Math.max(1, hu * 0.085), "#FFC684");
        if (r) {
          c.save();
          c.globalCompositeOperation = "lighter";
          c.globalAlpha = Math.min(0.66, 0.66 * lightK);
          c.drawImage(r.canvas, -r.ox, -r.oy, r.canvas.width / r.dpr, r.canvas.height / r.dpr);
          c.restore();
        }
      }
      if (!far) {
        const r2 = this.buildRim(body, H, 0.86, -0.5, Math.max(0.8, hu * 0.055), "#96B8F0");
        if (r2) {
          c.save();
          c.globalCompositeOperation = "lighter";
          c.globalAlpha = 0.3;
          c.drawImage(r2.canvas, -r2.ox, -r2.oy, r2.canvas.width / r2.dpr, r2.canvas.height / r2.dpr);
          c.restore();
        }
      }
    }

    // contact shadow so they are standing on the hill, not floating over it
    c.save();
    c.globalCompositeOperation = "multiply";
    const sh = c.createRadialGradient(0, 0, hu * 0.05, 0, 0, hu * 1.5);
    sh.addColorStop(0, "rgba(0,0,0,.75)");
    sh.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = sh;
    c.beginPath(); c.ellipse(0, hu * 0.05, hu * 1.5, hu * 0.3, 0, 0, 6.3); c.fill();
    c.restore();

    c.restore();
  }
}
</script>
<script>/* ===================== CAKE SCENE ===================== */
/* ===================== CAKE — one room, one cake, real interactions =====================
   Blow the candles out with air, drag a knife through the cake, watch a real
   wedge separate and come toward you, then take the first bite.               */

class CakeScene {
  constructor(cv, glow, hooks = {}) {
    this.cv = cv; this.gv = glow;
    this.onCaption = hooks.onCaption || (() => { });
    this.onPrompt = hooks.onPrompt || (() => { });
    this.onFinish = hooks.onFinish || (() => { });
    this.onStage = hooks.onStage || (() => { });
    this.reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    this.running = false;
    this.prepared = false;
    this.finished = false;
    this._onResize = () => { this.layout(); };
    this.slcv = document.createElement("canvas");
    this.slc = this.slcv.getContext("2d");
    this.bindPointer();
    addEventListener("resize", this._onResize);
    this.layout();
    this.reset();
  }

  /* -------------------------------------------------- geometry & palette -- */
  layout() {
    const a = fitCanvas(this.cv); this.c = a.c; this.w = a.w; this.h = a.h; this.dpr = a.dpr;
    const b = fitCanvas(this.gv); this.gc = b.c;
    const { w, h } = this;
    this.S = Math.min(w / 330, h / 880) * 1.34;
    const S = this.S;
    this.cx = w / 2;
    this.tableY = h * 0.775;
    this.R = 96 * S;                     // cake radius
    this.ry = this.R * 0.30;             // how much of the top we see
    this.Hc = 104 * S;                   // side height
    this.topY = this.tableY - this.Hc;
    // the wedge: a believable slice, front-of-cake, slightly to the right
    /* Wedge angles on the top ellipse. Kept deliberately OFF-CENTRE and narrow:
       a front-centred symmetric wedge projects as two mirrored faces, which
       reads as a rectangular block with a triangular roof. Off-centre shows one
       dominant lit cut face plus the curved side, which reads as a real wedge.
       The mid angle (1.15 rad) also puts the wedge exactly under the cut line
       the knife makes at cx + R*0.42, so the slice comes from where you cut. */
    this.a0 = 0.72; this.a1 = 1.58;      // radians, measured on the top ellipse
    this.bokeh = Array.from({ length: this.reduced ? 10 : 24 }, () => ({
      x: rnd(0, w), y: rnd(h * 0.04, h * 0.52), r: rnd(7, 26), a: rnd(0.05, 0.18),
      p: rnd(0, 6.3), col: pick(["#D8E4FF", "#A9C0F5", "#E2E8F0", "#FFD79A"])
    }));
    const n = 5;
    this.candles = (this.candles && this.candles.length === n ? this.candles : Array.from({ length: n }, () => ({})));
    this.candles.forEach((cd, i) => {
      cd.x = this.cx + (i - (n - 1) / 2) * 25 * S;
      cd.lean = (i - (n - 1) / 2) * 0.035;
      cd.baseY = this.topY + this.ry * 0.34 * Math.cos((i - (n - 1) / 2) * 0.7);
      cd.H = (46 + (i % 2 ? 3 : 0)) * S;
      cd.seed = cd.seed == null ? rnd(0, 40) : cd.seed;
      cd.col = cd.col || ["#E2E8F0", "#A9C0F5", "#CBD5E1", "#8FB0FF", "#F1F5F9"][i];
    });
    // offscreen buffer for the offered slice (lets us punch a real bite out of it)
    const sw = Math.ceil((this.R * 2.6) * this.dpr), sh = Math.ceil((this.Hc + this.ry * 4 + 40 * S) * this.dpr);
    this.slcv.width = sw; this.slcv.height = sh;
    this.slW = sw / this.dpr; this.slH = sh / this.dpr;
    this.blowers = this.blowers && this.blowers.length ? this.blowers : [
      { side: -1, ext: 0, vel: 0, wob: 0 }, { side: 1, ext: 0, vel: 0, wob: 0 }
    ];
  }

  /* ------------------------------------------------------------- lifecycle -- */
  reset() {
    this.T = 0; this.last = 0;
    this.finished = false;
    this.stage = "wish";
    this.confetti = []; this.crumbs = []; this.smoke = []; this.sparks = [];
    this.balloons = []; this.balloonT = 0;
    this.air = 0; this.airDir = -1; this.airT = 0; this.blowing = false;
    this.cutT = 0; this.cutDone = 0; this.frostPush = 0;
    this.knife = { x: 0, y: 0, tx: 0, ty: 0, ang: -0.42, vx: 0, vy: 0, on: false, held: false, drag: 0 };
    this.knifeIn = 0;
    this.slice = { z: 0, lift: 0, shift: 0, rot: 0, tilt: 0, settle: 0, out: 0, bite: 0, gone: 0 };
    this.bitten = false;
    this.idle = 0;
    this.glowK = 1;
    this.cam = 0;
    this.candles.forEach(cd => { cd.lit = true; cd.energy = 1; cd.stress = 0; cd.outAt = -1; });
    this.blowers.forEach(b => { b.ext = 0; b.vel = 0; b.wob = 0; });
    this.knife.x = this.cx + this.R * 0.62; this.knife.y = this.topY - this.Hc * 0.8;
    this.knife.tx = this.knife.x; this.knife.ty = this.knife.y;
    this._beats = {};
  }

  /* Called while the celebration is still on screen: build every gradient,
     path and buffer this scene needs and render one frame into the hidden
     canvas, so the first visible frame costs nothing. */
  prepare() {
    if (this.prepared) return;
    this.layout();
    this.reset();
    this.update(0.016);
    this.draw();
    this.prepared = true;
  }

  start() {
    if (this.running) return;
    this.running = true;
    this.reset();
    this.onCaption("Make a wish\u2026");
    this.onPrompt("tap to blow out the candles");
    this.onStage("wish");
    this.last = performance.now();
    this.loop();
  }
  stop() { this.running = false; if (this._raf) cancelAnimationFrame(this._raf); this._raf = 0; }
  destroy() { this.stop(); removeEventListener("resize", this._onResize); this.unbindPointer && this.unbindPointer(); }

  beat(name) { if (this._beats[name]) return false; this._beats[name] = true; return true; }

  loop() {
    if (!this.running) return;
    const now = performance.now();
    let dt = (now - this.last) / 1000; this.last = now;
    dt = Math.min(dt, 0.05);
    this.T += dt;
    this.update(dt);
    this.draw();
    this._raf = requestAnimationFrame(() => this.loop());
  }

  setStage(s) {
    if (this.stage === s) return;
    this.stage = s;
    this.idle = 0;
    this.onStage(s);
  }

  /* ------------------------------------------------------------- interaction -- */
  bindPointer() {
    const cv = this.cv;
    const pos = e => {
      const r = cv.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };
    const down = e => {
      if (!this.running) return;
      e.stopPropagation();
      const p = pos(e);
      this.idle = 0;
      if (this.stage === "wish") {
        this.startBlow(p.x);
      } else if (this.stage === "cut") {
        this.knife.held = true;
        this.knife.on = true;
        this.knife.tx = p.x; this.knife.ty = p.y;
        if (this.beat("knifeGrab")) this.onPrompt("drag the knife down through the cake");
        // capture can throw for synthetic/stale pointer ids — never let that
        // abort the grab, the drag itself works without capture
        try { cv.setPointerCapture && cv.setPointerCapture(e.pointerId); } catch (err) { }
      } else if (this.stage === "offer" && !this.bitten) {
        this.takeBite();
      }
      e.preventDefault();
    };
    const move = e => {
      if (!this.running) return;
      const p = pos(e);
      if (this.stage === "cut" && this.knife.held) {
        e.stopPropagation();
        this.knife.tx = p.x; this.knife.ty = p.y;
        e.preventDefault();
      } else if (this.stage === "wish" && e.buttons) {
        // dragging across the candles reads as blowing across them
        this.startBlow(p.x);
      }
    };
    const up = e => {
      if (!this.running) return;
      this.knife.held = false;
      this.blowing = false;
    };
    this._h = { down, move, up };
    cv.addEventListener("pointerdown", down, { passive: false });
    cv.addEventListener("pointermove", move, { passive: false });
    cv.addEventListener("pointerup", up);
    cv.addEventListener("pointercancel", up);
    this.unbindPointer = () => {
      cv.removeEventListener("pointerdown", down);
      cv.removeEventListener("pointermove", move);
      cv.removeEventListener("pointerup", up);
      cv.removeEventListener("pointercancel", up);
    };
  }

  startBlow(x) {
    if (this.stage !== "wish") return;
    this.blowing = true;
    this.airT = 1.15;
    this.airDir = x > this.cx ? -1 : 1;      // air travels away from the tap
    if (this.beat("blowSound")) { }
    AE.puff(AE.now(), 0.85);
    AE.blower(AE.now() + 0.02, 0.5);
  }

  takeBite() {
    if (this.bitten) return;
    this.bitten = true;
    this.onPrompt("");
    this.onCaption("Here, have a bite \u2764\ufe0f");
    AE.slice(AE.now(), 0.5);
    AE.sparkle(AE.now() + 0.12, 1760, 0.06);
    for (let i = 0; i < (this.reduced ? 10 : 26); i++) this.addCrumb(this.cx + rnd(-30, 30) * this.S, this.h * 0.52 + rnd(-14, 14) * this.S, 1.4);
    this.confettiBurst(this.cx, this.h * 0.44, this.reduced ? 16 : 40);
  }

  /* ------------------------------------------------------------------ physics -- */
  addCrumb(x, y, k = 1) {
    if (this.crumbs.length > 120) return;
    this.crumbs.push({
      x, y, vx: rnd(-34, 34) * k, vy: rnd(-52, -6) * k, r: rnd(0.9, 2.6) * this.S,
      rot: rnd(0, 6.3), vr: rnd(-6, 6), age: 0, life: rnd(0.8, 1.7),
      col: pick(["#E8B98D", "#C9865A", "#FFF3E2", "#E2A473"])
    });
  }
  confettiBurst(x, y, n) {
    const cap = this.reduced ? 40 : 110;
    n = Math.min(n, cap - this.confetti.length);
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + rnd(-1.25, 1.25), sp = rnd(120, 340);
      this.confetti.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        w: rnd(3, 7) * this.S, h: rnd(5, 11) * this.S,
        rot: rnd(0, 6.3), vr: rnd(-9, 9), sp: rnd(2, 5),
        age: 0, life: rnd(1.9, 3.4),
        col: pick(["#E2E8F0", "#CBD5E1", "#A9C0F5", "#6E92EE", "#F1F5F9", "#2A57DC"])
      });
    }
  }
  fireBlower(side) {
    const b = this.blowers[side < 0 ? 0 : 1];
    b.vel = 7.5; b.wob = 1;
    AE.blower(AE.now(), 0.55);
  }

  update(dt) {
    const S = this.S;
    this.idle += dt;
    this.cam = easeOut(clamp01(this.T / 6)) * 0.035;

    /* ---------------- airflow & flames ---------------- */
    this.airT = Math.max(0, this.airT - dt);
    const want = this.airT > 0 ? 1 : 0;
    this.air += (want - this.air) * Math.min(1, dt * (want ? 9 : 3.2));

    let anyLit = false;
    this.candles.forEach((cd, i) => {
      if (!cd.lit) return;
      anyLit = true;
      // candles nearer the airflow source give out first
      const order = this.airDir > 0 ? i : this.candles.length - 1 - i;
      const exposure = this.air * (1 - order * 0.13);
      cd.stress += (exposure - cd.stress) * Math.min(1, dt * 7);
      if (cd.stress > 0.22) cd.energy -= dt * (0.5 + cd.stress * 2.6);
      else cd.energy = Math.min(1, cd.energy + dt * 0.5);
      if (cd.energy <= 0) {
        cd.lit = false; cd.energy = 0; cd.outAt = this.T;
        for (let k = 0; k < (this.reduced ? 2 : 5); k++) {
          this.smoke.push({
            x: cd.x + rnd(-0.6, 0.6) * S, y: cd.baseY - cd.H, vx: rnd(-3, 3) * S + this.airDir * -7 * S,
            vy: -rnd(16, 30) * S, r: rnd(0.6, 1.5) * S, age: 0, life: rnd(0.9, 1.7),
            seed: rnd(0, 30), spin: rnd(-1, 1)
          });
        }
        AE.puff(AE.now(), 0.22);
      }
    });
    if (!anyLit && this.stage === "wish") {
      if (this.beat("allOut")) {
        this.onCaption("Happy Birthday!");
        this.onPrompt("");
        AE.cheer(AE.now(), 3.4, 0.55);
        this.fireBlower(-1);
        setTimeout(() => this.running && this.fireBlower(1), 260);
        this.confettiBurst(this.cx - this.R * 0.9, this.tableY - this.Hc * 1.1, this.reduced ? 18 : 46);
        setTimeout(() => this.running && this.confettiBurst(this.cx + this.R * 0.9, this.tableY - this.Hc * 1.1, this.reduced ? 18 : 46), 220);
        this.balloonT = 0.3;
        // move on as soon as the smoke has read, not on a fixed wait
        setTimeout(() => {
          if (!this.running) return;
          this.setStage("cut");
          this.knife.on = true;
          this.onPrompt("drag the knife down to cut the cake");
        }, this.reduced ? 700 : 1250);
      }
    }
    // idle fallback so the card can never dead-end if nobody taps
    if (this.stage === "wish" && this.idle > 16 && this.airT <= 0) this.startBlow(this.cx + 40);

    this.glowK = this.candles.reduce((a, cd) => a + (cd.lit ? cd.energy : 0), 0) / this.candles.length;
    this.glowK = Math.max(this.glowK, this.stage === "wish" ? 0 : 0.16);

    this.smoke = this.smoke.filter(s => {
      s.age += dt;
      s.vy -= 6 * S * dt;
      s.vx += (noise1(this.T * 0.8 + s.seed, 4) * 12 * S + this.airDir * -10 * S * this.air) * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      s.r += 3.2 * S * dt;
      return s.age < s.life;
    });

    /* ---------------- balloons drift in, a few at a time ---------------- */
    if (this.balloonT > 0) {
      this.balloonT -= dt;
      if (this.balloons.length < (this.reduced ? 4 : 9) && Math.random() < dt * 4.5) {
        const z = rnd(0.42, 0.9);
        this.balloons.push({
          x: rnd(this.w * 0.08, this.w * 0.92), y: this.h + rnd(20, 140), z,
          vy: -rnd(26, 46) * z, sw: rnd(0, 6.3), amp: rnd(6, 16), seed: rnd(0, 30),
          col: pick(["#E2E8F0", "#CBD5E1", "#A9C0F5", "#6E92EE", "#2A57DC", "#F1F5F9"])
        });
        AE.balloonPuff(AE.now(), 0.2);
        if (this.balloons.length < 9) this.balloonT = Math.max(this.balloonT, 0.5);
      }
    }
    for (const b of this.balloons) {
      b.y += b.vy * dt;
      b.sw += dt * (0.6 + b.z * 0.5);
      b.x += (Math.sin(b.sw) * b.amp + noise1(this.T * 0.4 + b.seed, 6) * 8) * dt;
    }
    this.balloons = this.balloons.filter(b => b.y > -180);

    /* ---------------- party blowers: spring out, wobble, come back ------- */
    for (const b of this.blowers) {
      b.vel += (0 - b.ext) * 26 * dt;
      b.vel *= 1 - 3.4 * dt;
      b.ext += b.vel * dt;
      if (b.ext < 0) { b.ext = 0; b.vel = Math.max(0, b.vel); }
      b.wob *= 1 - 2.2 * dt;
    }

    /* ---------------- the knife, and the cut it makes ---------------- */
    if (this.stage === "cut") {
      const k = this.knife;
      if (!k.held) {
        // rests just above the cake, breathing slightly, inviting a drag
        k.tx = this.cx + this.R * 0.60;
        k.ty = this.topY - this.Hc * 0.42 + Math.sin(this.T * 1.6) * 3 * S;
      }
      // inside the cake the knife moves heavier — that IS the resistance cue
      const inside = clamp01((k.y - this.topY) / this.Hc);
      const follow = k.held ? mix(0.34, 0.15, inside) : 0.06;
      const px = k.x, py = k.y;
      k.x += (k.tx - k.x) * follow;
      k.y += (k.ty - k.y) * follow;
      k.vx = (k.x - px) / Math.max(dt, 0.001);
      k.vy = (k.y - py) / Math.max(dt, 0.001);
      const wantAng = -0.42 + Math.max(-0.34, Math.min(0.34, k.vx * 0.0016)) + inside * 0.12;
      k.ang += (wantAng - k.ang) * Math.min(1, dt * 7);

      const tip = this.knifeTip();
      const overCut = Math.abs(tip.x - (this.cx + this.R * 0.42)) < this.R * 0.78;
      this.knifeIn += ((overCut && tip.y > this.topY - this.ry * 0.4 ? 1 : 0) - this.knifeIn) * Math.min(1, dt * 8);
      if (overCut && k.held) {
        const depth = clamp01((tip.y - (this.topY - this.ry * 0.25)) / (this.Hc + this.ry * 0.8));
        if (depth > this.cutT) {
          const gain = depth - this.cutT;
          this.cutT = depth;
          this.frostPush = Math.min(1, this.frostPush + gain * 2.2);
          if (gain > 0.012) {
            if (Math.random() < 0.6) this.addCrumb(tip.x + rnd(-4, 4) * S, tip.y, 0.6);
            if (this.beat("cutSound") || Math.random() < 0.09) AE.slice(AE.now(), 0.3);
          }
        }
      }
      this.frostPush *= 1 - 1.6 * dt;
      if (this.cutT > 0.9 && this.beat("cutDone")) {
        this.setStage("separate");
        this.onPrompt("");
        AE.slice(AE.now(), 0.7);
        AE.plateClink(AE.now() + 0.45, 0.35);
        for (let i = 0; i < (this.reduced ? 8 : 20); i++) this.addCrumb(this.cx + this.R * 0.45 + rnd(-18, 18) * S, this.tableY - rnd(6, 70) * S, 1);
      }
      // idle fallback: ease the knife through rather than stalling forever
      if (this.idle > 20) { this.knife.held = true; this.knife.tx = this.cx + this.R * 0.5; this.knife.ty = this.tableY + 10 * S; }
    }

    /* ---------------- separation, then the slice is offered ---------------- */
    if (this.stage === "separate") {
      const s = this.slice;
      s.settle += dt;
      const p = clamp01(s.settle / 1.15);
      s.shift = easeOut(clamp01(s.settle / 0.5)) * 16 * S;
      s.lift = Math.sin(clamp01(s.settle / 1.15) * Math.PI) * 10 * S + easeOut(p) * 2 * S;
      s.rot = easeOut(p) * 0.06;
      if (s.settle > 1.0 && this.beat("offer")) {
        this.setStage("offer");
        this.onCaption("First bite is yours \ud83c\udf70");
        this.onPrompt("tap the slice to take a bite");
      }
    }

    if (this.stage === "offer") {
      const s = this.slice;
      if (!this.bitten) {
        s.z = Math.min(1, s.z + dt * 0.62);          // travels toward the viewer
        s.tilt = easeInOut(clamp01(s.z / 0.9));      // rotates so you see the face
        s.rot = mix(0.06, -0.12, easeInOut(clamp01(s.z)));
        if (s.z > 0.55 && this.beat("closeUp")) AE.plateClink(AE.now(), 0.2);
        if (this.idle > 15 && this.beat("autoBite")) this.takeBite();
      } else {
        s.bite = Math.min(1, s.bite + dt * 3.2);
        s.z = Math.min(1.12, s.z + dt * 0.22);
        if (s.bite >= 1) {
          s.gone += dt;
          if (s.gone > 0.55) {
            this.setStage("done");
            if (this.beat("finish")) {
              AE.sparkle(AE.now(), 2093, 0.07);
              setTimeout(() => { if (this.running && !this.finished) { this.finished = true; this.onFinish(this.lightPoint()); } }, 900);
            }
          }
        }
      }
    }
    if (this.stage === "done") {
      const s = this.slice;
      s.gone += dt;
      s.out = Math.min(1, s.out + dt * 1.3);
    }

    /* ---------------- loose particles ---------------- */
    this.confetti = this.confetti.filter(p => {
      p.age += dt;
      p.vy += 300 * dt * this.S * 0.55;
      p.vx *= 1 - 1.1 * dt;
      p.vx += Math.sin(p.age * p.sp) * 22 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      return p.age < p.life && p.y < this.h + 40;
    });
    this.crumbs = this.crumbs.filter(p => {
      p.age += dt;
      p.vy += 480 * dt * this.S * 0.55;
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.rot += p.vr * dt;
      return p.age < p.life;
    });
    this.sparks = this.sparks.filter(p => { p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt; return p.age < p.life; });
  }

  knifeTip() {
    const k = this.knife, S = this.S;
    const L = 104 * S;
    return { x: k.x + Math.sin(k.ang) * L, y: k.y + Math.cos(k.ang) * L };
  }
  lightPoint() {
    return { x: this.cx, y: this.topY + this.ry, s: 0.4 };
  }

  /* ================================ rendering =============================== */
  draw() {
    const { c, gc, w, h } = this;
    const T = this.T;
    const zoom = 1 + this.cam - (this.stage === "done" ? this.slice.out * 0.05 : 0);

    /* ---- the room: warm dark walls, bokeh string lights, no hard box ---- */
    const room = c.createLinearGradient(0, 0, 0, h);
    room.addColorStop(0, "#080c18");
    room.addColorStop(0.45, "#0f172a");
    room.addColorStop(1, "#141d38");
    c.fillStyle = room; c.fillRect(0, 0, w, h);

    c.save();
    c.translate(w / 2, h * 0.58);
    c.scale(zoom, zoom);
    c.translate(-w / 2, -h * 0.58);

    // string lights, softly out of focus behind everything
    c.save(); c.globalCompositeOperation = "lighter";
    for (const b of this.bokeh) {
      const a = b.a * (0.6 + 0.4 * Math.sin(T * 0.8 + b.p));
      const g = c.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r);
      g.addColorStop(0, b.col.replace(")", "")); // fallback if not hex
      g.addColorStop(0, b.col);
      g.addColorStop(1, "rgba(0,0,0,0)");
      c.globalAlpha = a;
      c.fillStyle = g;
      c.beginPath(); c.arc(b.x, b.y, b.r, 0, 6.3); c.fill();
    }
    c.restore();

    // the candle light fills the room — this is what ties cake to environment
    const lk = this.glowK;
    c.save(); c.globalCompositeOperation = "lighter";
    const amb = c.createRadialGradient(this.cx, this.topY, 8, this.cx, this.topY, Math.max(w, h) * 0.85);
    amb.addColorStop(0, `rgba(255,186,110,${(0.26 * lk + 0.05).toFixed(3)})`);
    amb.addColorStop(0.35, `rgba(255,142,86,${(0.1 * lk + 0.02).toFixed(3)})`);
    amb.addColorStop(1, "rgba(255,120,60,0)");
    c.fillStyle = amb; c.fillRect(0, 0, w, h);
    c.restore();

    this.drawBalloons();
    this.drawTable();

    if (this.stage === "offer" || this.stage === "done") this.dimBackground();

    this.drawCake();
    this.drawCandles(T);
    if (this.stage === "separate") this.drawSeparatingSlice();
    if (this.stage === "cut" && this.knife.on) this.drawKnife();
    this.drawSmoke();
    this.drawBlowers(T);
    if (this.stage === "offer" || this.stage === "done") this.drawOfferedSlice();
    this.drawCrumbs();
    this.drawConfetti();

    c.restore();

    /* ---- glow layer: flames and sparkles, additive ---- */
    gc.clearRect(0, 0, w, h);
    gc.save();
    gc.translate(w / 2, h * 0.58); gc.scale(zoom, zoom); gc.translate(-w / 2, -h * 0.58);
    gc.globalCompositeOperation = "lighter";
    this.drawFlames(T, gc);
    gc.restore();

    // vignette last, so nothing looks like a pasted rectangle
    const vg = c.createRadialGradient(w / 2, h * 0.52, Math.min(w, h) * 0.28, w / 2, h * 0.55, Math.max(w, h) * 0.78);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(6,2,10,.66)");
    c.fillStyle = vg; c.fillRect(0, 0, w, h);
  }

  dimBackground() {
    const { c, w, h } = this;
    const k = this.stage === "done" ? 0.34 : easeInOut(clamp01(this.slice.z)) * 0.34;
    if (k < 0.01) return;
    c.save();
    c.fillStyle = `rgba(12,5,16,${k.toFixed(3)})`;
    c.fillRect(0, 0, w, h);
    c.restore();
  }

  drawTable() {
    const { c, w, h, S } = this;
    const ty = this.tableY;
    // cloth: a surface that recedes, not a rectangle
    const top = c.createLinearGradient(0, ty - 30 * S, 0, h);
    top.addColorStop(0, "#2b3555");
    top.addColorStop(0.18, "#1f2740");
    top.addColorStop(1, "#0a0d1a");
    c.fillStyle = top;
    c.beginPath();
    c.moveTo(-20, h + 20);
    c.quadraticCurveTo(w * 0.5, ty - 34 * S, w + 20, h + 20);
    c.closePath(); c.fill();
    // soft fabric folds
    c.save();
    c.beginPath();
    c.moveTo(-20, h + 20);
    c.quadraticCurveTo(w * 0.5, ty - 34 * S, w + 20, h + 20);
    c.closePath(); c.clip();
    for (let i = 0; i < 7; i++) {
      const x = (i + 0.5) / 7 * w;
      c.strokeStyle = i % 2 ? "rgba(255,200,180,.05)" : "rgba(0,0,0,.16)";
      c.lineWidth = 14 * S;
      c.beginPath();
      c.moveTo(x, ty - 10 * S);
      c.quadraticCurveTo(x + (i - 3) * 10 * S, ty + 60 * S, x + (i - 3) * 22 * S, h);
      c.stroke();
    }
    c.restore();

    // warm pool of candle light on the cloth
    c.save(); c.globalCompositeOperation = "lighter";
    const pool = c.createRadialGradient(this.cx, ty + 6 * S, 4, this.cx, ty + 6 * S, this.R * 3.1);
    pool.addColorStop(0, `rgba(255,170,96,${(0.2 * this.glowK + 0.05).toFixed(3)})`);
    pool.addColorStop(1, "rgba(255,150,80,0)");
    c.fillStyle = pool;
    c.beginPath(); c.ellipse(this.cx, ty + 6 * S, this.R * 3.1, this.R * 0.8, 0, 0, 6.3); c.fill();
    c.restore();

    // plate
    const px = this.R * 1.3, py = this.ry * 1.15;
    const pg = c.createLinearGradient(0, ty - py, 0, ty + py * 1.6);
    pg.addColorStop(0, "#EEF2F8"); pg.addColorStop(0.5, "#D2D9E6"); pg.addColorStop(1, "#96A3B8");
    c.fillStyle = pg;
    c.beginPath(); c.ellipse(this.cx, ty + 7 * S, px, py, 0, 0, 6.3); c.fill();
    c.strokeStyle = "rgba(255,255,255,.5)"; c.lineWidth = 1.2;
    c.beginPath(); c.ellipse(this.cx, ty + 7 * S, px * 0.97, py * 0.9, 0, 0, 6.3); c.stroke();
    // contact shadow — the cake sits ON the plate
    c.save(); c.globalCompositeOperation = "multiply";
    const cs = c.createRadialGradient(this.cx, ty + 4 * S, this.R * 0.2, this.cx, ty + 4 * S, this.R * 1.5);
    cs.addColorStop(0, "rgba(30,8,20,.72)");
    cs.addColorStop(1, "rgba(30,8,20,0)");
    c.fillStyle = cs;
    c.beginPath(); c.ellipse(this.cx, ty + 10 * S, this.R * 1.5, this.ry * 1.25, 0, 0, 6.3); c.fill();
    c.restore();
  }

  /* the sponge / cream / frosting stack shown on any cut face */
  layerBands() {
    const H = this.Hc;
    return [
      { t: 0.00, b: 0.07, col: "#EDF3FF" },   // top frosting
      { t: 0.07, b: 0.30, col: "#E8B98D" },   // sponge
      { t: 0.30, b: 0.38, col: "#FFF6D0" },   // cream
      { t: 0.38, b: 0.62, col: "#E2A473" },   // sponge
      { t: 0.62, b: 0.70, col: "#DCE6FF" },   // berry cream
      { t: 0.70, b: 0.94, col: "#C9865A" },   // sponge
      { t: 0.94, b: 1.00, col: "#9E6039" }    // base crumb
    ].map(l => ({ ...l, y0: l.t * H, y1: l.b * H }));
  }

  ePt(a, rx, ry, ox = 0, oy = 0) {
    return { x: ox + Math.cos(a) * rx, y: oy + Math.sin(a) * ry };
  }

  drawCake() {
    const { c, S } = this;
    const { cx, topY, R, ry, Hc } = this;
    const cutOpen = this.stage !== "wish" && this.cutT > 0.02;
    const removed = this.stage === "separate" || this.stage === "offer" || this.stage === "done";
    const a0 = this.a0, a1 = this.a1;

    /* ---- body: the curved side of the cake ---- */
    c.save();
    const side = new Path2D();
    side.moveTo(cx - R, topY);
    side.ellipse(cx, topY, R, ry, 0, Math.PI, 0, true);   // back edge (hidden top rim)
    side.lineTo(cx + R, topY + Hc);
    side.ellipse(cx, topY + Hc, R, ry, 0, 0, Math.PI, false);
    side.closePath();
    const bodyG = c.createLinearGradient(cx - R, 0, cx + R, 0);
    bodyG.addColorStop(0, "#8fa3c9");
    bodyG.addColorStop(0.18, "#d6e2f7");
    bodyG.addColorStop(0.42, "#edf3ff");
    bodyG.addColorStop(0.72, "#bfcfef");
    bodyG.addColorStop(1, "#7084a8");
    c.fillStyle = bodyG;
    c.fill(side);

    // frosting texture: soft vertical spatula strokes + a horizontal cream band
    c.save();
    c.clip(side);
    for (let i = 0; i < 26; i++) {
      const x = cx - R + (i / 25) * R * 2;
      c.strokeStyle = i % 2 ? "rgba(255,255,255,.10)" : "rgba(150,80,110,.10)";
      c.lineWidth = 4 * S;
      c.beginPath();
      c.moveTo(x, topY + 4 * S);
      c.quadraticCurveTo(x + 3 * S, topY + Hc * 0.5, x - 2 * S, topY + Hc);
      c.stroke();
    }
    // piped cream band round the middle
    const bandY = topY + Hc * 0.52;
    for (let i = 0; i <= 26; i++) {
      const x = cx - R + (i / 26) * R * 2;
      const dy = Math.sqrt(Math.max(0, 1 - Math.pow((x - cx) / R, 2)));
      const g = c.createRadialGradient(x, bandY - 3 * S, 1, x, bandY, 11 * S);
      g.addColorStop(0, "#FFF9EC"); g.addColorStop(1, "#E9C6A6");
      c.fillStyle = g;
      c.beginPath(); c.arc(x, bandY + (1 - dy) * 5 * S, 8.5 * S, 0, 6.3); c.fill();
    }
    // occlusion at the base + sheen near the top
    const occ = c.createLinearGradient(0, topY + Hc - 28 * S, 0, topY + Hc + ry);
    occ.addColorStop(0, "rgba(60,20,40,0)");
    occ.addColorStop(1, "rgba(50,14,32,.55)");
    c.fillStyle = occ; c.fillRect(cx - R, topY + Hc - 28 * S, R * 2, ry + 30 * S);
    c.restore();

    // piped shell border along the bottom
    for (let i = 0; i <= 22; i++) {
      const a = Math.PI * (i / 22);
      const p = this.ePt(a, R * 0.99, ry * 0.99, cx, topY + Hc);
      const g = c.createRadialGradient(p.x - 2 * S, p.y - 3 * S, 1, p.x, p.y, 12 * S);
      g.addColorStop(0, "#FBFDFF"); g.addColorStop(0.6, "#E9F0FF"); g.addColorStop(1, "#A5B8D9");
      c.fillStyle = g;
      c.beginPath(); c.ellipse(p.x, p.y, 9.5 * S, 7.5 * S, a - Math.PI / 2, 0, 6.3); c.fill();
    }
    c.restore();

    /* ---- top surface (minus the wedge once it's gone) ---- */
    c.save();
    const top = new Path2D();
    if (removed) {
      top.moveTo(cx, topY);
      const p0 = this.ePt(a0, R, ry, cx, topY);
      top.lineTo(p0.x, p0.y);
      top.ellipse(cx, topY, R, ry, 0, a0, a1, true);   // the long way round
      top.closePath();
    } else {
      top.ellipse(cx, topY, R, ry, 0, 0, 6.2832);
    }
    const topG = c.createRadialGradient(cx - R * 0.3, topY - ry * 0.4, ry * 0.2, cx, topY, R * 1.15);
    topG.addColorStop(0, "#fbfdff");
    topG.addColorStop(0.55, "#e9f0ff");
    topG.addColorStop(1, "#b7c6e6");
    c.fillStyle = topG;
    c.fill(top);
    // swirled frosting on the top
    c.save(); c.clip(top);
    c.strokeStyle = "rgba(255,255,255,.34)"; c.lineWidth = 3 * S;
    for (let i = 1; i <= 4; i++) {
      c.beginPath();
      c.ellipse(cx, topY, R * (i / 5), ry * (i / 5), 0, 0, 6.3);
      c.stroke();
    }
    c.strokeStyle = "rgba(190,120,150,.18)"; c.lineWidth = 1.6 * S;
    for (let i = 1; i <= 4; i++) {
      c.beginPath();
      c.ellipse(cx + 1.5 * S, topY + 1.5 * S, R * (i / 5), ry * (i / 5), 0, 0, 6.3);
      c.stroke();
    }
    c.restore();
    // sprinkles
    const rs = rngS(4242);
    for (let i = 0; i < 40; i++) {
      const a = RS(rs, 0, 6.2832), rr2 = Math.sqrt(RS(rs, 0.05, 0.92));
      const p = this.ePt(a, R * rr2, ry * rr2, cx, topY);
      if (removed && a > a0 && a < a1 && rr2 > 0.03) continue;
      c.save();
      c.translate(p.x, p.y); c.rotate(RS(rs, 0, 6.3));
      c.fillStyle = ["#E2E8F0", "#CBD5E1", "#A9C0F5", "#6E92EE", "#F1F5F9"][i % 5];
      rr(c, -3 * S, -1.1 * S, 6 * S, 2.2 * S, 1.1 * S); c.fill();
      c.restore();
    }
    c.restore();

    /* ---- the cut: a line that deepens while you drag ---- */
    if (cutOpen && !removed) {
      const prog = this.cutT;
      c.save();
      const m = (a0 + a1) / 2;
      for (const a of [a0, a1]) {
        const e = this.ePt(a, R, ry, cx, topY);
        const t = clamp01(prog * 1.25 - (a === m ? 0 : 0));
        c.strokeStyle = "rgba(120,60,80,.55)";
        c.lineWidth = 2.2 * S;
        c.beginPath();
        c.moveTo(cx, topY);
        c.lineTo(mix(cx, e.x, t), mix(topY, e.y, t));
        c.stroke();
        c.strokeStyle = "rgba(255,255,255,.35)";
        c.lineWidth = 1 * S;
        c.beginPath();
        c.moveTo(cx + 1 * S, topY + 1 * S);
        c.lineTo(mix(cx, e.x, t) + 1 * S, mix(topY, e.y, t) + 1 * S);
        c.stroke();
      }
      // the cut running down the front face, frosting pressed aside
      const e = this.ePt(m, R, ry, cx, topY);
      const depth = clamp01((prog - 0.18) / 0.82);
      if (depth > 0) {
        c.strokeStyle = "rgba(110,52,72,.6)";
        c.lineWidth = 2.6 * S;
        c.beginPath();
        c.moveTo(e.x, e.y);
        c.lineTo(e.x, e.y + depth * Hc);
        c.stroke();
        const push = this.frostPush;
        if (push > 0.02) {
          c.fillStyle = "rgba(255,246,235,.75)";
          for (let i = 0; i < 4; i++) {
            const yy = e.y + depth * Hc - i * 8 * S;
            c.beginPath(); c.arc(e.x - (3 + i) * S * push, yy, (2.6 - i * 0.3) * S, 0, 6.3); c.fill();
            c.beginPath(); c.arc(e.x + (3 + i) * S * push, yy, (2.4 - i * 0.3) * S, 0, 6.3); c.fill();
          }
        }
      }
      c.restore();
    }

    /* ---- once the wedge is out, you can see inside the cake ---- */
    if (removed) {
      const bands = this.layerBands();
      const faces = [
        { a: a0, lit: 0.9 },
        { a: a1, lit: 0.55 }
      ];
      for (const f of faces) {
        const e = this.ePt(f.a, R, ry, cx, topY);
        c.save();
        const face = new Path2D();
        face.moveTo(cx, topY);
        face.lineTo(e.x, e.y);
        face.lineTo(e.x, e.y + Hc);
        face.lineTo(cx, topY + Hc);
        face.closePath();
        c.save(); c.clip(face);
        for (const b of bands) {
          c.fillStyle = b.col;
          c.fillRect(Math.min(cx, e.x) - 4, topY + b.y0, Math.abs(e.x - cx) + 8, b.y1 - b.y0 + 1);
        }
        // crumb texture inside the sponge
        const rs2 = rngS(97 + Math.round(f.a * 100));
        for (let i = 0; i < 70; i++) {
          const x = mix(cx, e.x, RS(rs2, 0, 1)), y = topY + RS(rs2, 0.08, 0.95) * Hc;
          c.fillStyle = `rgba(${RS(rs2, 0, 1) > 0.5 ? "255,246,226" : "140,86,50"},${RS(rs2, 0.08, 0.3).toFixed(2)})`;
          c.beginPath(); c.arc(x, y, RS(rs2, 0.6, 2.1) * S, 0, 6.3); c.fill();
        }
        c.fillStyle = `rgba(40,12,26,${(1 - f.lit) * 0.5})`;
        c.fillRect(Math.min(cx, e.x) - 4, topY, Math.abs(e.x - cx) + 8, Hc);
        c.restore();
        c.strokeStyle = "rgba(80,34,50,.45)"; c.lineWidth = 1.1;
        c.stroke(face);
        c.restore();
      }
      // the floor of the notch
      c.save();
      const floor = new Path2D();
      floor.moveTo(cx, topY + Hc);
      const fp0 = this.ePt(a0, R, ry, cx, topY + Hc);
      floor.lineTo(fp0.x, fp0.y);
      floor.ellipse(cx, topY + Hc, R, ry, 0, a0, a1, false);
      floor.closePath();
      c.fillStyle = "#8A5433";
      c.fill(floor);
      c.fillStyle = "rgba(0,0,0,.28)"; c.fill(floor);
      c.restore();
    }
  }

  drawCandles(T) {
    const { c, S } = this;
    for (const cd of this.candles) {
      const x = cd.x, y = cd.baseY, H = cd.H;
      c.save();
      c.translate(x, y);
      c.rotate(cd.lean);
      // wax body with a spiral stripe
      const g = c.createLinearGradient(-4 * S, 0, 4.5 * S, 0);
      g.addColorStop(0, "#B4C2D6"); g.addColorStop(0.35, "#FFFFFF"); g.addColorStop(1, "#A2AEC8");
      c.fillStyle = g;
      rr(c, -3.4 * S, -H, 6.8 * S, H, 2.4 * S); c.fill();
      c.save();
      rr(c, -3.4 * S, -H, 6.8 * S, H, 2.4 * S); c.clip();
      c.strokeStyle = cd.col; c.lineWidth = 2.6 * S;
      for (let i = -1; i < H / (7 * S) + 1; i++) {
        const yy = -H + i * 7 * S;
        c.beginPath(); c.moveTo(-4 * S, yy); c.lineTo(4 * S, yy + 5 * S); c.stroke();
      }
      c.fillStyle = "rgba(255,255,255,.5)";
      c.fillRect(-2.2 * S, -H + 2 * S, 1.5 * S, H - 4 * S);
      c.restore();
      // a little melted wax at the top
      c.fillStyle = "rgba(255,252,246,.9)";
      c.beginPath(); c.ellipse(0, -H, 3.6 * S, 1.5 * S, 0, 0, 6.3); c.fill();
      // wick — blackened if it has burned
      c.strokeStyle = cd.lit ? "#3A2A22" : "#241A16";
      c.lineWidth = 1.2 * S; c.lineCap = "round";
      c.beginPath(); c.moveTo(0, -H); c.lineTo(cd.lit ? 0.6 * S : -0.4 * S, -H - 4.5 * S); c.stroke();
      c.restore();
    }
  }

  drawFlames(T, gc) {
    const S = this.S;
    for (const cd of this.candles) {
      if (!cd.lit || cd.energy <= 0) continue;
      const bx = cd.x + Math.sin(cd.lean) * -cd.H, by = cd.baseY - cd.H * Math.cos(cd.lean) - 4.5 * S;
      // every flame has its own clock, so they never pulse together
      const n1 = noise1(T * 6.5 + cd.seed, 1);
      const n2 = noise1(T * 11 + cd.seed * 2, 2);
      const stress = cd.stress;
      const lean = this.airDir * -1 * (stress * 1.05) + n1 * (0.07 + stress * 0.5);
      const hgt = (12 + n2 * 1.8) * S * cd.energy * (1 - stress * 0.42);
      const wid = (3.4 + n1 * 0.5) * S * (1 - stress * 0.3) * (0.7 + cd.energy * 0.3);
      const bright = cd.energy * (0.72 + 0.28 * Math.abs(n2)) * (1 - stress * 0.25);

      gc.save();
      gc.translate(bx, by);
      gc.rotate(lean);
      // halo
      const halo = gc.createRadialGradient(0, -hgt * 0.35, 0, 0, -hgt * 0.35, hgt * 3.4);
      halo.addColorStop(0, `rgba(255,206,130,${0.4 * bright})`);
      halo.addColorStop(0.35, `rgba(255,158,70,${0.14 * bright})`);
      halo.addColorStop(1, "rgba(255,140,50,0)");
      gc.fillStyle = halo;
      gc.beginPath(); gc.arc(0, -hgt * 0.35, hgt * 3.4, 0, 6.3); gc.fill();
      // teardrop body
      const flame = new Path2D();
      flame.moveTo(0, -hgt * 1.5);
      flame.bezierCurveTo(wid * 1.15, -hgt * 0.8, wid, -hgt * 0.1, 0, hgt * 0.16);
      flame.bezierCurveTo(-wid, -hgt * 0.1, -wid * 1.15, -hgt * 0.8, 0, -hgt * 1.5);
      const fg = gc.createLinearGradient(0, hgt * 0.16, 0, -hgt * 1.5);
      fg.addColorStop(0, `rgba(90,150,255,${0.85 * bright})`);
      fg.addColorStop(0.18, `rgba(255,214,120,${0.95 * bright})`);
      fg.addColorStop(0.55, `rgba(255,248,214,${0.98 * bright})`);
      fg.addColorStop(1, `rgba(255,176,72,${0.5 * bright})`);
      gc.fillStyle = fg;
      gc.fill(flame);
      // hot core
      gc.fillStyle = `rgba(255,255,246,${0.9 * bright})`;
      gc.beginPath(); gc.ellipse(0, -hgt * 0.55, wid * 0.36, hgt * 0.42, 0, 0, 6.3); gc.fill();
      gc.restore();
    }
    // air streaks, only while actually blowing — subtle, just enough to read
    if (this.air > 0.05 && this.stage === "wish") {
      gc.save();
      gc.strokeStyle = `rgba(200,226,255,${(0.1 * this.air).toFixed(3)})`;
      gc.lineWidth = 1.4 * S;
      for (let i = 0; i < 5; i++) {
        const y = this.topY - 6 * S - i * 9 * S;
        const ph = (this.T * 2.4 + i * 0.4) % 1;
        const x0 = this.cx - this.airDir * this.R * 1.5 + this.airDir * ph * this.R * 2.6;
        gc.globalAlpha = Math.sin(ph * Math.PI) * this.air;
        gc.beginPath();
        gc.moveTo(x0, y);
        gc.quadraticCurveTo(x0 + this.airDir * 22 * S, y - 3 * S, x0 + this.airDir * 44 * S, y);
        gc.stroke();
      }
      gc.restore();
    }
  }

  drawSmoke() {
    const { c } = this;
    if (!this.smoke.length) return;
    c.save();
    for (const s of this.smoke) {
      const k = 1 - s.age / s.life;
      // a thin, faint, vertically stretched wisp — never a white blob over the candle
      const a = Math.min(0.14, k * 0.16) * Math.min(1, s.age * 5);
      if (a <= 0.002) continue;
      const drift = noise1(this.T * 0.6 + s.seed, 8) * 5 * this.S;
      const rad = Math.min(s.r * (1.25 - k * 0.25), 7 * this.S);
      c.save();
      c.translate(s.x + drift, s.y);
      c.scale(0.5, 1.7);
      const g = c.createRadialGradient(0, 0, 0, 0, 0, rad);
      g.addColorStop(0, `rgba(226,224,230,${a})`);
      g.addColorStop(0.6, `rgba(214,212,220,${(a * 0.4).toFixed(4)})`);
      g.addColorStop(1, "rgba(206,204,214,0)");
      c.fillStyle = g;
      c.beginPath(); c.arc(0, 0, rad, 0, 6.3); c.fill();
      c.restore();
    }
    c.restore();
  }

  drawKnife() {
    const { c, S } = this;
    const k = this.knife;
    c.save();
    c.translate(k.x, k.y);
    c.rotate(k.ang);
    const L = 104 * S, Wd = 13 * S;

    // shadow cast onto the cake as it gets close
    c.save();
    c.globalCompositeOperation = "multiply";
    c.fillStyle = `rgba(60,20,40,${(0.18 * this.knifeIn).toFixed(3)})`;
    rr(c, -Wd * 0.4 + 5 * S, 6 * S, Wd * 0.9, L, 3 * S); c.fill();
    c.restore();

    // blade: wide at the bolster, curving to a tip
    const blade = new Path2D();
    blade.moveTo(-Wd * 0.46, 0);
    blade.lineTo(Wd * 0.5, 2 * S);
    blade.quadraticCurveTo(Wd * 0.42, L * 0.72, Wd * 0.06, L);
    blade.quadraticCurveTo(-Wd * 0.3, L * 0.82, -Wd * 0.46, L * 0.52);
    blade.closePath();
    const bg = c.createLinearGradient(-Wd * 0.5, 0, Wd * 0.5, 0);
    bg.addColorStop(0, "#8F9BA8");
    bg.addColorStop(0.22, "#EDF2F7");
    bg.addColorStop(0.48, "#C3CDD8");
    bg.addColorStop(0.72, "#FAFCFE");
    bg.addColorStop(1, "#7E8A97");
    c.fillStyle = bg;
    c.fill(blade);
    // hollow grind + a bright edge line
    c.save(); c.clip(blade);
    c.strokeStyle = "rgba(255,255,255,.55)"; c.lineWidth = 1.6 * S;
    c.beginPath(); c.moveTo(-Wd * 0.16, 6 * S); c.quadraticCurveTo(-Wd * 0.05, L * 0.6, Wd * 0.02, L * 0.94); c.stroke();
    c.strokeStyle = "rgba(255,255,255,.85)"; c.lineWidth = 1.1 * S;
    c.beginPath(); c.moveTo(Wd * 0.46, 4 * S); c.quadraticCurveTo(Wd * 0.38, L * 0.7, Wd * 0.05, L * 0.98); c.stroke();
    // frosting clinging to the blade once it has been through the cake
    if (this.cutT > 0.1) {
      c.fillStyle = `rgba(255,243,232,${Math.min(0.85, this.cutT).toFixed(2)})`;
      for (let i = 0; i < 7; i++) {
        const t = 0.25 + i * 0.1;
        c.beginPath(); c.ellipse(mix(-Wd * 0.2, Wd * 0.2, (i % 3) / 2), L * t, 3.6 * S, 6 * S, 0.2, 0, 6.3); c.fill();
      }
    }
    c.restore();
    c.strokeStyle = "rgba(40,54,70,.45)"; c.lineWidth = 0.9; c.stroke(blade);

    // bolster + riveted handle
    c.fillStyle = "#C2CBD6";
    rr(c, -Wd * 0.5, -6 * S, Wd, 8 * S, 2 * S); c.fill();
    const hg = c.createLinearGradient(-Wd * 0.46, 0, Wd * 0.46, 0);
    hg.addColorStop(0, "#2C1E26"); hg.addColorStop(0.4, "#52363F"); hg.addColorStop(0.75, "#3A2831"); hg.addColorStop(1, "#1E1418");
    c.fillStyle = hg;
    rr(c, -Wd * 0.46, -52 * S, Wd * 0.92, 47 * S, 5 * S); c.fill();
    c.fillStyle = "rgba(255,255,255,.16)";
    rr(c, -Wd * 0.28, -48 * S, Wd * 0.2, 40 * S, 2 * S); c.fill();
    c.fillStyle = "#9AA6B2";
    [-40, -26].forEach(yy => { c.beginPath(); c.arc(0, yy * S, 1.9 * S, 0, 6.3); c.fill(); });
    c.restore();
  }

  /* the wedge while it is easing out of the cake, still in place */
  drawSeparatingSlice() {
    const s = this.slice;
    this.paintWedge(this.c, this.cx, this.topY, 1, 0, s.rot, 0, {
      dx: Math.cos((this.a0 + this.a1) / 2) * s.shift,
      dy: Math.sin((this.a0 + this.a1) / 2) * s.shift - s.lift
    });
  }

  /* the wedge travelling toward the viewer, with real perspective */
  drawOfferedSlice() {
    const { c, S } = this;
    const s = this.slice;
    const z = Math.min(s.z, 0.95);
    // perspective: the closer it is, the bigger it gets. Capped so the wedge
    // stops at a readable distance instead of overflowing the viewport.
    const f = 2.5;
    const scale = f / (f - z * 1.42);
    const originX = this.cx + Math.cos((this.a0 + this.a1) / 2) * this.R * 0.5;
    const originY = this.topY + Math.sin((this.a0 + this.a1) / 2) * this.ry * 0.5;
    // the wedge is painted outward from its apex, so its mass sits down-and-right
    // of that point. Aim the apex up-left by the wedge's own centroid, otherwise
    // the slice runs off the right and bottom edges as it comes close.
    const cxOff = this.R * 0.36 * scale, cyOff = this.Hc * 0.46 * scale;
    const tx = mix(originX, this.w * 0.5 - cxOff, easeInOut(clamp01(z)));
    const ty = mix(originY - 10 * S, this.h * 0.46 - cyOff, easeInOut(clamp01(z)));
    const out = this.stage === "done" ? this.slice.out : 0;

    // render into the buffer so we can punch a real bite out of it
    const b = this.slc, bw = this.slW, bh = this.slH;
    b.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    b.clearRect(0, 0, bw, bh);
    const ox = bw * 0.5, oy = bh * 0.3;
    this.paintWedge(b, ox, oy, 1, s.tilt, s.rot, 1);
    if (s.bite > 0) {
      // a crescent actually removed from the front point of the slice
      const tip = { x: ox + Math.cos((this.a0 + this.a1) / 2) * this.R * 0.18, y: oy + this.Hc * 0.3 };
      b.save();
      b.globalCompositeOperation = "destination-out";
      const r = this.R * 0.38 * easeOut(s.bite);
      b.beginPath(); b.arc(tip.x - this.R * 0.1, tip.y - this.Hc * 0.12, r, 0, 6.3); b.fill();
      b.restore();
      // dark inner shade where the bite went in
      b.save();
      b.globalCompositeOperation = "source-atop";
      const bg = b.createRadialGradient(tip.x - this.R * 0.1, tip.y - this.Hc * 0.12, r * 0.6, tip.x - this.R * 0.1, tip.y - this.Hc * 0.12, r * 1.5);
      bg.addColorStop(0, "rgba(70,32,16,.5)");
      bg.addColorStop(1, "rgba(70,32,16,0)");
      b.fillStyle = bg; b.fillRect(0, 0, bw, bh);
      b.restore();
    }

    c.save();
    c.globalAlpha = 1 - out;
    c.translate(tx, ty - out * this.h * 0.1);
    c.scale(scale * (1 - out * 0.1), scale * (1 - out * 0.1));
    c.rotate(s.rot);
    // soft shadow under it, growing as it comes closer
    c.save();
    c.globalCompositeOperation = "multiply";
    const sh = c.createRadialGradient(0, this.Hc * 0.75, 4, 0, this.Hc * 0.75, this.R * 1.2);
    sh.addColorStop(0, "rgba(20,4,12,.5)"); sh.addColorStop(1, "rgba(20,4,12,0)");
    c.fillStyle = sh;
    c.beginPath(); c.ellipse(0, this.Hc * 0.78, this.R * 1.1, this.ry * 0.9, 0, 0, 6.3); c.fill();
    c.restore();
    c.drawImage(this.slcv, -ox, -oy, bw, bh);
    c.restore();

    // crumbs falling from the bite
    if (s.bite > 0 && s.bite < 1 && Math.random() < 0.4) {
      this.addCrumb(tx + rnd(-20, 20) * S, ty + rnd(0, 20) * S, 0.7);
    }
  }

  /* ------------------------------------------------------------------
     One cake wedge: top face, two cut faces showing the layer stack,
     and the frosted outer arc. tilt (0..1) rotates it toward the viewer
     so you see more of the top as it approaches.
     ------------------------------------------------------------------ */
  paintWedge(c, ox, oy, scale, tilt, rot, detached, off = { dx: 0, dy: 0 }) {
    const S = this.S;
    const R = this.R * 0.98 * scale, Hc = this.Hc * scale;
    const ry = this.ry * mix(1, 2.05, tilt) * scale;     // more top face as it tips up
    const a0 = this.a0, a1 = this.a1;
    const bands = this.layerBands();
    const x = ox + off.dx, y = oy + off.dy;

    const E = a => ({ x: x + Math.cos(a) * R, y: y + Math.sin(a) * ry });
    const p0 = E(a0), p1 = E(a1);

    c.save();

    /* ---- outer frosted arc (the cake's curved side) ---- */
    const arc = new Path2D();
    arc.moveTo(p0.x, p0.y);
    arc.ellipse(x, y, R, ry, 0, a0, a1, false);
    arc.lineTo(p1.x, p1.y + Hc);
    arc.ellipse(x, y + Hc, R, ry, 0, a1, a0, true);
    arc.closePath();
    const ag = c.createLinearGradient(p1.x, 0, p0.x, 0);
    ag.addColorStop(0, "#7c8fb8");
    ag.addColorStop(0.3, "#d6e2f7");
    ag.addColorStop(0.62, "#edf3ff");
    ag.addColorStop(1, "#8e9ec5");
    c.fillStyle = ag; c.fill(arc);
    c.save(); c.clip(arc);
    // cream band continues round the slice
    const bandY = y + Hc * 0.52;
    for (let i = 0; i <= 12; i++) {
      const a = mix(a0, a1, i / 12);
      const p = E(a);
      const g = c.createRadialGradient(p.x, bandY - 3 * S, 1, p.x, bandY, 11 * S);
      g.addColorStop(0, "#FFF9EC"); g.addColorStop(1, "#E9C6A6");
      c.fillStyle = g;
      c.beginPath(); c.arc(p.x, bandY, 8 * S, 0, 6.3); c.fill();
    }
    const occ = c.createLinearGradient(0, y + Hc - 26 * S, 0, y + Hc + ry);
    occ.addColorStop(0, "rgba(60,20,40,0)"); occ.addColorStop(1, "rgba(50,14,32,.5)");
    c.fillStyle = occ; c.fillRect(x - R, y + Hc - 26 * S, R * 2, ry + 30 * S);
    c.restore();
    // piped shells along the bottom of the arc
    for (let i = 0; i <= 8; i++) {
      const a = mix(a0, a1, i / 8);
      const p = E(a);
      const g = c.createRadialGradient(p.x - 2 * S, p.y + Hc - 3 * S, 1, p.x, p.y + Hc, 12 * S);
      g.addColorStop(0, "#FBFDFF"); g.addColorStop(0.6, "#E9F0FF"); g.addColorStop(1, "#A5B8D9");
      c.fillStyle = g;
      c.beginPath(); c.ellipse(p.x, p.y + Hc, 9 * S, 7 * S, a - Math.PI / 2, 0, 6.3); c.fill();
    }

    /* ---- the two cut faces: this is where the cake shows its layers ---- */
    const faces = [{ p: p0, lit: 1 }, { p: p1, lit: 0.62 }];
    for (const f of faces) {
      const face = new Path2D();
      face.moveTo(x, y);
      face.lineTo(f.p.x, f.p.y);
      face.lineTo(f.p.x, f.p.y + Hc);
      face.lineTo(x, y + Hc);
      face.closePath();
      c.save();
      c.clip(face);
      const lo = Math.min(x, f.p.x) - 4, wd = Math.abs(f.p.x - x) + 8;
      for (const bd of bands) {
        c.fillStyle = bd.col;
        c.fillRect(lo, y + bd.y0 * scale, wd, (bd.y1 - bd.y0) * scale + 1);
      }
      // crumb structure so the sponge is not a flat band
      const rs = rngS(f.lit > 0.8 ? 1337 : 7331);
      for (let i = 0; i < 90; i++) {
        const px = mix(x, f.p.x, RS(rs, 0, 1)), py = y + RS(rs, 0.08, 0.96) * Hc;
        const light = RS(rs, 0, 1) > 0.5;
        c.fillStyle = `rgba(${light ? "255,248,232" : "146,90,54"},${RS(rs, 0.1, 0.34).toFixed(2)})`;
        c.beginPath(); c.arc(px, py, RS(rs, 0.7, 2.3) * S, 0, 6.3); c.fill();
      }
      // glossy cream layers catch the light
      for (const bd of bands) {
        if (bd.col === "#FFF6D0" || bd.col === "#DCE6FF") {
          const g = c.createLinearGradient(0, y + bd.y0 * scale, 0, y + bd.y1 * scale);
          g.addColorStop(0, "rgba(255,255,255,.5)");
          g.addColorStop(1, "rgba(255,255,255,0)");
          c.fillStyle = g;
          c.fillRect(lo, y + bd.y0 * scale, wd, (bd.y1 - bd.y0) * scale);
        }
      }
      c.fillStyle = `rgba(10,16,34,${((1 - f.lit) * 0.42).toFixed(3)})`;
      c.fillRect(lo, y, wd, Hc);
      c.restore();
      c.strokeStyle = "rgba(120,140,190,.35)"; c.lineWidth = 1; c.stroke(face);
    }

    /* ---- top face last, so the frosting sits on top of everything ---- */
    const top = new Path2D();
    top.moveTo(x, y);
    top.lineTo(p0.x, p0.y);
    top.ellipse(x, y, R, ry, 0, a0, a1, false);
    top.closePath();
    const tg = c.createRadialGradient(x + R * 0.2, y + ry * 0.3, ry * 0.1, x, y + ry * 0.4, R);
    tg.addColorStop(0, "#FBFDFF");
    tg.addColorStop(0.5, "#E9F0FF");
    tg.addColorStop(1, "#b0bfe2");
    c.fillStyle = tg; c.fill(top);
    c.save(); c.clip(top);
    c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 3 * S;
    for (let i = 1; i <= 4; i++) { c.beginPath(); c.ellipse(x, y, R * (i / 5), ry * (i / 5), 0, a0 - 0.2, a1 + 0.2); c.stroke(); }
    // sprinkles + one piped rosette near the outer edge
    const rs3 = rngS(555);
    for (let i = 0; i < 14; i++) {
      const a = RS(rs3, a0 + 0.06, a1 - 0.06), rr2 = Math.sqrt(RS(rs3, 0.15, 0.92));
      const p = { x: x + Math.cos(a) * R * rr2, y: y + Math.sin(a) * ry * rr2 };
      c.save(); c.translate(p.x, p.y); c.rotate(RS(rs3, 0, 6.3));
      c.fillStyle = ["#E2E8F0", "#CBD5E1", "#A9C0F5", "#6E92EE"][i % 4];
      rr(c, -3 * S, -1.1 * S, 6 * S, 2.2 * S, 1.1 * S); c.fill();
      c.restore();
    }
    const ra = (a0 + a1) / 2, rp = { x: x + Math.cos(ra) * R * 0.68, y: y + Math.sin(ra) * ry * 0.68 };
    const rg = c.createRadialGradient(rp.x - 3 * S, rp.y - 4 * S, 1, rp.x, rp.y, 13 * S);
    rg.addColorStop(0, "#FFFFFF"); rg.addColorStop(0.55, "#E9F0FF"); rg.addColorStop(1, "#9BAFE0");
    c.fillStyle = rg;
    c.beginPath(); c.ellipse(rp.x, rp.y, 11 * S, 8 * S, 0, 0, 6.3); c.fill();
    c.fillStyle = "#E4405A";
    c.beginPath(); c.arc(rp.x, rp.y - 4 * S, 4.2 * S, 0, 6.3); c.fill();
    c.fillStyle = "rgba(255,255,255,.6)";
    c.beginPath(); c.arc(rp.x - 1.4 * S, rp.y - 5.6 * S, 1.3 * S, 0, 6.3); c.fill();
    c.restore();
    c.strokeStyle = "rgba(190,130,155,.4)"; c.lineWidth = 1; c.stroke(top);

    c.restore();
  }

  drawBalloons() {
    const { c, S } = this;
    for (const b of this.balloons) {
      const z = b.z, bw = 19 * S * z, bh = 24 * S * z;
      c.save();
      c.translate(b.x, b.y);
      c.rotate(Math.sin(b.sw * 0.8) * 0.08);
      c.globalAlpha = 0.55 + z * 0.4;
      c.strokeStyle = "rgba(255,240,240,.2)"; c.lineWidth = Math.max(0.5, z);
      c.beginPath(); c.moveTo(0, bh);
      c.bezierCurveTo(bw * 0.6, bh + 26 * S * z, -bw * 0.5, bh + 52 * S * z, bw * 0.2, bh + 78 * S * z);
      c.stroke();
      const g = c.createRadialGradient(-bw * 0.34, -bh * 0.4, bw * 0.1, 0, 0, bw * 1.5);
      g.addColorStop(0, "rgba(255,255,255,.72)");
      g.addColorStop(0.22, b.col);
      g.addColorStop(1, "rgba(0,0,0,.45)");
      c.fillStyle = g;
      c.beginPath(); c.ellipse(0, 0, bw, bh, 0, 0, 6.3); c.fill();
      c.fillStyle = b.col;
      c.beginPath(); c.moveTo(-3 * S * z, bh - 1); c.lineTo(3 * S * z, bh - 1); c.lineTo(0, bh + 5 * S * z); c.closePath(); c.fill();
      c.restore();
    }
  }

  drawConfetti() {
    const { c } = this;
    for (const p of this.confetti) {
      const k = 1 - p.age / p.life;
      c.save();
      c.globalAlpha = Math.min(1, k * 2.2);
      c.translate(p.x, p.y);
      c.rotate(p.rot);
      // flat pieces flip as they fall, so they thin out and thicken again
      const flip = Math.abs(Math.cos(p.age * p.sp * 1.6));
      c.fillStyle = p.col;
      c.fillRect(-p.w / 2, -p.h / 2 * flip, p.w, Math.max(0.8, p.h * flip));
      c.restore();
    }
  }
  drawCrumbs() {
    const { c } = this;
    for (const p of this.crumbs) {
      const k = 1 - p.age / p.life;
      c.save();
      c.globalAlpha = Math.min(1, k * 2);
      c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.col;
      c.beginPath(); c.ellipse(0, 0, p.r, p.r * 0.72, 0, 0, 6.3); c.fill();
      c.restore();
    }
  }

  /* small, curled, and kept well away from the cake */
  drawBlowers(T) {
    const { c, w, h, S } = this;
    for (const b of this.blowers) {
      const ext = Math.max(0, Math.min(1.15, b.ext));
      if (ext <= 0.015) continue;
      const x = b.side < 0 ? w * 0.115 : w * 0.885, y = h * 0.9;
      c.save();
      c.translate(x, y);
      c.scale(b.side, 1);
